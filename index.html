<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仓库管理系统 · 精简稳定版</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        /* 样式与之前基本相同，此处省略以节省长度，请使用之前完整样式 */
        :root{--bg:#f0f2f5;--card-bg:#fff;--primary:#1a73e8;--success:#34a853;--danger:#ea4335;--warning:#fbbc04;--text:#202124;--text-secondary:#5f6368;--border:#dadce0;--shadow:0 1px 3px rgba(0,0,0,.1);--radius:12px;--radius-sm:8px;--cell-size:56px;--cell-gap:4px;--row-label-width:44px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
        .header{background:var(--card-bg);border-bottom:1px solid var(--border);padding:0 12px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);gap:8px}
        .header-left{display:flex;align-items:center;gap:8px;min-width:0}
        .logo-icon{width:30px;height:30px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;flex-shrink:0}
        .header h1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .header-stats{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
        .header-stats::-webkit-scrollbar{display:none}
        .stat-chip{display:flex;align-items:center;gap:3px;font-size:9px;color:var(--text-secondary);background:#f8f9fa;padding:2px 6px;border-radius:10px;border:1px solid var(--border);white-space:nowrap}
        .sync-badge{font-size:9px;padding:2px 6px;border-radius:10px;background:#fff8e1;color:#f57c00;white-space:nowrap}
        .sync-badge.online{background:#e8f5e9;color:#2e7d32}
        .sync-badge.offline{background:#ffebee;color:#c62828}
        .main-container{display:flex;flex-direction:column;height:calc(100vh - 52px);overflow:hidden}
        .left-panel{background:var(--card-bg);border-bottom:1px solid var(--border);padding:6px 8px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
        .left-panel::-webkit-scrollbar{display:none}
        .left-panel-top{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
        .panel-title{font-size:11px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
        .zone-list{display:flex;flex-direction:row;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
        .zone-list::-webkit-scrollbar{display:none}
        .zone-item{padding:6px 12px;border-radius:16px;border:2px solid var(--border);cursor:pointer;background:#fafafa;white-space:nowrap;font-size:12px;display:flex;align-items:center;gap:4px;flex-shrink:0;min-width:fit-content}
        .zone-item.active{border-color:var(--primary);background:#e8f0fe;font-weight:600}
        .zone-delete-btn{width:18px;height:18px;border-radius:50%;border:none;background:#f1f3f4;cursor:pointer;display:inline-flex!important;align-items:center;justify-content:center;font-size:10px;color:var(--danger);margin-left:2px;flex-shrink:0}
        .add-zone-btn{padding:6px 12px;border:2px dashed var(--border);border-radius:16px;background:transparent;cursor:pointer;font-size:12px;white-space:nowrap;flex-shrink:0}
        .center-panel{flex:1;overflow-y:auto;background:var(--bg);padding:8px 10px;-webkit-overflow-scrolling:touch}
        .center-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:6px}
        .center-header h2{font-size:16px;font-weight:600}
        .legend{display:flex;gap:6px;flex-wrap:wrap;font-size:9px}
        .grid-container{background:var(--card-bg);border-radius:var(--radius);padding:6px;box-shadow:var(--shadow);overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%}
        .grid-side-by-side{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;width:100%}
        .grid-table{display:flex;flex-direction:column;gap:3px;flex-shrink:0;min-width:max-content}
        .grid-col-label-row{display:flex;align-items:center;gap:var(--cell-gap);margin-bottom:2px;padding-left:calc(var(--row-label-width) + var(--cell-gap))}
        .grid-col-label{width:var(--cell-size);text-align:center;font-size:9px;font-weight:600;color:var(--text-secondary)}
        .grid-row{display:flex;align-items:center;gap:var(--cell-gap)}
        .grid-row-label{width:var(--row-label-width);font-size:9px;font-weight:600;color:var(--text-secondary);text-align:right}
        .cell{width:var(--cell-size);height:48px;border-radius:4px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;text-align:center;position:relative;flex-shrink:0;user-select:none;overflow:hidden;touch-action:manipulation}
        .cell:active{transform:scale(0.96)}
        .cell.status-normal{background:#e8f5e9;border-color:#4caf50;color:#2e7d32}
        .cell.status-unavailable{background:#ffebee;border-color:#ef5350;color:#c62828;opacity:.8}
        .cell.status-used{color:#fff;border-color:#333}
        .cell .cell-label{font-weight:600;font-size:8px;line-height:1.1;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .cell .cell-batch{font-size:6px;position:absolute;bottom:1px;left:1px;right:1px;white-space:nowrap;overflow:hidden;text-overflow:clip;color:inherit}
        .cell .cell-qty{font-size:7px;font-weight:700;position:absolute;top:1px;right:2px;background:rgba(255,255,255,.85);border-radius:2px;padding:0 2px;color:#000}
        .cell .fifo-rank{position:absolute;top:1px;left:2px;background:rgba(0,0,0,.5);color:#fff;font-size:6px;padding:0 2px;border-radius:2px}
        .cell .new-badge{position:absolute;left:2px;top:50%;transform:translateY(-50%);background:var(--success);color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .yesterday-badge{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:#ff9800;color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .hand-badge{position:absolute;bottom:1px;left:2px;background:#ff9800;color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .select-checkbox{position:absolute;top:2px;left:2px;z-index:2;width:12px;height:12px}
        .right-panel{background:var(--card-bg);border-top:1px solid var(--border);padding:8px;flex-shrink:0;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
        .right-panel::-webkit-scrollbar{display:none}
        .right-section{background:#f8f9fa;border-radius:var(--radius-sm);padding:8px;border:1px solid var(--border);min-width:160px;max-width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
        .right-section h3{font-size:10px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
        .product-list{display:flex;flex-direction:column;gap:3px;max-height:100px;overflow-y:auto}
        .product-item{padding:4px 6px;background:#fff;border-radius:3px;border:1px solid var(--border);font-size:10px;display:flex;gap:3px;align-items:center;cursor:pointer;white-space:nowrap}
        .product-item.selected{background:#e8f0fe;border-color:var(--primary)}
        .batch-toolbar{display:none;gap:3px;margin-top:3px;flex-wrap:wrap}
        .batch-toolbar.active{display:flex}
        .location-batch-toolbar{display:none;gap:3px;margin-top:3px;flex-wrap:wrap}
        .location-batch-toolbar.active{display:flex}
        .btn{padding:6px 10px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;touch-action:manipulation}
        .btn:active{transform:scale(0.95)}
        .btn-primary{background:var(--primary);color:#fff}
        .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
        .btn-danger{background:var(--danger);color:#fff}
        .btn-success{background:var(--success);color:#fff}
        .btn-warning{background:var(--warning);color:#333}
        .btn-info{background:#2196f3;color:#fff}
        .btn-sm{padding:3px 6px;font-size:9px;border-radius:3px}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px}
        .modal{background:#fff;border-radius:var(--radius);padding:16px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
        .modal h2{font-size:16px;margin-bottom:12px}
        .form-group{margin-bottom:10px}
        .form-group label{display:block;font-size:11px;font-weight:500;margin-bottom:3px;color:var(--text-secondary)}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 8px;border:1.5px solid var(--border);border-radius:5px;font-size:13px}
        .toast-container{position:fixed;top:52px;right:8px;z-index:2000;display:flex;flex-direction:column;gap:5px;max-width:250px}
        .toast{padding:8px 12px;border-radius:6px;color:#fff;font-size:11px;cursor:pointer;box-shadow:var(--shadow)}
        .toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--primary)}
        .records-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:11px}
        .records-table th,.records-table td{padding:5px 3px;text-align:left;border-bottom:1px solid var(--border)}
        @media(min-width:768px){
            .main-container{flex-direction:row}
            .left-panel{width:230px;height:auto;flex-direction:column;border-right:1px solid var(--border);border-bottom:none;overflow-y:auto;overflow-x:hidden;padding:12px;gap:8px}
            .zone-list{flex-direction:column;overflow-x:visible;overflow-y:auto}
            .zone-item{white-space:normal;border-radius:var(--radius-sm)}
            .center-panel{padding:16px 20px}
            .cell{width:60px;height:52px;font-size:9px}
            .cell .cell-label{font-size:8px}
            .grid-col-label{width:60px;font-size:10px}
            .grid-row-label{font-size:10px;width:50px}
            .right-panel{width:280px;flex-direction:column;border-left:1px solid var(--border);border-top:none;overflow-y:auto;overflow-x:hidden;padding:12px;gap:8px}
            .right-section{min-width:auto;max-width:none}
            .header h1{font-size:16px}
            .stat-chip{font-size:11px}
            .btn{font-size:12px}
            .btn-sm{font-size:10px}
        }
        @media(min-width:1200px){
            :root{--cell-size:72px;--cell-gap:6px;--row-label-width:56px}
            .cell{width:var(--cell-size);height:60px;font-size:10px}
            .cell .cell-label{font-size:9px}
            .cell .cell-batch{font-size:7px;bottom:2px}
            .cell .cell-qty{font-size:8px;top:2px;right:3px}
            .cell .fifo-rank{font-size:7px;top:2px;left:3px}
            .cell .new-badge,.cell .yesterday-badge,.cell .hand-badge{font-size:7px;padding:0 3px}
            .grid-col-label{width:var(--cell-size);font-size:11px}
            .grid-row-label{width:var(--row-label-width);font-size:11px}
            .center-header h2{font-size:20px}
            .right-panel{width:320px}
            .right-section{min-width:200px}
            .product-item{font-size:12px}
            .btn{font-size:13px}
            .btn-sm{font-size:11px}
        }
    </style>
</head>
<body>
<header class="header">
    <div class="header-left"><div class="logo-icon">📦</div><h1>仓库管理系统</h1></div>
    <div class="header-stats" id="headerStats">
        <span class="sync-badge" id="syncBadge">🟡 连接中...</span>
        <span class="stat-chip">正常 <b id="statNormal">0</b></span>
        <span class="stat-chip">不可用 <b id="statUnavailable">0</b></span>
        <span class="stat-chip">已用 <b id="statUsed">0</b></span>
        <span class="stat-chip">产品 <b id="statProducts">0</b></span>
    </div>
</header>
<div class="main-container">
    <aside class="left-panel">
        <div class="left-panel-top">
            <span class="panel-title">仓位区域</span>
        </div>
        <div class="zone-list" id="zoneList"></div>
        <button class="add-zone-btn" id="btnAddZone">+ 添加区域</button>
    </aside>
    <main class="center-panel">
        <div class="center-header">
            <div><h2 id="currentZoneTitle">成品区</h2><span id="currentZoneInfo" style="font-size:11px;color:var(--text-secondary)"></span></div>
            <div class="legend"><span>🟢正常</span><span>🔴不可用</span><span>🔵已用</span><span>🟢今</span><span>🟠昨</span><span>🟠账</span></div>
            <button class="btn btn-outline btn-sm" id="btnToggleLocationBatch">库位批量</button>
        </div>
        <div class="location-batch-toolbar" id="locationBatchToolbar">
            <button class="btn btn-sm btn-success" onclick="batchStockInLocations()">批量入库</button>
            <button class="btn btn-sm btn-danger" onclick="batchDeleteLocations()">批量删除</button>
            <button class="btn btn-sm btn-info" onclick="batchAddToTransit()">批量加入中转仓</button>
            <button class="btn btn-sm btn-outline" onclick="exitLocationBatchMode()">退出</button>
        </div>
        <div class="grid-container" id="gridContainer"></div>
    </main>
    <aside class="right-panel">
        <div class="right-section"><h3>📦 产品</h3><div style="display:flex;gap:4px;"><button class="btn btn-outline btn-sm" id="btnToggleBatch">批量</button><button class="btn btn-primary btn-sm" id="btnAddProduct">+</button></div><div class="product-list" id="productList"></div><div class="batch-toolbar" id="batchToolbar"><button class="btn btn-sm btn-warning" onclick="batchUpdateUnit()">单位</button><button class="btn btn-sm btn-warning" onclick="batchUpdateUnitQuantity()">单位数量</button><button class="btn btn-sm btn-danger" onclick="batchDeleteProducts()">删除</button><button class="btn btn-sm btn-outline" onclick="clearSelectionAndExit()">取消</button></div></div>
        <div class="right-section"><h3>📊 统计</h3><div id="zoneStats" style="font-size:10px"></div></div>
        <div class="right-section"><h3>📋 记录</h3><button class="btn btn-outline btn-sm" id="btnShowRecords">出入库</button></div>
        <div class="right-section"><h3>🚚 中转仓</h3><button class="btn btn-outline btn-sm" id="btnShowTransit">查看中转仓</button></div>
        <div class="right-section"><h3>💾 数据</h3><div style="display:flex;gap:4px;flex-wrap:wrap;"><button class="btn btn-outline btn-sm" id="btnExportData">备份</button><button class="btn btn-outline btn-sm" id="btnImportData">恢复</button></div></div>
    </aside>
</div>
<div id="modalContainer"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
// Firebase 配置
const firebaseConfig={apiKey:"AIzaSyDu1NYuTLUxIMkkaXdJGFgE0GXGW0hwXto",authDomain:"warehouse-manager-4eec5.firebaseapp.com",databaseURL:"https://warehouse-manager-4eec5-default-rtdb.firebaseio.com",projectId:"warehouse-manager-4eec5",storageBucket:"warehouse-manager-4eec5.firebasestorage.app",messagingSenderId:"504489473795",appId:"1:504489473795:web:4bfac7455150709994db36"};
firebase.initializeApp(firebaseConfig);
const database=firebase.database();
const dbRef=database.ref('warehouse/data');

// 全局数据
let db={zones:[],locations:[],products:[],records:[],transit:[],nextZoneId:1,nextLocationId:1,nextProductId:1,nextRecordId:1,nextTransitId:1};
let currentZoneId=1,batchMode=false,selectedProducts=new Set(),locationBatchMode=false,selectedLocations=new Set(),isDBLoaded=false;
let recordFilter='all',recordStartDate='',recordEndDate='',recordProductFilter='all',recordModelFilter='all';
let transitFilterProduct='all';
let lastBatchNo='';

// 默认数据库
function createDefaultDB(){
    const d={zones:[],locations:[],products:[],records:[],transit:[],nextZoneId:1,nextLocationId:1,nextProductId:1,nextRecordId:1,nextTransitId:1};
    const bz={id:1,name:'成品区',rows:34,cols:5,isBase:true,createdAt:new Date().toISOString()};
    d.zones.push(bz); d.nextZoneId=2;
    for(let r=1;r<=34;r++) for(let c=1;c<=5;c++) d.locations.push({id:d.nextLocationId++,zoneId:1,rowNum:r,colNum:c,status:'normal',productId:null,batchNo:null,quantity:0,customPieces:0,remark:'',handAccount:false,updatedAt:null});
    return d;
}
function ensureCompleteDB(data){
    if(!data||typeof data!=='object')return createDefaultDB();
    if(!Array.isArray(data.zones))data.zones=[];
    if(!Array.isArray(data.locations))data.locations=[];
    if(!Array.isArray(data.products))data.products=[];
    if(!Array.isArray(data.records))data.records=[];
    if(!Array.isArray(data.transit))data.transit=[];
    if(!data.nextZoneId)data.nextZoneId=1;
    if(!data.nextLocationId)data.nextLocationId=1;
    if(!data.nextProductId)data.nextProductId=1;
    if(!data.nextRecordId)data.nextRecordId=1;
    if(!data.nextTransitId)data.nextTransitId=1;
    data.products.forEach(p=>{if(!p.unit)p.unit='件';if(!p.remark)p.remark='';});
    data.locations.forEach(l=>{if(!l.remark)l.remark='';if(l.customPieces===undefined)l.customPieces=0;if(l.handAccount===undefined)l.handAccount=false;});
    return data;
}

// 初始化
function initFromFirebase(){
    const timeout=setTimeout(()=>{
        if(!isDBLoaded){
            db=createDefaultDB();isDBLoaded=true;renderAll();updateSyncBadge(false);showToast('Firebase连接超时','error');
        }
    },8000);
    dbRef.once('value',snapshot=>{
        clearTimeout(timeout);
        const raw=snapshot.val();
        db=ensureCompleteDB(raw||null);
        if(!raw)dbRef.set(db);
        isDBLoaded=true;
        renderAll();
        startRealtimeListener();
        updateSyncBadge(true);
    }).catch(()=>{
        clearTimeout(timeout);
        db=createDefaultDB();isDBLoaded=true;renderAll();updateSyncBadge(false);showToast('无法连接云端','error');
    });
}
function startRealtimeListener(){
    dbRef.on('value',snapshot=>{
        const data=ensureCompleteDB(snapshot.val()||null);
        db=data;
        renderAll();
        updateSyncBadge(true);
    });
    database.ref('.info/connected').on('value',snap=>{
        updateSyncBadge(snap.val()===true);
    });
}
function updateSyncBadge(online){
    const b=document.getElementById('syncBadge');
    if(online){b.textContent='🟢 已同步';b.className='sync-badge online';}
    else{b.textContent='🔴 离线';b.className='sync-badge offline';}
}
function saveDB(newDb){
    db=ensureCompleteDB(newDb);
    dbRef.set(db).catch(err=>showToast('保存失败','error'));
}
function addRecord(targetDb,type,product,loc,zone,quantity,customPieces,remark,targetZoneName,targetLocationLabel,locationId){
    if(!targetDb||!Array.isArray(targetDb.records))return;
    const rec={
        id:targetDb.nextRecordId++,
        type:type,
        productId:product.id,
        productName:product.name,
        productModel:product.model||'',
        productUnit:product.unit,
        zoneName:zone?.name||'未知',
        locationLabel:getRowDisplayLabel(zone,loc.rowNum)+'排'+getDisplayColNumber(zone,loc.colNum)+'托',
        quantity:quantity||0,
        customPieces:customPieces||0,
        batchNo:loc.batchNo||'',
        remark:remark||'',
        targetZoneName:targetZoneName||'',
        targetLocationLabel:targetLocationLabel||'',
        locationId:locationId||loc.id,
        timestamp:new Date().toISOString()
    };
    targetDb.records.push(rec);
}
function getProductDisplayInfo(pid){
    if(!db||!Array.isArray(db.products))return{pieces:0,unit:'件',unitQuantity:1,remark:''};
    const p=db.products.find(x=>x.id===pid);
    if(!p)return{pieces:0,unit:'件',unitQuantity:1,remark:''};
    const rp=db.locations.filter(l=>l.productId===pid&&l.status==='used').reduce((s,l)=>s+(l.quantity||0)*(p.unitQuantity||1),0);
    const cp=db.locations.filter(l=>l.productId===pid&&l.status==='used').reduce((s,l)=>s+(l.customPieces||0),0);
    const tp=db.transit.filter(t=>t.productId===pid).reduce((s,t)=>s+(t.quantity||0)*(p.unitQuantity||1)+(t.customPieces||0),0);
    return{pieces:rp+cp+tp,unit:p.unit||'件',unitQuantity:p.unitQuantity||1,remark:p.remark||''};
}
function getRowDisplayLabel(zone,rowNum){
    if(zone&&zone.id===1){
        if(rowNum<=17)return'A'+String(rowNum).padStart(2,'0');
        return'B'+String(rowNum-17).padStart(2,'0');
    }
    return String(rowNum);
}
function getDisplayColArray(zone){
    if(zone.id===1&&zone.cols===5)return[3,2,4,1,5];
    return Array.from({length:zone.cols},(_,i)=>i+1);
}
function getDisplayColNumber(zone,oc){
    const arr=getDisplayColArray(zone);
    const idx=arr.indexOf(oc);
    return idx!==-1?idx+1:oc;
}
function showToast(msg,type='info'){
    const c=document.getElementById('toastContainer');
    const t=document.createElement('div');
    t.className='toast toast-'+type;
    t.textContent=msg;
    t.addEventListener('click',()=>t.remove());
    c.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},2500);
}
function openModal(html){
    document.getElementById('modalContainer').innerHTML='<div class="modal-overlay" id="modalOverlay"><div class="modal">'+html+'</div></div>';
    document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
}
function closeModal(){document.getElementById('modalContainer').innerHTML='';}

// 渲染
function renderAll(){
    if(!db||!Array.isArray(db.zones)||!Array.isArray(db.locations)||!Array.isArray(db.products))return;
    renderZoneList();renderGrid();renderProductList();renderZoneStats();updateHeaderStats();
}
function renderZoneList(){
    const list=document.getElementById('zoneList');
    if(!list||!db)return;
    list.innerHTML='';
    db.zones.forEach(zone=>{
        const item=document.createElement('div');
        item.className='zone-item'+(zone.id===currentZoneId?' active':'');
        const locCount=db.locations.filter(l=>l.zoneId===zone.id).length;
        const usedCount=db.locations.filter(l=>l.zoneId===zone.id&&l.status==='used').length;
        item.innerHTML='<span class="zone-name">'+(zone.isBase?'🏭':'📁')+' '+zone.name+'</span> ('+usedCount+'/'+locCount+')';
        if(!zone.isBase){
            const btn=document.createElement('button');
            btn.className='zone-delete-btn';btn.textContent='×';
            btn.addEventListener('click',e=>{e.stopPropagation();deleteZone(zone.id);});
            item.appendChild(btn);
        }
        item.addEventListener('click',()=>{currentZoneId=zone.id;renderAll();});
        list.appendChild(item);
    });
}
function deleteZone(zoneId){
    const zone=db.zones.find(z=>z.id===zoneId);
    if(!zone||zone.isBase){showToast('基础仓位不可删除','error');return;}
    if(db.locations.some(l=>l.zoneId===zoneId&&l.status==='used')){showToast('有已用仓位','error');return;}
    if(!confirm('删除区域？'))return;
    const nd=JSON.parse(JSON.stringify(db));
    nd.locations=nd.locations.filter(l=>l.zoneId!==zoneId);
    nd.zones=nd.zones.filter(z=>z.id!==zoneId);
    if(currentZoneId===zoneId)currentZoneId=nd.zones[0]?.id||null;
    saveDB(nd);showToast('已删除','success');
}
function showAddZoneModal(){
    openModal('<h2>添加区域</h2><div class="form-group"><label>名称</label><input id="newZoneName" required></div><div class="form-group"><label>排数</label><input type="number" id="newZoneRows" min="1" required></div><div class="form-group"><label>托数/排</label><input type="number" id="newZoneCols" min="1" required></div><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="addZone()">确认</button></div>');
}
function addZone(){
    const name=document.getElementById('newZoneName').value.trim();
    const rows=parseInt(document.getElementById('newZoneRows').value);
    const cols=parseInt(document.getElementById('newZoneCols').value);
    if(!name||!rows||!cols){showToast('请填写完整','error');return;}
    const nd=JSON.parse(JSON.stringify(db));
    const zone={id:nd.nextZoneId++,name,rows,cols,isBase:false,createdAt:new Date().toISOString()};
    nd.zones.push(zone);
    for(let r=1;r<=rows;r++)for(let c=1;c<=cols;c++)nd.locations.push({id:nd.nextLocationId++,zoneId:zone.id,rowNum:r,colNum:c,status:'normal',productId:null,batchNo:null,quantity:0,customPieces:0,remark:'',handAccount:false,updatedAt:null});
    currentZoneId=zone.id;
    saveDB(nd);closeModal();showToast('已添加','success');
}
function renderGrid(){
    const container=document.getElementById('gridContainer');
    if(!container||!db)return;
    const sl=container.scrollLeft, st=container.scrollTop;
    const zone=db.zones.find(z=>z.id===currentZoneId);
    if(!zone){container.innerHTML='<div>请选择区域</div>';return;}
    const locations=db.locations.filter(l=>l.zoneId===zone.id);
    document.getElementById('currentZoneTitle').textContent=zone.name;
    document.getElementById('currentZoneInfo').textContent=zone.isBase?'A侧17排+B侧17排×5托':zone.rows+'排×'+zone.cols+'托';
    const rankMap=getFifoRankMap(zone.id);
    if(zone.isBase&&zone.id===1){
        container.innerHTML='<div class="grid-side-by-side">'+renderGridTable(locations.filter(l=>l.rowNum<=17),zone,rankMap)+renderGridTable(locations.filter(l=>l.rowNum>17),zone,rankMap)+'</div>';
    }else{
        container.innerHTML=renderGridTable(locations,zone,rankMap);
    }
    requestAnimationFrame(()=>{
        container.scrollLeft = sl;
        container.scrollTop = st;
    });
}
function renderGridTable(locs,zone,rankMap){
    if(locs.length===0)return'';
    const displayCols=getDisplayColArray(zone);
    const rows=[...new Set(locs.map(l=>l.rowNum))].sort((a,b)=>a-b);
    let html='<div class="grid-table"><div class="grid-col-label-row"><div style="width:var(--row-label-width);"></div>';
    displayCols.forEach((_,i)=>{html+='<div class="grid-col-label">托'+(i+1)+'</div>';});
    html+='</div>';
    rows.forEach(r=>{
        html+='<div class="grid-row"><div class="grid-row-label">'+getRowDisplayLabel(zone,r)+'</div>';
        displayCols.forEach((oc,idx)=>{
            const loc=locs.find(l=>l.rowNum===r&&l.colNum===oc);
            if(loc){
                let style='',rankBadge='',newBadge='',yesterdayBadge='',handBadge='',cbHtml='';
                if(loc.status==='used'){
                    const info=rankMap[loc.id];
                    if(info){
                        style='background-color:'+getFifoColor(info.rank,info.total)+';border-color:'+getFifoBorderColor(info.rank,info.total)+';';
                        rankBadge='<span class="fifo-rank">#'+(info.rank+1)+'/'+info.total+'</span>';
                    }else style='background-color:#1e88e5;border-color:#0d47a1;';
                    const updatedDate=loc.updatedAt?loc.updatedAt.split('T')[0]:null;
                    if(updatedDate){
                        const today=new Date().toISOString().split('T')[0];
                        const yesterday=new Date(Date.now()-86400000).toISOString().split('T')[0];
                        if(updatedDate===today)newBadge='<span class="new-badge">今</span>';
                        else if(updatedDate===yesterday)yesterdayBadge='<span class="yesterday-badge">昨</span>';
                    }
                    if(loc.handAccount)handBadge='<span class="hand-badge">账</span>';
                }
                if(locationBatchMode)cbHtml='<input type="checkbox" class="select-checkbox"'+(selectedLocations.has(loc.id)?' checked':'')+' onclick="toggleLocationSelect('+loc.id+',event)">';
                let label='',batchInfo='',qtyInfo='';
                if(loc.status==='used'&&loc.productId){
                    const p=db.products.find(x=>x.id===loc.productId);
                    label=p?p.name:'?';
                    const batchDate=loc.batchNo?String(loc.batchNo).slice(5).replace('-','/'):'';
                    batchInfo=batchDate;
                    if(loc.customPieces>0)qtyInfo=loc.customPieces+'件';
                    else qtyInfo=loc.quantity>0?loc.quantity+(p?.unit||'件'):'';
                }else if(loc.status==='unavailable')label='🚫';
                else label=getRowDisplayLabel(zone,r)+'-'+(idx+1);
                const click=locationBatchMode?'toggleLocationSelect('+loc.id+',event)':'handleCellClick('+loc.id+')';
                const cmenu=locationBatchMode?'':'handleCellRightClick('+loc.id+');return false;';
                html+='<div class="cell status-'+loc.status+'" style="'+style+'" onclick="'+click+'" oncontextmenu="'+cmenu+'">'+cbHtml+rankBadge+newBadge+yesterdayBadge+handBadge+'<span class="cell-label">'+label+'</span>'+(qtyInfo?'<span class="cell-qty">'+qtyInfo+'</span>':'')+(batchInfo?'<span class="cell-batch">'+batchInfo+'</span>':'')+'</div>';
            }else{
                html+='<div class="cell" style="border-style:dashed;opacity:.3;">-</div>';
            }
        });
        html+='</div>';
    });
    html+='</div>';
    return html;
}
function getFifoRankMap(zoneId){
    if(!db||!Array.isArray(db.locations))return{};
    const used=db.locations.filter(l=>l.zoneId===zoneId&&l.status==='used'&&l.batchNo);
    const pg={};
    used.forEach(loc=>{const pid=loc.productId;if(!pid)return;if(!pg[pid])pg[pid]=[];pg[pid].push(loc);});
    const rm={};
    Object.keys(pg).forEach(pid=>{
        const locs=pg[pid];
        locs.sort((a,b)=>a.batchNo.localeCompare(b.batchNo));
        locs.forEach((loc,i)=>{rm[loc.id]={rank:i,total:locs.length,productId:pid};});
    });
    return rm;
}
function getFifoColor(rank,total){if(total<=1)return'#1e88e5';const l=80-(rank/(total-1))*50;return'hsl(210,80%,'+l+'%)';}
function getFifoBorderColor(rank,total){if(total<=1)return'#0d47a1';const l=60-(rank/(total-1))*25;return'hsl(210,90%,'+l+'%)';}

function showAddProductModal(){if(!db||!Array.isArray(db.products)){showToast('数据未加载','info');return;}let opts='<option value="">-- 复制 --</option>';db.products.forEach(p=>opts+='<option value="'+p.id+'">'+p.name+'</option>');openModal('<h2>📦 新建产品</h2>'+(db.products.length?'<div class="form-group"><label>复制</label><select id="existingProductSelect" onchange="fillProductFields(this.value)">'+opts+'</select></div>':'')+'<div class="form-group"><label>名称</label><input id="pName" required></div><div class="form-group"><label>型号</label><input id="pModel"></div><div class="form-group"><label>单位</label><input id="pUnit" value="件" required></div><div class="form-group"><label>单位数量</label><input type="number" id="pUnitQuantity" value="1" min="1"></div><div class="form-group"><label>备注</label><textarea id="pRemark"></textarea></div><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="addProduct()">确认</button></div>');}

function showProductDetail(id){const p=db.products.find(x=>x.id===id);if(!p)return;const info=getProductDisplayInfo(id);const usedLocs=db.locations.filter(l=>l.productId===id&&l.status==='used');const transitCount=db.transit.filter(t=>t.productId===id).length;openModal('<h2>📦 '+p.name+'</h2><p>型号:'+p.model+' | 单位:'+p.unit+' | 单位数量:'+p.unitQuantity+'</p><p>备注:'+p.remark+'</p><p>总件数:'+info.pieces+p.unit+'</p><p>存储仓位:'+usedLocs.length+' | 中转仓:'+transitCount+'</p><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button><button class="btn btn-primary" onclick="closeModal();showEditProductModal('+p.id+')">编辑</button><button class="btn btn-danger" onclick="closeModal();deleteProduct('+p.id+')">删除</button></div>');}

// 批量入库（排序、预览、批次记忆）
function batchStockInLocations(){
    if(selectedLocations.size===0){showToast('请先勾选库位','error');return;}
    const empty=[...selectedLocations].filter(id=>db.locations.find(l=>l.id===id)?.status==='normal');
    if(empty.length===0){showToast('没有空库位','error');return;}
    const sortedEmpty = empty.map(id=>db.locations.find(l=>l.id===id)).sort((a,b)=>{
        if(a.zoneId!==b.zoneId) return a.zoneId - b.zoneId;
        if(a.rowNum!==b.rowNum) return a.rowNum - b.rowNum;
        return a.colNum - b.colNum;
    });
    let locPreview = sortedEmpty.map(l=>{
        const zone=db.zones.find(z=>z.id===l.zoneId);
        return zone.name+' '+getRowDisplayLabel(zone,l.rowNum)+'排'+getDisplayColNumber(zone,l.colNum)+'托';
    }).join('、');
    const today=new Date().toISOString().slice(0,10);
    const defaultBatch = lastBatchNo || today;
    let opts=db.products.map(p=>'<option value="'+p.id+'">'+p.name+' ('+p.model+')</option>').join('');
    openModal('<h2>批量入库</h2><p>已选 '+sortedEmpty.length+' 个空库位，按顺序添加：</p><div style="background:#f8f9fa;padding:6px;border-radius:4px;margin-bottom:10px;max-height:80px;overflow-y:auto">'+locPreview+'</div>'+
        '<div class="form-group"><label>产品</label><select id="batchStockProduct">'+opts+'</select></div>'+
        '<div class="form-group"><label>方式</label><select id="batchStockType" onchange="toggleBatchStockType()"><option value="unit">按单位数量</option><option value="custom">自定义件数</option></select></div>'+
        '<div class="form-group" id="batchUnitQtyGroup"><label>单位数量</label><input type="number" id="batchStockQty" min="0.01" step="any" value="1"></div>'+
        '<div class="form-group" id="batchCustomPiecesGroup" style="display:none"><label>件数</label><input type="number" id="batchStockCustomPieces" min="1" step="1" value="1"></div>'+
        '<div class="form-group"><label>批次日期</label><input type="date" id="batchStockBatch" value="'+defaultBatch+'"></div>'+
        '<div class="form-group"><label>备注</label><textarea id="batchStockRemark"></textarea></div>'+
        '<div class="form-group"><label>记录手帐</label><input type="checkbox" id="batchHandAccount"></div>'+
        '<div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-success" onclick="confirmBatchStockIn()">确认</button></div>');
}
function toggleBatchStockType(){const t=document.getElementById('batchStockType').value;document.getElementById('batchUnitQtyGroup').style.display=t==='unit'?'block':'none';document.getElementById('batchCustomPiecesGroup').style.display=t==='custom'?'block':'none';}
function confirmBatchStockIn(){
    const pid=parseInt(document.getElementById('batchStockProduct').value);
    const batch=document.getElementById('batchStockBatch').value;
    const remark=document.getElementById('batchStockRemark').value.trim();
    const type=document.getElementById('batchStockType').value;
    const handAccount=document.getElementById('batchHandAccount')?.checked||false;
    const product=db.products.find(p=>p.id===pid);
    if(!product){showToast('产品不存在','error');return;}
    if(!batch){showToast('请选择批次日期','error');return;}
    lastBatchNo = batch;
    let qty=0,cp=0;
    if(type==='unit'){qty=parseFloat(document.getElementById('batchStockQty').value);if(!qty||qty<=0){showToast('无效','error');return;}}
    else{cp=parseInt(document.getElementById('batchStockCustomPieces').value);if(!Number.isInteger(cp)||cp<1){showToast('无效','error');return;}}
    const empty=[...selectedLocations].filter(id=>db.locations.find(l=>l.id===id)?.status==='normal');
    const sortedEmpty = empty.map(id=>db.locations.find(l=>l.id===id)).sort((a,b)=>{
        if(a.zoneId!==b.zoneId) return a.zoneId - b.zoneId;
        if(a.rowNum!==b.rowNum) return a.rowNum - b.rowNum;
        return a.colNum - b.colNum;
    });
    const nd=JSON.parse(JSON.stringify(db));
    sortedEmpty.forEach(loc=>{
        const nl=nd.locations.find(l=>l.id===loc.id);
        const zone=db.zones.find(z=>z.id===loc.zoneId);
        nl.status='used'; nl.productId=pid; nl.batchNo=batch; nl.remark=remark; nl.handAccount=handAccount; nl.updatedAt=new Date().toISOString();
        if(type==='unit'){nl.quantity=qty; nl.customPieces=0;}
        else{nl.quantity=0; nl.customPieces=cp;}
        addRecord(nd,'入库',product,nl,zone,qty,cp,remark,null,null,loc.id);
    });
    saveDB(nd);closeModal();exitLocationBatchMode();showToast('批量入库成功','success');
}
// 批量删除（与删除产品一致）
function batchDeleteLocations(){
    if(selectedLocations.size===0){showToast('请先勾选库位','error');return;}
    const used=[...selectedLocations].filter(id=>db.locations.find(l=>l.id===id)?.status==='used');
    if(used.length===0){showToast('没有已用库位','error');return;}
    if(!confirm('批量删除选中的已用库位产品，并删除其入库记录？'))return;
    const nd=JSON.parse(JSON.stringify(db));
    used.forEach(lid=>{
        const loc=nd.locations.find(l=>l.id===lid);
        const orig=db.locations.find(l=>l.id===lid);
        const product=db.products.find(p=>p.id===orig.productId);
        if(product){nd.records=nd.records.filter(r=>!(r.locationId===lid && r.type==='入库' && r.productId===product.id));}
        loc.status='normal'; loc.productId=null; loc.batchNo=null; loc.quantity=0; loc.customPieces=0; loc.remark=''; loc.handAccount=false; loc.updatedAt=null;
    });
    saveDB(nd);exitLocationBatchMode();showToast('批量删除成功','success');
}
// 批量加入中转仓
function batchAddToTransit(){
    if(selectedLocations.size===0){showToast('请先勾选库位','error');return;}
    const used=[...selectedLocations].filter(id=>db.locations.find(l=>l.id===id)?.status==='used');
    if(used.length===0){showToast('没有已用库位','error');return;}
    if(!confirm('将选中的 '+used.length+' 个已用库位产品全部加入中转仓？'))return;
    const nd=JSON.parse(JSON.stringify(db));
    used.forEach(lid=>{
        const loc=nd.locations.find(l=>l.id===lid);
        const orig=db.locations.find(l=>l.id===lid);
        const product=db.products.find(p=>p.id===orig.productId);
        const zone=db.zones.find(z=>z.id===orig.zoneId);
        if(!product||!zone) return;
        const transitEntry={id: nd.nextTransitId++,productId: orig.productId,batchNo: orig.batchNo,quantity: orig.quantity,customPieces: orig.customPieces,remark: orig.remark,handAccount: orig.handAccount,updatedAt: new Date().toISOString(),sourceLocationId: orig.id};
        nd.transit.push(transitEntry);
        loc.status='normal'; loc.productId=null; loc.batchNo=null; loc.quantity=0; loc.customPieces=0; loc.remark=''; loc.handAccount=false; loc.updatedAt=null;
        addRecord(nd,'加入中转仓',product,{...orig,rowNum:orig.rowNum,colNum:orig.colNum},zone,orig.quantity,orig.customPieces,'批量加入中转仓',null,null,orig.id);
    });

}

// 库位点击
function handleCellClick(lid){
    if(locationBatchMode){toggleLocationSelect(lid,event);return;}
    if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}
    const loc=db.locations.find(l=>l.id===lid);
    if(!loc)return;
    const zone=db.zones.find(z=>z.id===loc.zoneId);
    if(loc.status==='unavailable'){showToast('不可用','error');return;}
    if(loc.status==='used')showUsedLocationModal(loc,zone);
    else showStockInModal(loc,zone);
}
function handleCellRightClick(lid){
    if(locationBatchMode)return;
    if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}
    const loc=db.locations.find(l=>l.id===lid);
    if(!loc)return;

    const nd=JSON.parse(JSON.stringify(db));

function showStockInModal(loc,zone){

function toggleStockInType(){const t=document.getElementById('stockInType').value;document.getElementById('unitQtyGroup').style.display=t==='unit'?'block':'none';document.getElementById('customPiecesGroup').style.display=t==='custom'?'block':'none';}
function stockIn(lid){if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}const loc=db.locations.find(l=>l.id===lid);if(!loc||loc.status!=='normal'){showToast('状态异常','error');closeModal();return;}const pid=parseInt(document.getElementById('stockInProduct').value);const batch=document.getElementById('stockInBatch').value;const remark=document.getElementById('stockInRemark').value.trim();const handAccount=document.getElementById('stockHandAccount')?.checked||false;if(!pid||!batch){showToast('信息不完整','error');return;}const product=db.products.find(p=>p.id===pid);if(!product){showToast('产品不存在','error');return;}const type=document.getElementById('stockInType').value;const nd=JSON.parse(JSON.stringify(db));const nl=nd.locations.find(l=>l.id===lid);const zone=db.zones.find(z=>z.id===nl.zoneId);nl.status='used';nl.productId=pid;nl.batchNo=batch;nl.remark=remark;nl.handAccount=handAccount;nl.updatedAt=new Date().toISOString();let qty=0,cp=0;if(type==='unit'){qty=parseFloat(document.getElementById('stockInQty').value);if(!qty||qty<=0){showToast('无效','error');return;}nl.quantity=qty;nl.customPieces=0;}else{cp=parseInt(document.getElementById('stockInCustomPieces').value);if(!Number.isInteger(cp)||cp<1){showToast('无效','error');return;}nl.quantity=0;nl.customPieces=cp;}addRecord(nd,'入库',product,nl,zone,qty,cp,remark,null,null,loc.id);saveDB(nd);closeModal();showToast('入库成功','success');}
function showUsedLocationModal(loc,zone){if(!db||!Array.isArray(db.products)){showToast('数据未加载','info');return;}const product=db.products.find(p=>p.id===loc.productId);const rl=getRowDisplayLabel(zone,loc.rowNum),dc=getDisplayColNumber(zone,loc.colNum);const isCustom=loc.customPieces>0;const rp=loc.quantity*(product?.unitQuantity||1);const disp=isCustom?loc.customPieces+'件':loc.quantity+(product?.unit||'件')+' ('+rp.toFixed(2)+'件)';openModal('<h2>📤 仓位操作</h2><p>仓位:'+zone?.name+' '+rl+'排'+dc+'托</p><div style="background:#f8f9fa;padding:8px;border-radius:6px;margin-bottom:10px"><p>产品:'+product?.name+'</p><p>型号:'+product?.model+'</p><p>批次:'+loc.batchNo+'</p><p>数量:'+disp+'</p><p>手帐:'+(loc.handAccount?'是':'否')+'</p><p>备注:'+(loc.remark||'-')+'</p></div>'+(isCustom?'<div class="form-group"><label>出库件数(最大'+loc.customPieces+')</label><input type="number" id="stockOutQty" min="1" max="'+loc.customPieces+'" step="1" value="'+loc.customPieces+'"></div>':'<div class="form-group"><label>出库单位数量(最大'+loc.quantity+')</label><input type="number" id="stockOutQty" min="0.01" max="'+loc.quantity+'" step="any" value="'+loc.quantity+'"></div>')+'<div class="form-actions" style="flex-wrap:wrap;gap:6px"><button class="btn btn-outline" onclick="closeModal()">关闭</button><button class="btn btn-danger" onclick="stockOut('+loc.id+')">出库</button><button class="btn btn-warning" onclick="shipOut('+loc.id+')">发货</button><button class="btn btn-primary" onclick="showMigrateModal('+loc.id+')">迁移</button><button class="btn btn-info" onclick="addToTransit('+loc.id+')">加入中转仓</button><button class="btn btn-danger" onclick="deleteLocationProduct('+loc.id+')">删除产品</button></div>');}
function stockOut(lid){if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}const loc=db.locations.find(l=>l.id===lid);if(!loc||loc.status!=='used'){showToast('状态异常','error');closeModal();return;}const product=db.products.find(p=>p.id===loc.productId);const zone=db.zones.find(z=>z.id===loc.zoneId);const nd=JSON.parse(JSON.stringify(db));const nl=nd.locations.find(l=>l.id===lid);let oq=0,op=0;if(nl.customPieces>0){op=parseInt(document.getElementById('stockOutQty').value);if(!Number.isInteger(op)||op<1||op>nl.customPieces){showToast('无效','error');return;}const rem=nl.customPieces-op;if(rem>0)nl.customPieces=rem;else{nl.status='normal';nl.productId=null;nl.batchNo=null;nl.quantity=0;nl.customPieces=0;nl.remark='';nl.handAccount=false;nl.updatedAt=null;}}else{oq=parseFloat(document.getElementById('stockOutQty').value);if(!oq||oq<=0||oq>nl.quantity){showToast('无效','error');return;}const rem=nl.quantity-oq;if(rem>0)nl.quantity=rem;else{nl.status='normal';nl.productId=null;nl.batchNo=null;nl.quantity=0;nl.customPieces=0;nl.remark='';nl.handAccount=false;nl.updatedAt=null;}}if(product)addRecord(nd,'出库',product,loc,zone,oq,op,'出库',null,null,loc.id);saveDB(nd);closeModal();showToast('出库成功','success');}
function shipOut(lid){if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}const loc=db.locations.find(l=>l.id===lid);if(!loc||loc.status!=='used'){showToast('状态异常','error');closeModal();return;}const product=db.products.find(p=>p.id===loc.productId);const zone=db.zones.find(z=>z.id===loc.zoneId);const nd=JSON.parse(JSON.stringify(db));const nl=nd.locations.find(l=>l.id===lid);if(product)addRecord(nd,'发货',product,loc,zone,nl.quantity,nl.customPieces,'发货',null,null,loc.id);nl.status='normal';nl.productId=null;nl.batchNo=null;nl.quantity=0;nl.customPieces=0;nl.remark='';nl.handAccount=false;nl.updatedAt=null;saveDB(nd);closeModal();showToast('发货成功','success');}
function showMigrateModal(lid){if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}const loc=db.locations.find(l=>l.id===lid);if(!loc||loc.status!=='used'){showToast('状态异常','error');return;}const emptyLocs=db.locations.filter(l=>l.status==='normal');if(emptyLocs.length===0){showToast('没有空库位','error');return;}let opts=emptyLocs.map(l=>{const zone=db.zones.find(z=>z.id===l.zoneId);return '<option value="'+l.id+'">'+zone?.name+' '+getRowDisplayLabel(zone,l.rowNum)+'排'+getDisplayColNumber(zone,l.colNum)+'托</option>';}).join('');openModal('<h2>🔄 迁移产品</h2><p>将产品从当前库位迁移到目标空库位</p><div class="form-group"><label>目标库位</label><select id="migrateTarget">'+opts+'</select></div><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="confirmMigrate('+lid+')">确认迁移</button></div>');}
function confirmMigrate(lid){const targetId=parseInt(document.getElementById('migrateTarget').value);if(!targetId){showToast('请选择目标','error');return;}const src=db.locations.find(l=>l.id===lid);const dst=db.locations.find(l=>l.id===targetId);if(!src||!dst||src.status!=='used'||dst.status!=='normal'){showToast('状态异常','error');return;}const product=db.products.find(p=>p.id===src.productId);const srcZone=db.zones.find(z=>z.id===src.zoneId);const dstZone=db.zones.find(z=>z.id===dst.zoneId);const nd=JSON.parse(JSON.stringify(db));const ns=nd.locations.find(l=>l.id===lid);const nt=nd.locations.find(l=>l.id===targetId);nt.status='used';nt.productId=ns.productId;nt.batchNo=ns.batchNo;nt.quantity=ns.quantity;nt.customPieces=ns.customPieces;nt.remark=ns.remark;nt.handAccount=ns.handAccount;nt.updatedAt=new Date().toISOString();ns.status='normal';ns.productId=null;ns.batchNo=null;ns.quantity=0;ns.customPieces=0;ns.remark='';ns.handAccount=false;ns.updatedAt=null;if(product){addRecord(nd,'迁移',product,dst,srcZone,0,0,'从'+srcZone?.name+'迁移至'+dstZone?.name,dstZone?.name,getRowDisplayLabel(dstZone,dst.rowNum)+'排'+getDisplayColNumber(dstZone,dst.colNum)+'托',nt.id);}saveDB(nd);closeModal();showToast('迁移成功','success');}
function deleteLocationProduct(lid){if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}const loc=db.locations.find(l=>l.id===lid);if(!loc||loc.status!=='used'){showToast('状态异常','error');return;}if(!confirm('删除该库位产品，并删除其入库记录？'))return;const nd=JSON.parse(JSON.stringify(db));const nl=nd.locations.find(l=>l.id===lid);const product=db.products.find(p=>p.id===nl.productId);const zone=db.zones.find(z=>z.id===nl.zoneId);if(product){nd.records=nd.records.filter(r=>!(r.locationId===lid&&r.type==='入库'&&r.productId===product.id));}nl.status='normal';nl.productId=null;nl.batchNo=null;nl.quantity=0;nl.customPieces=0;nl.remark='';nl.handAccount=false;nl.updatedAt=null;saveDB(nd);closeModal();showToast('已删除产品及其入库记录','success');}
function addToTransit(lid){if(!db||!Array.isArray(db.locations)||!Array.isArray(db.transit)){showToast('数据未加载','info');return;}const loc=db.locations.find(l=>l.id===lid);if(!loc||loc.status!=='used'){showToast('状态异常','error');return;}const product=db.products.find(p=>p.id===loc.productId);const zone=db.zones.find(z=>z.id===loc.zoneId);if(!product||!zone){showToast('数据错误','error');return;}if(!confirm('确定将该产品加入中转仓？'))return;const nd=JSON.parse(JSON.stringify(db));const transitEntry={id: nd.nextTransitId++,productId: loc.productId,batchNo: loc.batchNo,quantity: loc.quantity,customPieces: loc.customPieces,remark: loc.remark,handAccount: loc.handAccount,updatedAt: new Date().toISOString(),sourceLocationId: loc.id};nd.transit.push(transitEntry);const nl=nd.locations.find(l=>l.id===lid);nl.status='normal';nl.productId=null;nl.batchNo=null;nl.quantity=0;nl.customPieces=0;nl.remark='';nl.handAccount=false;nl.updatedAt=null;addRecord(nd,'加入中转仓',product,{...loc,rowNum:loc.rowNum,colNum:loc.colNum},zone,loc.quantity,loc.customPieces,'加入中转仓',null,null,loc.id);saveDB(nd);closeModal();showToast('已加入中转仓','success');}

function renderTransitModal(){if(!db||!Array.isArray(db.transit)){showToast('数据未加载','info');return;}let productOpts='<option value="all">全部产品</option>';db.products.forEach(p=>{productOpts+='<option value="'+p.id+'">'+p.name+' ('+p.model+')</option>';});openModal('<h2>🚚 中转仓</h2><div class="form-group"><label>筛选产品</label><select id="transitFilter" onchange="transitFilterProduct=this.value;renderTransitList();">'+productOpts+'</select></div><div id="transitList"></div><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>');if(transitFilterProduct!=='all')document.getElementById('transitFilter').value=transitFilterProduct;renderTransitList();}
function renderTransitList(){const container=document.getElementById('transitList');if(!container||!db||!Array.isArray(db.transit))return;let items=db.transit;if(transitFilterProduct!=='all'){items=items.filter(t=>t.productId==parseInt(transitFilterProduct));}if(items.length===0){container.innerHTML='<p>中转仓为空</p>';return;}let html='<table class="records-table"><thead><tr><th>产品</th><th>批次</th><th>数量</th><th>备注</th><th>时间</th><th>操作</th></tr></thead><tbody>';items.forEach(t=>{const p=db.products.find(x=>x.id===t.productId);const qs=t.customPieces>0?t.customPieces+'件':t.quantity+(p?.unit||'件');html+='<tr><td>'+(p?p.name:'?')+'</td><td>'+t.batchNo+'</td><td>'+qs+'</td><td>'+(t.remark||'-')+'</td><td>'+new Date(t.updatedAt).toLocaleString()+'</td><td><button class="btn btn-sm btn-primary" onclick="transitTransfer('+t.id+')">转移</button> <button class="btn btn-sm btn-warning" onclick="transitShipOut('+t.id+')">发货</button> <button class="btn btn-sm btn-danger" onclick="transitStockOut('+t.id+')">出库</button> <button class="btn btn-sm btn-outline" onclick="transitDeleteProduct('+t.id+')">删除产品</button></td></tr>';});html+='</tbody></table>';container.innerHTML=html;}
function transitTransfer(transitId){const t=db.transit.find(x=>x.id===transitId);if(!t){showToast('记录不存在','error');return;}const emptyLocs=db.locations.filter(l=>l.status==='normal');if(emptyLocs.length===0){showToast('没有空库位','error');return;}let opts=emptyLocs.map(l=>{const zone=db.zones.find(z=>z.id===l.zoneId);return '<option value="'+l.id+'">'+zone?.name+' '+getRowDisplayLabel(zone,l.rowNum)+'排'+getDisplayColNumber(zone,l.colNum)+'托</option>';}).join('');openModal('<h2>🔄 中转转移</h2><p>选择目标库位</p><div class="form-group"><select id="transitTargetLoc">'+opts+'</select></div><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="confirmTransitTransfer('+transitId+')">确认转移</button></div>');}
function confirmTransitTransfer(transitId){const targetId=parseInt(document.getElementById('transitTargetLoc').value);if(!targetId){showToast('请选择目标','error');return;}const t=db.transit.find(x=>x.id===transitId);const dst=db.locations.find(l=>l.id===targetId);if(!t||!dst||dst.status!=='normal'){showToast('状态异常','error');return;}const product=db.products.find(p=>p.id===t.productId);const zone=db.zones.find(z=>z.id===dst.zoneId);if(!product||!zone){showToast('数据错误','error');return;}const nd=JSON.parse(JSON.stringify(db));const ndst=nd.locations.find(l=>l.id===targetId);ndst.status='used';ndst.productId=t.productId;ndst.batchNo=t.batchNo;ndst.quantity=t.quantity;ndst.customPieces=t.customPieces;ndst.remark=t.remark;ndst.handAccount=t.handAccount;ndst.updatedAt=new Date().toISOString();nd.transit=nd.transit.filter(x=>x.id!==transitId);addRecord(nd,'中转转移',product,ndst,zone,t.quantity,t.customPieces,'中转仓转移至库位',null,null,ndst.id);saveDB(nd);closeModal();showToast('转移成功','success');if(document.getElementById('transitList'))renderTransitList();}
function transitShipOut(transitId){const t=db.transit.find(x=>x.id===transitId);if(!t){showToast('记录不存在','error');return;}const product=db.products.find(p=>p.id===t.productId);if(!product){showToast('产品不存在','error');return;}if(!confirm('确认直接发货？'))return;const nd=JSON.parse(JSON.stringify(db));nd.transit=nd.transit.filter(x=>x.id!==transitId);const pseudoLoc={rowNum:0,colNum:0,batchNo:t.batchNo,quantity:t.quantity,customPieces:t.customPieces,remark:t.remark,handAccount:t.handAccount};addRecord(nd,'发货',product,pseudoLoc,{name:'中转仓'},t.quantity,t.customPieces,'中转仓发货',null,null,null);saveDB(nd);closeModal();showToast('发货成功','success');}

function transitDeleteProduct(transitId){const t=db.transit.find(x=>x.id===transitId);if(!t){showToast('记录不存在','error');return;}if(!confirm('确定删除该中转仓记录？'))return;const nd=JSON.parse(JSON.stringify(db));nd.transit=nd.transit.filter(x=>x.id!==transitId);saveDB(nd);closeModal();showToast('已删除','success');if(document.getElementById('transitList'))renderTransitList();}

// 记录
function showRecords(){if(!db||!Array.isArray(db.records)||db.records.length===0){showToast('暂无记录','info');return;}let filtered=db.records.filter(r=>{if(recordFilter!=='all'&&r.type!==recordFilter)return false;const d=new Date(r.timestamp);const ds=d.toISOString().split('T')[0];if(recordStartDate&&ds<recordStartDate)return false;if(recordEndDate&&ds>recordEndDate)return false;return true;}).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));let productOptions='<option value="all">全部产品</option>';const productNames=[...new Set(db.products.map(p=>p.name))];productNames.forEach(n=>productOptions+='<option value="'+n+'"'+(recordProductFilter===n?' selected':'')+'>'+n+'</option>');let rows=filtered.map(r=>{const qs=r.customPieces>0?r.customPieces+'件':r.quantity+r.productUnit;return '<tr><td><button class="btn btn-danger btn-sm" onclick="deleteRecord('+r.id+')">删除</button></td><td>'+r.type+'</td><td>'+r.productName+'</td><td>'+r.productModel+'</td><td>'+qs+'</td><td>'+r.zoneName+'</td><td>'+r.locationLabel+'</td><td>'+r.batchNo+'</td><td>'+(r.remark||'-')+'</td><td>'+new Date(r.timestamp).toLocaleString()+'</td></tr>';}).join('');openModal('<h2>📋 出入库记录</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><select onchange="recordFilter=this.value;showRecords();"><option value="all"'+(recordFilter==='all'?' selected':'')+'>全部类型</option><option value="入库">入库</option><option value="出库">出库</option><option value="发货">发货</option><option value="迁移">迁移</option><option value="加入中转仓">加入中转仓</option><option value="中转转移">中转转移</option></select><select onchange="recordProductFilter=this.value;showRecords();">'+productOptions+'</select><input type="date" value="'+recordStartDate+'" onchange="recordStartDate=this.value;showRecords();"><input type="date" value="'+recordEndDate+'" onchange="recordEndDate=this.value;showRecords();"></div><table class="records-table"><thead><tr><th>操作</th><th>类型</th><th>产品</th><th>型号</th><th>数量</th><th>区域</th><th>仓位</th><th>批次</th><th>备注</th><th>时间</th></tr></thead><tbody>'+rows+'</tbody></table><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>');}
function deleteRecord(recordId){if(!db||!Array.isArray(db.records))return;if(!confirm('确定删除这条记录吗？'))return;const nd=JSON.parse(JSON.stringify(db));nd.records=nd.records.filter(r=>r.id!==recordId);saveDB(nd);showToast('记录已删除','success');showRecords();}

// 统计
function renderZoneStats(){const c=document.getElementById('zoneStats');if(!c||!db)return;const zone=db.zones.find(z=>z.id===currentZoneId);if(!zone){c.textContent='请选择区域';return;}const locs=db.locations.filter(l=>l.zoneId===zone.id);const n=locs.filter(l=>l.status==='normal').length,u=locs.filter(l=>l.status==='unavailable').length,s=locs.filter(l=>l.status==='used').length;const tp=locs.filter(l=>l.status==='used').reduce((sum,l)=>{const p=db.products.find(x=>x.id===l.productId);return sum+(l.quantity||0)*(p?.unitQuantity||1)+(l.customPieces||0);},0);c.innerHTML='<div>正常:'+n+' 不可用:'+u+' 已用:'+s+' 总件数:'+tp+'</div>';}
function updateHeaderStats(){if(!db||!Array.isArray(db.locations))return;const all=db.locations;document.getElementById('statNormal').textContent=all.filter(l=>l.status==='normal').length;document.getElementById('statUnavailable').textContent=all.filter(l=>l.status==='unavailable').length;document.getElementById('statUsed').textContent=all.filter(l=>l.status==='used').length;document.getElementById('statProducts').textContent=db.products.length;}

// 数据备份
function exportData(){if(!db||!Array.isArray(db.zones)){showToast('数据未加载','info');return;}const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();showToast('导出成功','success');}
function importData(file){if(!db||!Array.isArray(db.zones)){showToast('数据未加载','info');return;}const reader=new FileReader();reader.onload=e=>{try{const imported=JSON.parse(e.target.result);if(!imported.zones||!imported.locations||!imported.products){showToast('格式错误','error');return;}if(!confirm('覆盖？'))return;saveDB(imported);if(!imported.zones.some(z=>z.id===currentZoneId))currentZoneId=imported.zones[0]?.id||null;renderAll();showToast('导入成功','success');}catch(err){showToast('解析失败','error');}};reader.readAsText(file);}

// 初始化事件
function init(){
    document.getElementById('btnAddZone').addEventListener('click',showAddZoneModal);
    document.getElementById('btnAddProduct').addEventListener('click',showAddProductModal);
    document.getElementById('btnToggleBatch').addEventListener('click',toggleBatchMode);
    document.getElementById('btnShowRecords').addEventListener('click',()=>showRecords());
    document.getElementById('btnShowTransit').addEventListener('click',renderTransitModal);
    document.getElementById('btnExportData').addEventListener('click',exportData);
    document.getElementById('btnImportData').addEventListener('click',()=>{const i=document.createElement('input');i.type='file';i.onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);};i.click();});
    document.getElementById('btnToggleLocationBatch').addEventListener('click',toggleLocationBatchMode);
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
    initFromFirebase();
}
init();
</script>
</body>
</html>
