function toggleHandAccountInline(locId){ if(IS_GUEST){showToast('访客模式无法修改','error');return;} if(!db||!Array.isArray(db.locations))return; const nd=JSON.parse(JSON.stringify(db)); const nl=nd.locations.find(l=>l.id===locId); if(!nl||nl.status!=='used')return; nl.handAccount=!nl.handAccount; saveDB(nd); showToast(nl.handAccount?'已标记手帐':'已取消手帐','success'); if (fifoCombinedItems) { const item = fifoCombinedItems.find(it => it.locationType === 'location' && it.locationId === locId); if (item) item.handAccount = nl.handAccount; } updateFifoContent(); }
function togglePriorityFlagInline(lid){ if(IS_GUEST){showToast('访客模式无法修改','error');return;} if(!db||!Array.isArray(db.locations))return; const nd=JSON.parse(JSON.stringify(db)); const nl=nd.locations.find(l=>l.id===lid); if(!nl||nl.status!=='used')return; nl.priorityFlag=!nl.priorityFlag; if(nl.priorityFlag) nl.priorityFlagDate = new Date().toISOString().slice(0,10); else nl.priorityFlagDate = null; saveDB(nd); showToast(nl.priorityFlag?('已标记先发出（'+nl.priorityFlagDate+'）'):'已取消先发出','success'); if(fifoCombinedItems){ const it=fifoCombinedItems.find(x=>x.locationType==='location'&&x.locationId===lid); if(it){ it.priorityFlag=nl.priorityFlag; it.priorityFlagDate=nl.priorityFlagDate; } } updateFifoContent(); }

function fifoBatchShipProduct(productId){

// ==================== 智能排序 ====================
let smartSortConfig = { targetZoneIds: new Set(), auxZoneIds: new Set(), strategy: 'product', direction: 'asc', compact: true };
let lastSmartSortResult = null;
let lastSortSnapshot = null;
function locLabelById(locId) { if (!locId) return '-'; const l = db.locations.find(x => x.id === locId); if (!l) return '(已删除)'; const z = db.zones.find(x => x.id === l.zoneId); if (!z) return '未知区域'; return z.name + ' ' + getRowDisplayLabel(z, l.rowNum) + '排' + getDisplayColNumber(z, l.colNum) + '托'; }
function buildComparator(strategy, direction, db) {
  const dir = direction === 'desc' ? -1 : 1;
  const productOrder = new Map();
  const uqMap = new Map();
  db.products.forEach((p, i) => { productOrder.set(p.id, i); uqMap.set(p.id, p.unitQuantity || 1); });
  return (a, b) => {
    let cmp = 0;
    const oa = productOrder.has(a.productId) ? productOrder.get(a.productId) : 999999;
    const ob = productOrder.has(b.productId) ? productOrder.get(b.productId) : 999999;
    if (strategy === 'product') { if (oa !== ob) cmp = oa - ob; else { const wa = getStatusWeight(getLocationEffectiveStatus(a)); const wb = getStatusWeight(getLocationEffectiveStatus(b)); if (wa !== wb) cmp = wa - wb; else if (a.priorityFlag !== b.priorityFlag) cmp = a.priorityFlag ? -1 : 1; else cmp = (a.batchNo || '').localeCompare(b.batchNo || ''); } }
    else if (strategy === 'batch') { cmp = (a.batchNo || '').localeCompare(b.batchNo || ''); if (cmp === 0) cmp = oa - ob; }
    else if (strategy === 'status') { const wa = getStatusWeight(getLocationEffectiveStatus(a)); const wb = getStatusWeight(getLocationEffectiveStatus(b)); cmp = wa - wb; if (cmp === 0) cmp = oa - ob; }
    else if (strategy === 'qty') { const uqa = uqMap.get(a.productId) || 1; const uqb = uqMap.get(b.productId) || 1; const qa = (a.quantity || 0) * uqa + (a.customPieces || 0); const qb = (b.quantity || 0) * uqb + (b.customPieces || 0); cmp = qa - qb; if (cmp === 0) cmp = oa - ob; }
    else if (strategy === 'inbound') { const ta = a.inboundTime ? new Date(a.inboundTime).getTime() : 0; const tb = b.inboundTime ? new Date(b.inboundTime).getTime() : 0; cmp = ta - tb; if (cmp === 0) cmp = oa - ob; }
    return cmp * dir;
  };
}
function buildMovePlan(assignments, allLocs, auxEmptyLocs, db) {
  if (!assignments || assignments.length === 0) return [];
  const pkey = (pid, batch) => (pid || 0) + '|' + (batch || '');
  const locCurrent = new Map(); allLocs.forEach(loc => { locCurrent.set(loc.id, loc.status === 'used' ? pkey(loc.productId, loc.batchNo) : null); });
  const productCurrent = new Map(); allLocs.forEach(loc => { if (loc.status === 'used') productCurrent.set(pkey(loc.productId, loc.batchNo), loc.id); });
  const productTarget = new Map(); assignments.forEach(a => productTarget.set(pkey(a.productId, a.batchNo), a.targetLocId));
  const moves = []; const visited = new Set(); const auxPool = [...auxEmptyLocs];
  productCurrent.forEach((srcLocId, key) => {
    if (visited.has(key)) return;
    const dstLocId = productTarget.get(key);
    if (dstLocId === undefined) return;
    if (srcLocId === dstLocId) { visited.add(key); return; }
    const chain = [key]; visited.add(key);
    let curDst = dstLocId; let occupantKey = locCurrent.get(curDst);
    while (occupantKey && !visited.has(occupantKey)) { chain.push(occupantKey); visited.add(occupantKey); const nextDst = productTarget.get(occupantKey); if (nextDst === undefined) break; curDst = nextDst; occupantKey = locCurrent.get(curDst); }
    const lastKey = chain[chain.length - 1];
    const lastTarget = productTarget.get(lastKey);
    const isCycle = lastTarget !== undefined && locCurrent.get(lastTarget) === key && chain.length > 1;
    if (isCycle) {
      const firstKey = chain[0]; const firstSrc = productCurrent.get(firstKey);
      const auxLoc = auxPool.shift();
      if (!auxLoc) { moves.push({ type: '错误', message: '辅助区空位不足，无法完成 ' + chain.length + ' 个产品的循环交换（请选择更多辅助区域）' }); return; }
      const [firstPid, firstBatch] = firstKey.split('|');
      moves.push({ type: '移到辅助区', fromLocId: firstSrc, toLocId: auxLoc.id, productId: parseInt(firstPid), batchNo: firstBatch, reason: '破解循环（临时存放）' });
      for (let i = chain.length - 1; i >= 1; i--) { const k = chain[i]; const kSrc = productCurrent.get(k); const kDst = productTarget.get(k); if (kDst === undefined || kSrc === kDst) continue; const [pid, batch] = k.split('|'); moves.push({ type: '移动产品', fromLocId: kSrc, toLocId: kDst, productId: parseInt(pid), batchNo: batch, reason: '排序调整' }); }
      const firstDst = productTarget.get(firstKey);
      moves.push({ type: '从辅助区移回', fromLocId: auxLoc.id, toLocId: firstDst, productId: parseInt(firstPid), batchNo: firstBatch, reason: '完成循环' });
    } else {
      for (let i = chain.length - 1; i >= 0; i--) { const k = chain[i]; const kSrc = productCurrent.get(k); const kDst = productTarget.get(k); if (kDst === undefined || kSrc === kDst) continue; const [pid, batch] = k.split('|'); moves.push({ type: '移动产品', fromLocId: kSrc, toLocId: kDst, productId: parseInt(pid), batchNo: batch, reason: '排序调整' }); }
    }
  });
  return moves;
}

  if(IS_GUEST){showToast('访客模式无法修改','error');return;}
  let targetCards = ''; let auxCards = '';

  }).join('');
  openModal('<h2>📦 每日备份</h2>'+
    '<p style="font-size:12px;color:#5f6368;margin-bottom:8px;">系统每天自动生成一次快照，最多保留 '+BACKUP_KEEP_DAYS+' 天。可随时恢复到历史快照，恢复前会自动把当前状态存为今日备份。</p>'+
    '<div style="overflow:auto;max-height:50vh;"><table class="records-table"><thead><tr><th>日期</th><th>大小</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>');
}
function restoreBackup(dateStr){
  if(IS_GUEST){showToast('访客模式无法修改','error');return;}
  if(!confirm('恢复到 '+dateStr+' 的备份？当前数据将被覆盖（会先保存当前状态作为今日备份）。'))return;
  try{
    const raw = localStorage.getItem(LS_DAILY_BACKUP_PREFIX + dateStr);
    if(!raw){showToast('备份不存在','error');return;}
    const today = new Date().toISOString().split('T')[0];
    try{ localStorage.setItem(LS_DAILY_BACKUP_PREFIX + today, JSON.stringify(db)); }catch(e){}
    const restored = JSON.parse(raw);
    saveDB(restored);
    closeModal();
    renderAll();
    showToast('已恢复到 '+dateStr+' 的数据','success');
  }catch(e){ console.error(e); showToast('恢复失败：'+e.message,'error'); }
}
function downloadBackup(dateStr){
  try{
    const raw = localStorage.getItem(LS_DAILY_BACKUP_PREFIX + dateStr);
    if(!raw){showToast('备份不存在','error');return;}
    const blob = new Blob([raw], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'backup_'+dateStr+'.json';
    a.click();
    showToast('下载成功','success');
  }catch(e){ showToast('下载失败','error'); }
}
function deleteBackup(dateStr){
  if(IS_GUEST){showToast('访客模式无法修改','error');return;}
  if(!confirm('删除 '+dateStr+' 的备份？'))return;
  localStorage.removeItem(LS_DAILY_BACKUP_PREFIX + dateStr);
  showBackupManager();
  showToast('已删除','success');
}

// ==================== 数据导出导入 ====================
function exportExcel(){if(!db||!Array.isArray(db.products)||db.products.length===0){showToast('暂无数据','info');return;}const nm=new Map(),mm=new Map();db.products.forEach(p=>{if(!nm.has(p.name))nm.set(p.name,{pieces:0,units:new Set(),models:new Set()});const e=nm.get(p.name);const info=getProductDisplayInfo(p.id);e.pieces+=info.pieces;e.units.add(p.unit);e.models.add(p.model||'无型号');const key=p.model||'无型号';if(!mm.has(key))mm.set(key,{pieces:0,units:new Set(),names:new Set(),pn:[]});const m=mm.get(key);m.pieces+=info.pieces;m.units.add(p.unit);m.names.add(p.name);m.pn.push(p.name);});let html='<html><head><meta charset="UTF-8"></head><body><table><tr><th>名称</th><th>规格</th><th>总件数</th><th>单位</th></tr>';nm.forEach((d,n)=>{html+='<tr><td>'+n+'</td><td>'+[...d.models].join('、')+'</td><td>'+d.pieces+'</td><td>'+([...d.units].length===1?[...d.units][0]:'多单位')+'</td></tr>';});html+='</table><table><tr><th>产品名称</th><th>型号</th><th>产品数</th><th>总件数</th><th>单位</th></tr>';mm.forEach((d,m)=>{html+='<tr><td>'+d.pn.join('、')+'</td><td>'+m+'</td><td>'+d.names.size+'</td><td>'+d.pieces+'</td><td>'+([...d.units].length===1?[...d.units][0]:'多单位')+'</td></tr>';});html+='</table></body></html>';const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='统计_'+new Date().toISOString().slice(0,10)+'.xls';a.click();showToast('导出成功','success');}
function exportProductsData(){if(!db||!Array.isArray(db.products)||db.products.length===0){showToast('无产品','info');return;}const blob=new Blob([JSON.stringify(db.products,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='products_'+new Date().toISOString().slice(0,10)+'.json';a.click();showToast('导出成功','success');}
function importProductsData(file){if(IS_GUEST){showToast('访客模式无法修改','error');return;}if(!db||!Array.isArray(db.products)){showToast('数据未加载','info');return;}const reader=new FileReader();reader.onload=e=>{try{const products=JSON.parse(e.target.result);if(!Array.isArray(products)){showToast('需要数组','error');return;}const nd=JSON.parse(JSON.stringify(db));let added=0;products.forEach(item=>{if(!item.name||!item.unit)return;if(nd.products.some(p=>p.name===item.name&&(p.model||'')===(item.model||'')))return;nd.products.push({id:nd.nextProductId++,name:item.name,model:item.model||'',unit:item.unit,unitQuantity:item.unitQuantity||1,remark:item.remark||'',status:item.status||'green',isPriority:!!item.isPriority,createdAt:item.createdAt||new Date().toISOString()});added++;});saveDB(nd);showToast('导入'+added+'个','success');}catch(err){showToast('解析失败','error');}};reader.readAsText(file);}
function exportData(){if(!db||!Array.isArray(db.zones)){showToast('数据未加载','info');return;}const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();showToast('导出成功','success');}
function importData(file){if(IS_GUEST){showToast('访客模式无法修改','error');return;}if(!db||!Array.isArray(db.zones)){showToast('数据未加载','info');return;}const reader=new FileReader();reader.onload=e=>{try{const imported=JSON.parse(e.target.result);if(!imported.zones||!imported.locations||!imported.products){showToast('格式错误','error');return;}if(!confirm('覆盖？'))return;saveDB(imported);if(!imported.zones.some(z=>z.id===currentZoneId))currentZoneId=imported.zones[0]?.id||null;renderAll();showToast('导入成功','success');}catch(err){showToast('解析失败','error');}};reader.readAsText(file);}

// ==================== 区域统计 ====================
function renderZoneStats(){const c=document.getElementById('zoneStats');if(!c||!db)return;const zone=db.zones.find(z=>z.id===currentZoneId);if(!zone){c.textContent='请选择区域';return;}const locs=db.locations.filter(l=>l.zoneId===zone.id);const n=locs.filter(l=>l.status==='normal').length,u=locs.filter(l=>l.status==='unavailable').length,s=locs.filter(l=>l.status==='used').length;const tp=locs.filter(l=>l.status==='used').reduce((sum,l)=>{const p=db.products.find(x=>x.id===l.productId);return sum+(l.quantity||0)*(p?.unitQuantity||1)+(l.customPieces||0);},0);c.innerHTML='<div>正常:'+n+' 不可用:'+u+' 已用:'+s+' 总件数:'+tp+'</div>';}
function updateHeaderStats(){if(!db||!Array.isArray(db.locations))return;const all=db.locations;document.getElementById('statNormal').textContent=all.filter(l=>l.status==='normal').length;document.getElementById('statUnavailable').textContent=all.filter(l=>l.status==='unavailable').length;document.getElementById('statUsed').textContent=all.filter(l=>l.status==='used').length;document.getElementById('statProducts').textContent=db.products.length;}

  initAccessMode();
  const vb = document.getElementById('versionBadge');
  if (vb) { vb.textContent = 'v' + APP_VERSION; vb.addEventListener('click', showVersionLog); }
  document.getElementById('btnAddZone').addEventListener('click',showAddZoneModal);
  document.getElementById('btnToggleLocationBatch').addEventListener('click',toggleLocationBatchMode);
  document.getElementById('btnShowFifo').addEventListener('click',()=>renderFifoOrderModal());
  document.getElementById('btnShowRecords').addEventListener('click',()=>showRecords());
  document.getElementById('btnShowDailyStats').addEventListener('click',showDailyStats);
  document.getElementById('btnShowDailyBatchStats').addEventListener('click',showDailyBatchStats);
  document.getElementById('btnShowTransit').addEventListener('click',renderTransitModal);
  document.getElementById('btnSmartSort').addEventListener('click',showSmartSortModal);
  document.getElementById('btnExportExcel').addEventListener('click',exportExcel);
  document.getElementById('btnExportProducts').addEventListener('click',exportProductsData);
  document.getElementById('btnImportProducts').addEventListener('click',()=>{if(IS_GUEST){showToast('访客模式无法修改','error');return;}const i=document.createElement('input');i.type='file';i.onchange=e=>{if(e.target.files[0])importProductsData(e.target.files[0]);};i.click();});
  document.getElementById('btnExportData').addEventListener('click',exportData);
  document.getElementById('btnImportData').addEventListener('click',()=>{if(IS_GUEST){showToast('访客模式无法修改','error');return;}const i=document.createElement('input');i.type='file';i.onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);};i.click();});
  document.getElementById('btnBackupManager').addEventListener('click',showBackupManager);
  document.getElementById('btnClearLocalCache').addEventListener('click',()=>{if(IS_GUEST){showToast('访客模式无法修改','error');return;}try{localStorage.removeItem(LS_KEY);localStorage.removeItem(LS_TS_KEY);showToast('本地缓存已清除，请刷新页面','success');}catch(e){}});
  document.getElementById('btnProductManager').addEventListener('click',showProductManager);
  document.getElementById('btnShipList').addEventListener('click',showShipListModal);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  initFromCloud();
}
init();
