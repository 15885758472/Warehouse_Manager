<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仓库管理系统 · 完整版</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root{--bg:#f0f2f5;--card-bg:#fff;--primary:#1a73e8;--success:#34a853;--danger:#ea4335;--warning:#fbbc04;--text:#202124;--text-secondary:#5f6368;--border:#dadce0;--shadow:0 1px 3px rgba(0,0,0,.1);--radius:12px;--radius-sm:8px;--cell-size:56px;--cell-gap:4px;--row-label-width:44px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
        .header{background:var(--card-bg);border-bottom:1px solid var(--border);padding:0 12px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);gap:8px}
        .header-left{display:flex;align-items:center;gap:8px;min-width:0}
        .logo-icon{width:30px;height:30px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;flex-shrink:0}
        .header h1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .header-stats{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
        .header-stats::-webkit-scrollbar{display:none}
        .stat-chip{display:flex;align-items:center;gap:3px;font-size:9px;color:var(--text-secondary);background:#f8f9fa;padding:2px 6px;border-radius:10px;border:1px solid var(--border);white-space:nowrap}
        .sync-badge{font-size:9px;padding:2px 6px;border-radius:10px;background:#fff8e1;color:#f57c00;white-space:nowrap}
        .sync-badge.online{background:#e8f5e9;color:#2e7d32}
        .sync-badge.offline{background:#ffebee;color:#c62828}
        .main-container{display:flex;flex-direction:column;height:calc(100vh - 52px);overflow:hidden}
        .left-panel{background:var(--card-bg);border-bottom:1px solid var(--border);padding:6px 8px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
        .left-panel::-webkit-scrollbar{display:none}
        .left-panel-top{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
        .panel-title{font-size:11px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
        .zone-list{display:flex;flex-direction:row;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
        .zone-list::-webkit-scrollbar{display:none}
        .zone-item{padding:6px 12px;border-radius:16px;border:2px solid var(--border);cursor:pointer;background:#fafafa;white-space:nowrap;font-size:12px;display:flex;align-items:center;gap:4px;flex-shrink:0;min-width:fit-content}
        .zone-item.active{border-color:var(--primary);background:#e8f0fe;font-weight:600}
        .zone-delete-btn{width:18px;height:18px;border-radius:50%;border:none;background:#f1f3f4;cursor:pointer;display:inline-flex!important;align-items:center;justify-content:center;font-size:10px;color:var(--danger);margin-left:2px;flex-shrink:0}
        .zone-edit-btn{width:18px;height:18px;border-radius:50%;border:none;background:#e3f2fd;cursor:pointer;display:inline-flex!important;align-items:center;justify-content:center;font-size:10px;color:var(--primary);margin-left:2px;flex-shrink:0}
        .add-zone-btn{padding:6px 12px;border:2px dashed var(--border);border-radius:16px;background:transparent;cursor:pointer;font-size:12px;white-space:nowrap;flex-shrink:0}
        .center-panel{flex:1;overflow-y:auto;background:var(--bg);padding:8px 10px;-webkit-overflow-scrolling:touch}
        .center-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:6px}
        .center-header h2{font-size:16px;font-weight:600}
        .legend{display:flex;gap:6px;flex-wrap:wrap;font-size:9px}
        .grid-container{background:var(--card-bg);border-radius:var(--radius);padding:6px;box-shadow:var(--shadow);overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%}
        .grid-side-by-side{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;width:100%}
        .grid-table{display:flex;flex-direction:column;gap:3px;flex-shrink:0;min-width:max-content}
        .grid-row{display:flex;align-items:center;gap:var(--cell-gap)}
        .grid-row-label{width:var(--row-label-width);font-size:9px;font-weight:600;color:var(--text-secondary);text-align:right}
        .cell{width:var(--cell-size);height:48px;border-radius:4px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;text-align:center;position:relative;flex-shrink:0;user-select:none;overflow:hidden;touch-action:manipulation}
        .cell:active{transform:scale(0.96)}
        .cell.status-normal{background:#e8f5e9;border-color:#4caf50;color:#2e7d32}
        .cell.status-unavailable{background:#ffebee;border-color:#ef5350;color:#c62828;opacity:.8}
        .cell.status-used{color:#fff;border-color:#333}
        .cell .cell-label{font-weight:600;font-size:8px;line-height:1.1;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .cell .cell-batch{font-size:6px;position:absolute;bottom:1px;left:1px;right:1px;white-space:nowrap;overflow:hidden;text-overflow:clip;color:inherit}
        .cell .cell-qty{font-size:7px;font-weight:700;position:absolute;top:1px;right:2px;background:rgba(255,255,255,.85);border-radius:2px;padding:0 2px;color:#000}
        .cell .fifo-rank{position:absolute;top:1px;left:2px;background:rgba(0,0,0,.5);color:#fff;font-size:6px;padding:0 2px;border-radius:2px}
        .cell .new-badge{position:absolute;left:2px;top:50%;transform:translateY(-50%);background:var(--success);color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .yesterday-badge{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:#ff9800;color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .hand-badge{position:absolute;bottom:1px;left:2px;background:#ff9800;color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .transfer-badge{position:absolute;right:2px;bottom:2px;background:#9c27b0;color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .priority-badge{position:absolute;left:2px;top:50%;transform:translateY(-50%);background:#ff5722;color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .select-checkbox{position:absolute;top:2px;left:2px;z-index:2;width:12px;height:12px}
        .right-panel{background:var(--card-bg);border-top:1px solid var(--border);padding:8px;flex-shrink:0;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
        .right-panel::-webkit-scrollbar{display:none}
        .right-section{background:#f8f9fa;border-radius:var(--radius-sm);padding:8px;border:1px solid var(--border);min-width:160px;max-width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
        .right-section h3{font-size:10px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
        .product-list{display:flex;flex-direction:column;gap:3px;max-height:100px;overflow-y:auto}
        .product-item{padding:4px 6px;background:#fff;border-radius:3px;border:1px solid var(--border);font-size:10px;display:flex;gap:3px;align-items:center;cursor:pointer;white-space:nowrap}
        .product-item.selected{background:#e8f0fe;border-color:var(--primary)}
        .batch-toolbar{display:none;gap:3px;margin-top:3px;flex-wrap:wrap}
        .batch-toolbar.active{display:flex}
        .location-batch-toolbar{display:none;gap:3px;margin-top:3px;flex-wrap:wrap}
        .location-batch-toolbar.active{display:flex}
        .btn{padding:6px 10px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;touch-action:manipulation}
        .btn:active{transform:scale(0.95)}
        .btn-primary{background:var(--primary);color:#fff}
        .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
        .btn-danger{background:var(--danger);color:#fff}
        .btn-success{background:var(--success);color:#fff}
        .btn-warning{background:var(--warning);color:#333}
        .btn-info{background:#2196f3;color:#fff}
        .btn-sm{padding:3px 6px;font-size:9px;border-radius:3px}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px}
        .modal{background:#fff;border-radius:var(--radius);padding:16px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
        .modal h2{font-size:16px;margin-bottom:12px}
        .form-group{margin-bottom:10px}
        .form-group label{display:block;font-size:11px;font-weight:500;margin-bottom:3px;color:var(--text-secondary)}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 8px;border:1.5px solid var(--border);border-radius:5px;font-size:13px}
        .toast-container{position:fixed;top:52px;right:8px;z-index:2000;display:flex;flex-direction:column;gap:5px;max-width:250px}
        .toast{padding:8px 12px;border-radius:6px;color:#fff;font-size:11px;cursor:pointer;box-shadow:var(--shadow)}
        .toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--primary)}
        .fifo-table,.stats-table,.records-table,.daily-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:11px}
        .fifo-table th,.fifo-table td,.stats-table th,.stats-table td,.records-table th,.records-table td,.daily-table th,.daily-table td{padding:5px 3px;text-align:left;border-bottom:1px solid var(--border)}
        .zone-sort-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
        .zone-sort-item{padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius-sm);background:#fafafa;cursor:move;display:flex;align-items:center;gap:8px;font-size:14px}
        .zone-sort-item.dragging{opacity:.5;border-color:var(--primary)}
        .smart-select-cards{display:flex;flex-wrap:wrap;gap:8px;}
        .smart-select-card{border:2px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;background:#fff;transition:all .2s;user-select:none;}
        .smart-select-card.active{border-color:var(--primary);background:#e8f0fe;box-shadow:0 0 0 2px rgba(26,115,232,.2);}
        @media(min-width:768px){
            .smart-select-cards{display:flex;}
            .smart-sort-target-multi,.smart-sort-aux-multi{display:none!important;}
        }
        @media(max-width:767px){
            .smart-select-cards{display:none;}
            .smart-sort-target-multi,.smart-sort-aux-multi{display:block!important;}
        }
        @media(min-width:768px){
            .main-container{flex-direction:row}
            .left-panel{width:230px;height:auto;flex-direction:column;border-right:1px solid var(--border);border-bottom:none;overflow-y:auto;overflow-x:hidden;padding:12px;gap:8px}
            .zone-list{flex-direction:column;overflow-x:visible;overflow-y:auto}
            .zone-item{white-space:normal;border-radius:var(--radius-sm)}
            .center-panel{padding:16px 20px}
            .cell{width:60px;height:52px;font-size:9px}
            .cell .cell-label{font-size:8px}
            .grid-row-label{font-size:10px;width:50px}
            .right-panel{width:280px;flex-direction:column;border-left:1px solid var(--border);border-top:none;overflow-y:auto;overflow-x:hidden;padding:12px;gap:8px}
            .right-section{min-width:auto;max-width:none}
            .header h1{font-size:16px}
            .stat-chip{font-size:11px}
            .btn{font-size:12px}
            .btn-sm{font-size:10px}
        }
        @media(min-width:1200px){
            :root{--cell-size:72px;--cell-gap:6px;--row-label-width:56px}
            .cell{width:var(--cell-size);height:60px;font-size:10px}
            .cell .cell-label{font-size:9px}
            .cell .cell-batch{font-size:7px;bottom:2px}
            .cell .cell-qty{font-size:8px;top:2px;right:3px}
            .cell .fifo-rank{font-size:7px;top:2px;left:3px}
            .cell .new-badge,.cell .yesterday-badge,.cell .hand-badge,.cell .transfer-badge,.cell .priority-badge{font-size:7px;padding:0 3px}
            .grid-row-label{width:var(--row-label-width);font-size:11px}
            .center-header h2{font-size:20px}
            .right-panel{width:320px}
            .right-section{min-width:200px}
            .product-item{font-size:12px}
            .btn{font-size:13px}
            .btn-sm{font-size:11px}
            .fifo-table th,.fifo-table td,.stats-table th,.stats-table td,.records-table th,.records-table td,.daily-table th,.daily-table td{font-size:13px;padding:8px 5px}
        }
    </style>
</head>
<body>
<header class="header">
    <div class="header-left"><div class="logo-icon">📦</div><h1>仓库管理系统</h1></div>
    <div class="header-stats" id="headerStats">
        <span class="sync-badge" id="syncBadge">🟡 连接中...</span>
        <span class="stat-chip">正常 <b id="statNormal">0</b></span>
        <span class="stat-chip">不可用 <b id="statUnavailable">0</b></span>
        <span class="stat-chip">已用 <b id="statUsed">0</b></span>
        <span class="stat-chip">产品 <b id="statProducts">0</b></span>
    </div>
</header>
<div class="main-container">
    <aside class="left-panel">
        <div class="left-panel-top">
            <span class="panel-title">仓位区域</span>
            <button class="btn btn-sm btn-outline" onclick="showZoneSortModal()">排序</button>
        </div>
        <div class="zone-list" id="zoneList"></div>
        <button class="add-zone-btn" id="btnAddZone">+ 添加区域</button>
    </aside>
    <main class="center-panel">
        <div class="center-header">
            <div><h2 id="currentZoneTitle">成品区</h2><span id="currentZoneInfo" style="font-size:11px;color:var(--text-secondary)"></span></div>
            <div class="legend"><span>🟢正常</span><span>🔴不可用</span><span>🔵已用</span><span>🟢今</span><span>🟠昨</span><span>🟠账</span><span>🟣转</span><span>🟠先</span></div>
            <button class="btn btn-outline btn-sm" id="btnToggleLocationBatch">库位批量</button>
        </div>
        <div class="location-batch-toolbar" id="locationBatchToolbar">
            <button class="btn btn-sm btn-success" onclick="batchStockInLocations()">批量入库</button>
            <button class="btn btn-sm btn-danger" onclick="batchDeleteLocations()">批量删除</button>
            <button class="btn btn-sm btn-info" onclick="batchAddToTransit()">批量加入中转仓</button>
            <button class="btn btn-sm btn-outline" onclick="exitLocationBatchMode()">退出</button>
        </div>
        <div class="grid-container" id="gridContainer"></div>
    </main>
    <aside class="right-panel">
        <div class="right-section"><h3>📦 产品</h3><div style="display:flex;gap:4px;"><button class="btn btn-outline btn-sm" id="btnToggleBatch">批量</button><button class="btn btn-primary btn-sm" id="btnAddProduct">+</button></div><div class="product-list" id="productList"></div><div class="batch-toolbar" id="batchToolbar"><button class="btn btn-sm btn-warning" onclick="batchUpdateUnit()">单位</button><button class="btn btn-sm btn-warning" onclick="batchUpdateUnitQuantity()">单位数量</button><button class="btn btn-sm btn-danger" onclick="batchDeleteProducts()">删除</button><button class="btn btn-sm btn-outline" onclick="clearSelectionAndExit()">取消</button></div></div>
        <div class="right-section"><h3>📊 统计</h3><div id="zoneStats" style="font-size:10px"></div></div>
        <div class="right-section"><h3>🧰 工具箱</h3>
            <button class="btn btn-outline btn-sm" id="btnShowFifo">FIFO批次排序</button>
            <button class="btn btn-outline btn-sm" id="btnShowStats">库存统计</button>
            <button class="btn btn-outline btn-sm" id="btnShowRecords">出入库记录</button>
            <button class="btn btn-outline btn-sm" id="btnShowDailyStats">每日统计</button>
        </div>
        <div class="right-section"><h3>🚚 中转仓</h3><button class="btn btn-outline btn-sm" id="btnShowTransit">查看中转仓</button></div>
        <div class="right-section"><h3>🧹 智能排序</h3><button class="btn btn-outline btn-sm" id="btnSmartSort">开始排序</button></div>
        <div class="right-section"><h3>💾 数据</h3><div style="display:flex;gap:4px;flex-wrap:wrap;"><button class="btn btn-outline btn-sm" id="btnExportExcel">Excel</button><button class="btn btn-outline btn-sm" id="btnExportProducts">产品</button><button class="btn btn-outline btn-sm" id="btnImportProducts">导入</button><button class="btn btn-outline btn-sm" id="btnExportData">备份</button><button class="btn btn-outline btn-sm" id="btnImportData">恢复</button></div></div>
    </aside>
</div>
<div id="modalContainer"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
// ==================== Firebase 初始化 ====================
const firebaseConfig={apiKey:"AIzaSyDu1NYuTLUxIMkkaXdJGFgE0GXGW0hwXto",authDomain:"warehouse-manager-4eec5.firebaseapp.com",databaseURL:"https://warehouse-manager-4eec5-default-rtdb.firebaseio.com",projectId:"warehouse-manager-4eec5",storageBucket:"warehouse-manager-4eec5.firebasestorage.app",messagingSenderId:"504489473795",appId:"1:504489473795:web:4bfac7455150709994db36"};
firebase.initializeApp(firebaseConfig);
const database=firebase.database();
const dbRef=database.ref('warehouse/data');

// ==================== 全局状态 ====================
let db={zones:[],locations:[],products:[],records:[],dailyStats:[],transit:[],nextZoneId:1,nextLocationId:1,nextProductId:1,nextRecordId:1,nextTransitId:1};
let currentZoneId=1,batchMode=false,selectedProducts=new Set(),locationBatchMode=false,selectedLocations=new Set(),isDBLoaded=false;
let statsGroupBy='name',fifoGroupBy='name';
let recordFilter='all',recordStartDate='',recordEndDate='',recordProductFilter='all',recordModelFilter='all';
let selectedProductFilters = new Set();
let transitFilterProduct = 'all';
let lastBatchNo = '';
let selectedTransitItems = new Set();

// ==================== 数据初始化与工具 ====================
function createDefaultDB(){
    const d={zones:[],locations:[],products:[],records:[],dailyStats:[],transit:[],nextZoneId:1,nextLocationId:1,nextProductId:1,nextRecordId:1,nextTransitId:1};
    const bz={id:1,name:'成品区',rows:34,cols:5,isBase:true,createdAt:new Date().toISOString(),rowDetails:Array(34).fill(5)};
    d.zones.push(bz); d.nextZoneId=2;
    for(let r=1;r<=34;r++) for(let c=1;c<=5;c++) d.locations.push({id:d.nextLocationId++,zoneId:1,rowNum:r,colNum:c,status:'normal',productId:null,batchNo:null,quantity:0,customPieces:0,remark:'',handAccount:false,updatedAt:null,transferFlag:false});
    return d;
}
function ensureCompleteDB(data){
    if(!data||typeof data!=='object')return createDefaultDB();
    if(!Array.isArray(data.zones))data.zones=[];
    if(!Array.isArray(data.locations))data.locations=[];
    if(!Array.isArray(data.products))data.products=[];
    if(!Array.isArray(data.records))data.records=[];
    if(!Array.isArray(data.dailyStats))data.dailyStats=[];
    if(!Array.isArray(data.transit))data.transit=[];
    if(!data.nextZoneId)data.nextZoneId=1;
    if(!data.nextLocationId)data.nextLocationId=1;
    if(!data.nextProductId)data.nextProductId=1;
    if(!data.nextRecordId)data.nextRecordId=1;
    if(!data.nextTransitId)data.nextTransitId=1;
    data.products.forEach(p=>{if(!p.unit)p.unit='件';if(!p.remark)p.remark='';if(p.isPriority===undefined)p.isPriority=false;});
    data.locations.forEach(l=>{if(!l.remark)l.remark='';if(l.customPieces===undefined)l.customPieces=0;if(l.handAccount===undefined)l.handAccount=false;if(l.transferFlag===undefined)l.transferFlag=false;});
    data.zones.forEach(z=>{if(!z.rowDetails)z.rowDetails=Array(z.rows).fill(z.cols);});
    return data;
}
function initFromFirebase(){
    const timeout=setTimeout(()=>{
        if(!isDBLoaded){db=createDefaultDB();isDBLoaded=true;renderAll();updateSyncBadge(false);showToast('Firebase连接超时','error');}
    },8000);
    dbRef.once('value',snapshot=>{
        clearTimeout(timeout);
        const raw=snapshot.val();
        db=ensureCompleteDB(raw||null);
        if(!raw)dbRef.set(db);
        isDBLoaded=true;
        updateDailyStatsIfNeeded();
        renderAll();
        startRealtimeListener();
        updateSyncBadge(true);
    }).catch(()=>{
        clearTimeout(timeout);
        db=createDefaultDB();isDBLoaded=true;renderAll();updateSyncBadge(false);showToast('无法连接云端','error');
    });
}
function startRealtimeListener(){
    dbRef.on('value',snapshot=>{
        const data=ensureCompleteDB(snapshot.val()||null);
        db=data;
        updateDailyStatsIfNeeded();
        renderAll();
        updateSyncBadge(true);
    });
    database.ref('.info/connected').on('value',snap=>{
        updateSyncBadge(snap.val()===true);
    });
}
function updateSyncBadge(online){
    const b=document.getElementById('syncBadge');
    if(online){b.textContent='🟢 已同步';b.className='sync-badge online';}
    else{b.textContent='🔴 离线';b.className='sync-badge offline';}
}
function saveDB(newDb){
    db=ensureCompleteDB(newDb);
    dbRef.set(db).catch(err=>showToast('保存失败','error'));
}
function addRecord(targetDb,type,product,loc,zone,quantity,customPieces,remark,targetZoneName,targetLocationLabel,locationId){
    if(!targetDb||!Array.isArray(targetDb.records))return;
    const rec={
        id:targetDb.nextRecordId++,
        type:type,
        productId:product.id,
        productName:product.name||'未知产品',
        productModel:product.model||'',
        productUnit:product.unit||'件',
        zoneName:zone?.name||'未知',
        locationLabel:getRowDisplayLabel(zone,loc.rowNum)+'排'+getDisplayColNumber(zone,loc.colNum)+'托',
        quantity:quantity||0,
        customPieces:customPieces||0,
        batchNo:loc.batchNo||'',
        remark:remark||'',
        targetZoneName:targetZoneName||'',
        targetLocationLabel:targetLocationLabel||'',
        locationId:locationId||loc.id,
        timestamp:new Date().toISOString()
    };
    targetDb.records.push(rec);
}
function getProductDisplayInfo(pid){
    if(!db||!Array.isArray(db.products))return{pieces:0,unit:'件',unitQuantity:1,remark:'',isPriority:false};
    const p=db.products.find(x=>x.id===pid);
    if(!p)return{pieces:0,unit:'件',unitQuantity:1,remark:'',isPriority:false};
    const rp=db.locations.filter(l=>l.productId===pid&&l.status==='used').reduce((s,l)=>s+(l.quantity||0)*(p.unitQuantity||1),0);
    const cp=db.locations.filter(l=>l.productId===pid&&l.status==='used').reduce((s,l)=>s+(l.customPieces||0),0);
    const tp=db.transit.filter(t=>t.productId===pid).reduce((s,t)=>s+(t.quantity||0)*(p.unitQuantity||1)+(t.customPieces||0),0);
    return{pieces:rp+cp+tp,unit:p.unit||'件',unitQuantity:p.unitQuantity||1,remark:p.remark||'',isPriority:!!p.isPriority};
}
function getRowDisplayLabel(zone,rowNum){
    if(zone&&zone.id===1){
        if(rowNum<=17)return'A'+String(rowNum).padStart(2,'0');
        return'B'+String(rowNum-17).padStart(2,'0');
    }
    return String(rowNum);
}
function getDisplayColArray(zone,rowNum){
    let cols=zone.cols;
    if(zone.rowDetails && zone.rowDetails[rowNum-1]) cols=zone.rowDetails[rowNum-1];
    if(zone.id===1&&cols===5)return[3,2,4,1,5];
    return Array.from({length:cols},(_,i)=>i+1);
}
function getDisplayColNumber(zone,oc){
    const arr=getDisplayColArray(zone,1);
    const idx=arr.indexOf(oc);
    return idx!==-1?idx+1:oc;
}
function sortLocationsForDisplay(locs){
    const zoneOrder = new Map(db.zones.map((z, idx) => [z.id, idx]));
    return locs.sort((a,b)=>{
        const za = zoneOrder.has(a.zoneId) ? zoneOrder.get(a.zoneId) : Number.MAX_SAFE_INTEGER;
        const zb = zoneOrder.has(b.zoneId) ? zoneOrder.get(b.zoneId) : Number.MAX_SAFE_INTEGER;
        if(za !== zb) return za - zb;
        if(a.rowNum !== b.rowNum) return a.rowNum - b.rowNum;
        return a.colNum - b.colNum;
    });
}

function addZone(){
    const name=document.getElementById('newZoneName').value.trim();
    const rows=parseInt(document.getElementById('newZoneRows').value);
    const cols=parseInt(document.getElementById('newZoneCols').value);
    const detailsStr=document.getElementById('newZoneRowDetails')?.value.trim();
    if(!name||!rows||!cols){showToast('请填写完整','error');return;}
    const nd=JSON.parse(JSON.stringify(db));
    const zone={id:nd.nextZoneId++,name,rows,cols,isBase:false,createdAt:new Date().toISOString(),rowDetails:[]};
    if(detailsStr){
        const arr=detailsStr.split(',').map(Number);
        for(let i=0;i<rows;i++) zone.rowDetails[i]=arr[i]||cols;
    } else {
        zone.rowDetails=Array(rows).fill(cols);
    }
    nd.zones.push(zone);
    for(let r=1;r<=rows;r++){
        const rowCols=zone.rowDetails[r-1];
        for(let c=1;c<=rowCols;c++){
            nd.locations.push({id:nd.nextLocationId++,zoneId:zone.id,rowNum:r,colNum:c,status:'normal',productId:null,batchNo:null,quantity:0,customPieces:0,remark:'',handAccount:false,updatedAt:null,transferFlag:false});
        }
    }
    currentZoneId=zone.id;
    saveDB(nd);closeModal();showToast('已添加','success');
}
function showEditZoneModal(zoneId){
    const zone=db.zones.find(z=>z.id===zoneId);
    if(!zone) return;
    const detailsStr=zone.rowDetails?zone.rowDetails.join(','):'';
    openModal(`<h2>编辑区域</h2>
        <div class="form-group"><label>名称</label><input id="editZoneName" value="${zone.name}"></div>
        <div class="form-group"><label>排数</label><input type="number" id="editZoneRows" value="${zone.rows}" min="1"></div>
        <div class="form-group"><label>每排托数（逗号分隔，如 10,10,3）</label><input id="editZoneRowDetails" value="${detailsStr}"></div>
        <div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveEditZone(${zoneId})">保存</button></div>`);
}
function saveEditZone(zoneId){
    const nd=JSON.parse(JSON.stringify(db));
    const zone=nd.zones.find(z=>z.id===zoneId);
    if(!zone) return;
    const newName=document.getElementById('editZoneName').value.trim();
    const newRows=parseInt(document.getElementById('editZoneRows').value);
    const detailsStr=document.getElementById('editZoneRowDetails').value.trim();
    if(!newName||!newRows||newRows<1){showToast('请输入有效信息','error');return;}
    const newRowDetails=[];
    if(detailsStr){
        const arr=detailsStr.split(',').map(Number);
        for(let i=0;i<newRows;i++) newRowDetails[i]=arr[i]||zone.cols;
    } else {
        for(let i=0;i<newRows;i++) newRowDetails[i]=zone.cols;
    }
    const oldLocs=nd.locations.filter(l=>l.zoneId===zoneId);
    for(const loc of oldLocs){
        const rowCols=newRowDetails[loc.rowNum-1]||0;
        if(loc.status==='used' && loc.colNum>rowCols){
            showToast(`第${loc.rowNum}排有产品超出新托数，请先迁移`, 'error');
            return;
        }
    }
    zone.name=newName; zone.rows=newRows; zone.rowDetails=newRowDetails;
    nd.locations=nd.locations.filter(l=>{
        if(l.zoneId!==zoneId) return true;
        const rowCols=newRowDetails[l.rowNum-1]||0;
        if(l.rowNum>newRows || l.colNum>rowCols){
            if(l.status==='used') return true;
            return false;
        }
        return true;
    });
    for(let r=1;r<=newRows;r++){
        const rowCols=newRowDetails[r-1]||0;
        for(let c=1;c<=rowCols;c++){
            if(!nd.locations.some(l=>l.zoneId===zoneId && l.rowNum===r && l.colNum===c)){
                nd.locations.push({id:nd.nextLocationId++,zoneId,rowNum:r,colNum:c,status:'normal',productId:null,batchNo:null,quantity:0,customPieces:0,remark:'',handAccount:false,updatedAt:null,transferFlag:false});
            }
        }
    }
    saveDB(nd);closeModal();renderAll();showToast('区域已更新','success');
}

function renderGridTable(locs,zone,rankMap){
    if(locs.length===0)return'';
    const rows=[...new Set(locs.map(l=>l.rowNum))].sort((a,b)=>a-b);
    let html='<div class="grid-table">';
    rows.forEach(r=>{
        const rowCols=zone.rowDetails? (zone.rowDetails[r-1]||zone.cols) : zone.cols;
        const displayCols=getDisplayColArray({...zone, cols:rowCols}, r);
        html+='<div class="grid-row"><div class="grid-row-label">'+getRowDisplayLabel(zone,r)+'</div>';
        for(let idx=0;idx<displayCols.length;idx++){
            const oc=displayCols[idx];
            const loc=locs.find(l=>l.rowNum===r&&l.colNum===oc);
            if(loc){
                let style='',rankBadge='',newBadge='',yesterdayBadge='',handBadge='',transferBadge='',priorityBadge='',cbHtml='';
                if(loc.status==='used'){
                    const info=rankMap[loc.id];
                    if(info){style='background-color:'+getFifoColor(info.rank,info.total)+';border-color:'+getFifoBorderColor(info.rank,info.total)+';';rankBadge='<span class="fifo-rank">#'+(info.rank+1)+'/'+info.total+'</span>';}
                    else style='background-color:#1e88e5;border-color:#0d47a1;';
                    const updatedDate=loc.updatedAt?loc.updatedAt.split('T')[0]:null;
                    if(updatedDate){const today=new Date().toISOString().split('T')[0];const yesterday=new Date(Date.now()-86400000).toISOString().split('T')[0];if(updatedDate===today)newBadge='<span class="new-badge">今</span>';else if(updatedDate===yesterday)yesterdayBadge='<span class="yesterday-badge">昨</span>';}
                    if(loc.handAccount)handBadge='<span class="hand-badge">账</span>';
                    if(loc.transferFlag)transferBadge='<span class="transfer-badge">转</span>';
                }
                if(locationBatchMode)cbHtml='<input type="checkbox" class="select-checkbox"'+(selectedLocations.has(loc.id)?' checked':'')+' onclick="toggleLocationSelect('+loc.id+',event)">';
                let label='',batchInfo='',qtyInfo='';
                if(loc.status==='used'&&loc.productId){
                    const p=db.products.find(x=>x.id===loc.productId);
                    label=p?p.name:'未知产品';
                    if(p&&p.isPriority)priorityBadge='<span class="priority-badge">先</span>';
                    const batchDate=loc.batchNo?String(loc.batchNo).slice(5).replace('-','/'):'';
                    batchInfo=batchDate;
                    if(loc.customPieces>0)qtyInfo=loc.customPieces+'件';
                    else qtyInfo=loc.quantity>0?loc.quantity+(p?.unit||'件'):'';
                }else if(loc.status==='unavailable')label='🚫';
                else label='托'+(idx+1);
                const click=locationBatchMode?'toggleLocationSelect('+loc.id+',event)':'handleCellClick('+loc.id+')';
                const cmenu=locationBatchMode?'':'handleCellRightClick('+loc.id+');return false;';
                html+='<div class="cell status-'+loc.status+'" style="'+style+'" onclick="'+click+'" oncontextmenu="'+cmenu+'">'+cbHtml+rankBadge+newBadge+yesterdayBadge+handBadge+transferBadge+priorityBadge+'<span class="cell-label">'+label+'</span>'+(qtyInfo?'<span class="cell-qty">'+qtyInfo+'</span>':'')+(batchInfo?'<span class="cell-batch">'+batchInfo+'</span>':'')+'</div>';
            }else{
                html+='<div class="cell" style="border-style:dashed;opacity:.3;">托'+(idx+1)+'</div>';
            }
        }
        html+='</div>';
    });
    html+='</div>';
    return html;
}

function toggleLocationBatchMode(){locationBatchMode=!locationBatchMode;if(!locationBatchMode){selectedLocations.clear();document.getElementById('locationBatchToolbar').classList.remove('active');}else document.getElementById('locationBatchToolbar').classList.add('active');renderGrid();}
function toggleLocationSelect(id,ev){if(ev)ev.stopPropagation();if(selectedLocations.has(id))selectedLocations.delete(id);else selectedLocations.add(id);renderGrid();}
function exitLocationBatchMode(){selectedLocations.clear();locationBatchMode=false;document.getElementById('locationBatchToolbar').classList.remove('active');renderGrid();}
function batchStockInLocations(){
    if(selectedLocations.size===0){showToast('请先勾选库位','error');return;}
    const empty=[...selectedLocations].filter(id=>db.locations.find(l=>l.id===id)?.status==='normal');
    if(empty.length===0){showToast('没有空库位','error');return;}
    const sortedEmpty=empty.map(id=>db.locations.find(l=>l.id===id)).sort((a,b)=>{if(a.zoneId!==b.zoneId)return a.zoneId-b.zoneId;if(a.rowNum!==b.rowNum)return a.rowNum-b.rowNum;return a.colNum-b.colNum;});
    const today=new Date().toISOString().slice(0,10);
    const defaultBatch=lastBatchNo||today;
    let opts=db.products.map(p=>'<option value="'+p.id+'">'+(p.name||'未知产品')+' ('+(p.model||'')+')</option>').join('');
    let batchRowsHtml='';
    sortedEmpty.forEach(loc=>{const zone=db.zones.find(z=>z.id===loc.zoneId);const locName=zone.name+' '+getRowDisplayLabel(zone,loc.rowNum)+'排'+getDisplayColNumber(zone,loc.colNum)+'托';batchRowsHtml+=`<div style="display:flex;align-items:center;margin-bottom:4px;"><span style="flex:1;font-size:12px;">${locName}</span><input type="date" id="batchNo_${loc.id}" value="${defaultBatch}" style="width:150px;"></div>`;});
    openModal('<h2>批量入库</h2><p>已选 '+sortedEmpty.length+' 个空库位，按顺序添加，可分别设置批次号：</p><div style="background:#f8f9fa;padding:6px;border-radius:4px;margin-bottom:10px;max-height:200px;overflow-y:auto">'+batchRowsHtml+'</div><div class="form-group"><label>产品</label><select id="batchStockProduct">'+opts+'</select></div><div class="form-group"><label>方式</label><select id="batchStockType" onchange="toggleBatchStockType()"><option value="unit">按单位数量</option><option value="custom">自定义件数</option></select></div><div class="form-group" id="batchUnitQtyGroup"><label>单位数量</label><input type="number" id="batchStockQty" min="0.01" step="any" value="1"></div><div class="form-group" id="batchCustomPiecesGroup" style="display:none"><label>件数</label><input type="number" id="batchStockCustomPieces" min="1" step="1" value="1"></div><div class="form-group"><label>备注</label><textarea id="batchStockRemark"></textarea></div><div class="form-group"><label>记录手帐</label><input type="checkbox" id="batchHandAccount"></div><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-success" onclick="confirmBatchStockIn()">确认</button></div>');
}
function toggleBatchStockType(){const t=document.getElementById('batchStockType').value;document.getElementById('batchUnitQtyGroup').style.display=t==='unit'?'block':'none';document.getElementById('batchCustomPiecesGroup').style.display=t==='custom'?'block':'none';}
function confirmBatchStockIn(){
    const pid=parseInt(document.getElementById('batchStockProduct').value);const remark=document.getElementById('batchStockRemark').value.trim();const type=document.getElementById('batchStockType').value;const handAccount=document.getElementById('batchHandAccount')?.checked||false;const product=db.products.find(p=>p.id===pid);if(!product){showToast('产品不存在','error');return;}let qty=0,cp=0;if(type==='unit'){qty=parseFloat(document.getElementById('batchStockQty').value);if(!qty||qty<=0){showToast('无效','error');return;}}else{cp=parseInt(document.getElementById('batchStockCustomPieces').value);if(!Number.isInteger(cp)||cp<1){showToast('无效','error');return;}}
    const empty=[...selectedLocations].filter(id=>db.locations.find(l=>l.id===id)?.status==='normal');
    const sortedEmpty=empty.map(id=>db.locations.find(l=>l.id===id)).sort((a,b)=>{if(a.zoneId!==b.zoneId)return a.zoneId-b.zoneId;if(a.rowNum!==b.rowNum)return a.rowNum-b.rowNum;return a.colNum-b.colNum;});
    const nd=JSON.parse(JSON.stringify(db));
    sortedEmpty.forEach(loc=>{const batchInput=document.getElementById('batchNo_'+loc.id);const batch=batchInput?batchInput.value:(lastBatchNo||new Date().toISOString().slice(0,10));if(!batch){showToast('批次号不能为空','error');return;}lastBatchNo=batch;const nl=nd.locations.find(l=>l.id===loc.id);const zone=db.zones.find(z=>z.id===loc.zoneId);nl.status='used';nl.productId=pid;nl.batchNo=batch;nl.remark=remark;nl.handAccount=handAccount;nl.updatedAt=new Date().toISOString();if(type==='unit'){nl.quantity=qty;nl.customPieces=0;}else{nl.quantity=0;nl.customPieces=cp;}addRecord(nd,'入库',product,nl,zone,qty,cp,remark,null,null,loc.id);});
    saveDB(nd);closeModal();exitLocationBatchMode();showToast('批量入库成功','success');
}
function batchDeleteLocations(){
    if(selectedLocations.size===0){showToast('请先勾选库位','error');return;}
    const used=[...selectedLocations].filter(id=>db.locations.find(l=>l.id===id)?.status==='used');
    if(used.length===0){showToast('没有已用库位','error');return;}
    if(!confirm('批量删除选中的已用库位产品，并删除其入库记录？'))return;
    const nd=JSON.parse(JSON.stringify(db));
    used.forEach(lid=>{const loc=nd.locations.find(l=>l.id===lid);const orig=db.locations.find(l=>l.id===lid);const product=db.products.find(p=>p.id===orig.productId);if(product){nd.records=nd.records.filter(r=>!(r.locationId===lid && r.type==='入库' && r.productId===product.id));}loc.status='normal';loc.productId=null;loc.batchNo=null;loc.quantity=0;loc.customPieces=0;loc.remark='';loc.handAccount=false;loc.updatedAt=null;loc.transferFlag=false;});
    saveDB(nd);exitLocationBatchMode();showToast('批量删除成功','success');
}
function batchAddToTransit(){
    if(selectedLocations.size===0){showToast('请先勾选库位','error');return;}
    const used=[...selectedLocations].filter(id=>db.locations.find(l=>l.id===id)?.status==='used');
    if(used.length===0){showToast('没有已用库位','error');return;}
    if(!confirm('将选中的 '+used.length+' 个已用库位产品全部加入中转仓？'))return;
    const nd=JSON.parse(JSON.stringify(db));
    used.forEach(lid=>{const loc=nd.locations.find(l=>l.id===lid);const orig=db.locations.find(l=>l.id===lid);const product=db.products.find(p=>p.id===orig.productId);const zone=db.zones.find(z=>z.id===orig.zoneId);if(!product||!zone)return;const transitEntry={id:nd.nextTransitId++,productId:orig.productId,batchNo:orig.batchNo,quantity:orig.quantity,customPieces:orig.customPieces,remark:orig.remark,handAccount:orig.handAccount,updatedAt:new Date().toISOString(),sourceLocationId:orig.id,transferFlag:true};nd.transit.push(transitEntry);loc.status='normal';loc.productId=null;loc.batchNo=null;loc.quantity=0;loc.customPieces=0;loc.remark='';loc.handAccount=false;loc.updatedAt=null;loc.transferFlag=false;addRecord(nd,'加入中转仓',product,{...orig,rowNum:orig.rowNum,colNum:orig.colNum},zone,orig.quantity,orig.customPieces,'批量加入中转仓',null,null,orig.id);});
    saveDB(nd);exitLocationBatchMode();showToast('批量加入中转仓成功','success');
}

// ==================== 库位单元格交互 ====================
function handleCellClick(lid){
    if(locationBatchMode){toggleLocationSelect(lid,event);return;}
    if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}
    const loc=db.locations.find(l=>l.id===lid);
    if(!loc)return;
    const zone=db.zones.find(z=>z.id===loc.zoneId);
    if(loc.status==='unavailable'){showToast('不可用','error');return;}
    if(loc.status==='used')showUsedLocationModal(loc,zone);
    else showStockInModal(loc,zone);
}
function handleCellRightClick(lid){
    if(locationBatchMode)return;
    if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}
    const loc=db.locations.find(l=>l.id===lid);
    if(!loc)return;
    if(loc.status==='used'){showToast('请先出库','error');return;}
    const nd=JSON.parse(JSON.stringify(db));
    const nl=nd.locations.find(l=>l.id===lid);
    if(nl.status==='unavailable'){nl.status='normal';saveDB(nd);showToast('恢复','success');return;}
    nl.status='unavailable';saveDB(nd);showToast('标记不可用','info');
}
function showStockInModal(loc,zone){
    if(!db||!Array.isArray(db.products)||db.products.length===0){showToast('请先创建产品','error');return;}
    const today=new Date().toISOString().slice(0,10);
    const rl=getRowDisplayLabel(zone,loc.rowNum),dc=getDisplayColNumber(zone,loc.colNum);
    let opts=db.products.map(p=>'<option value="'+p.id+'">'+(p.name||'未知产品')+' ('+(p.model||'')+')</option>').join('');
    openModal('<h2>📥 入库</h2><p>仓位:'+zone?.name+' '+rl+'排'+dc+'托</p><div class="form-group"><label>产品</label><select id="stockInProduct">'+opts+'</select></div><div class="form-group"><label>方式</label><select id="stockInType" onchange="toggleStockInType()"><option value="unit">按单位数量</option><option value="custom">自定义件数</option></select></div><div class="form-group" id="unitQtyGroup"><label>单位数量</label><input type="number" id="stockInQty" min="0.01" step="any" value="1"></div><div class="form-group" id="customPiecesGroup" style="display:none"><label>件数</label><input type="number" id="stockInCustomPieces" min="1" step="1" value="1"></div><div class="form-group"><label>批次日期</label><input type="date" id="stockInBatch" value="'+today+'"></div><div class="form-group"><label>备注</label><textarea id="stockInRemark"></textarea></div><div class="form-group"><label>记录手帐</label><input type="checkbox" id="stockHandAccount"></div><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-success" onclick="stockIn('+loc.id+')">确认入库</button></div>');
}
function toggleStockInType(){const t=document.getElementById('stockInType').value;document.getElementById('unitQtyGroup').style.display=t==='unit'?'block':'none';document.getElementById('customPiecesGroup').style.display=t==='custom'?'block':'none';}
function stockIn(lid){if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}const loc=db.locations.find(l=>l.id===lid);if(!loc||loc.status!=='normal'){showToast('状态异常','error');closeModal();return;}const pid=parseInt(document.getElementById('stockInProduct').value);const batch=document.getElementById('stockInBatch').value;const remark=document.getElementById('stockInRemark').value.trim();const handAccount=document.getElementById('stockHandAccount')?.checked||false;if(!pid||!batch){showToast('信息不完整','error');return;}const product=db.products.find(p=>p.id===pid);if(!product){showToast('产品不存在','error');return;}const type=document.getElementById('stockInType').value;const nd=JSON.parse(JSON.stringify(db));const nl=nd.locations.find(l=>l.id===lid);const zone=db.zones.find(z=>z.id===nl.zoneId);nl.status='used';nl.productId=pid;nl.batchNo=batch;nl.remark=remark;nl.handAccount=handAccount;nl.updatedAt=new Date().toISOString();let qty=0,cp=0;if(type==='unit'){qty=parseFloat(document.getElementById('stockInQty').value);if(!qty||qty<=0){showToast('无效','error');return;}nl.quantity=qty;nl.customPieces=0;}else{cp=parseInt(document.getElementById('stockInCustomPieces').value);if(!Number.isInteger(cp)||cp<1){showToast('无效','error');return;}nl.quantity=0;nl.customPieces=cp;}addRecord(nd,'入库',product,nl,zone,qty,cp,remark,null,null,loc.id);saveDB(nd);closeModal();showToast('入库成功','success');}
function showUsedLocationModal(loc,zone){if(!db||!Array.isArray(db.products)){showToast('数据未加载','info');return;}const product=db.products.find(p=>p.id===loc.productId);const rl=getRowDisplayLabel(zone,loc.rowNum),dc=getDisplayColNumber(zone,loc.colNum);const isCustom=loc.customPieces>0;const rp=loc.quantity*(product?.unitQuantity||1);const disp=isCustom?loc.customPieces+'件':loc.quantity+(product?.unit||'件')+' ('+rp.toFixed(2)+'件)';openModal('<h2>📤 仓位操作</h2><p>仓位:'+zone?.name+' '+rl+'排'+dc+'托</p><div style="background:#f8f9fa;padding:8px;border-radius:6px;margin-bottom:10px"><p>产品:'+(product?.name||'未知产品')+'</p><p>型号:'+(product?.model||'')+'</p><p>批次:'+loc.batchNo+'</p><p>数量:'+disp+'</p><p>手帐:'+(loc.handAccount?'是':'否')+'</p><p>转移标识:'+(loc.transferFlag?'是':'否')+'</p><p>备注:'+(loc.remark||'-')+'</p></div>'+(isCustom?'<div class="form-group"><label>出库件数(最大'+loc.customPieces+')</label><input type="number" id="stockOutQty" min="1" max="'+loc.customPieces+'" step="1" value="'+loc.customPieces+'"></div>':'<div class="form-group"><label>出库单位数量(最大'+loc.quantity+')</label><input type="number" id="stockOutQty" min="0.01" max="'+loc.quantity+'" step="any" value="'+loc.quantity+'"></div>')+'<div class="form-actions" style="flex-wrap:wrap;gap:6px"><button class="btn btn-outline" onclick="closeModal()">关闭</button><button class="btn btn-danger" onclick="stockOut('+loc.id+')">出库</button><button class="btn btn-warning" onclick="shipOut('+loc.id+')">发货</button><button class="btn btn-primary" onclick="showMigrateModal('+loc.id+')">迁移</button><button class="btn btn-info" onclick="addToTransit('+loc.id+')">加入中转仓</button><button class="btn btn-outline" onclick="toggleTransferFlag('+loc.id+')">标记转移</button><button class="btn btn-danger" onclick="deleteLocationProduct('+loc.id+')">删除产品</button></div>');}
function toggleTransferFlag(lid){if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}const nd=JSON.parse(JSON.stringify(db));const nl=nd.locations.find(l=>l.id===lid);if(!nl||nl.status!=='used'){showToast('仅已用库位可标记','error');return;}nl.transferFlag=!nl.transferFlag;saveDB(nd);closeModal();showToast(nl.transferFlag?'已标记转移':'已取消转移','success');}
function stockOut(lid){if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}const loc=db.locations.find(l=>l.id===lid);if(!loc||loc.status!=='used'){showToast('状态异常','error');closeModal();return;}const product=db.products.find(p=>p.id===loc.productId);const zone=db.zones.find(z=>z.id===loc.zoneId);const nd=JSON.parse(JSON.stringify(db));const nl=nd.locations.find(l=>l.id===lid);let oq=0,op=0;if(nl.customPieces>0){op=parseInt(document.getElementById('stockOutQty').value);if(!Number.isInteger(op)||op<1||op>nl.customPieces){showToast('无效','error');return;}const rem=nl.customPieces-op;if(rem>0)nl.customPieces=rem;else{nl.status='normal';nl.productId=null;nl.batchNo=null;nl.quantity=0;nl.customPieces=0;nl.remark='';nl.handAccount=false;nl.updatedAt=null;nl.transferFlag=false;}}else{oq=parseFloat(document.getElementById('stockOutQty').value);if(!oq||oq<=0||oq>nl.quantity){showToast('无效','error');return;}const rem=nl.quantity-oq;if(rem>0)nl.quantity=rem;else{nl.status='normal';nl.productId=null;nl.batchNo=null;nl.quantity=0;nl.customPieces=0;nl.remark='';nl.handAccount=false;nl.updatedAt=null;nl.transferFlag=false;}}if(product)addRecord(nd,'出库',product,loc,zone,oq,op,'出库',null,null,loc.id);saveDB(nd);closeModal();showToast('出库成功','success');}
function shipOut(lid){if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}const loc=db.locations.find(l=>l.id===lid);if(!loc||loc.status!=='used'){showToast('状态异常','error');closeModal();return;}const product=db.products.find(p=>p.id===loc.productId);const zone=db.zones.find(z=>z.id===loc.zoneId);const nd=JSON.parse(JSON.stringify(db));const nl=nd.locations.find(l=>l.id===lid);if(product)addRecord(nd,'发货',product,loc,zone,nl.quantity,nl.customPieces,'发货',null,null,loc.id);nl.status='normal';nl.productId=null;nl.batchNo=null;nl.quantity=0;nl.customPieces=0;nl.remark='';nl.handAccount=false;nl.updatedAt=null;nl.transferFlag=false;saveDB(nd);closeModal();showToast('发货成功','success');}
function showMigrateModal(lid){if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}const loc=db.locations.find(l=>l.id===lid);if(!loc||loc.status!=='used'){showToast('状态异常','error');return;}const emptyLocs=sortLocationsForDisplay(db.locations.filter(l=>l.status==='normal'));if(emptyLocs.length===0){showToast('没有空库位','error');return;}let opts=emptyLocs.map(l=>{const zone=db.zones.find(z=>z.id===l.zoneId);return '<option value="'+l.id+'">'+zone?.name+' '+getRowDisplayLabel(zone,l.rowNum)+'排'+getDisplayColNumber(zone,l.colNum)+'托</option>';}).join('');openModal('<h2>🔄 迁移产品</h2><p>将产品从当前库位迁移到目标空库位</p><div class="form-group"><label>目标库位</label><select id="migrateTarget">'+opts+'</select></div><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="confirmMigrate('+lid+')">确认迁移</button></div>');}
function confirmMigrate(lid){const targetId=parseInt(document.getElementById('migrateTarget').value);if(!targetId){showToast('请选择目标','error');return;}const src=db.locations.find(l=>l.id===lid);const dst=db.locations.find(l=>l.id===targetId);if(!src||!dst||src.status!=='used'||dst.status!=='normal'){showToast('状态异常','error');return;}const product=db.products.find(p=>p.id===src.productId);const srcZone=db.zones.find(z=>z.id===src.zoneId);const dstZone=db.zones.find(z=>z.id===dst.zoneId);const nd=JSON.parse(JSON.stringify(db));const ns=nd.locations.find(l=>l.id===lid);const nt=nd.locations.find(l=>l.id===targetId);nt.status='used';nt.productId=ns.productId;nt.batchNo=ns.batchNo;nt.quantity=ns.quantity;nt.customPieces=ns.customPieces;nt.remark=ns.remark;nt.handAccount=ns.handAccount;nt.updatedAt=new Date().toISOString();nt.transferFlag=true;ns.status='normal';ns.productId=null;ns.batchNo=null;ns.quantity=0;ns.customPieces=0;ns.remark='';ns.handAccount=false;ns.updatedAt=null;ns.transferFlag=false;if(product){addRecord(nd,'迁移',product,dst,srcZone,0,0,'从'+srcZone?.name+'迁移至'+dstZone?.name,dstZone?.name,getRowDisplayLabel(dstZone,dst.rowNum)+'排'+getDisplayColNumber(dstZone,dst.colNum)+'托',nt.id);}saveDB(nd);closeModal();showToast('迁移成功','success');}
function deleteLocationProduct(lid){if(!db||!Array.isArray(db.locations)){showToast('数据未加载','info');return;}const loc=db.locations.find(l=>l.id===lid);if(!loc||loc.status!=='used'){showToast('状态异常','error');return;}if(!confirm('删除该库位产品，并删除其入库记录？'))return;const nd=JSON.parse(JSON.stringify(db));const nl=nd.locations.find(l=>l.id===lid);const product=db.products.find(p=>p.id===nl.productId);const zone=db.zones.find(z=>z.id===nl.zoneId);if(product){nd.records=nd.records.filter(r=>!(r.locationId===lid&&r.type==='入库'&&r.productId===product.id));}nl.status='normal';nl.productId=null;nl.batchNo=null;nl.quantity=0;nl.customPieces=0;nl.remark='';nl.handAccount=false;nl.updatedAt=null;nl.transferFlag=false;saveDB(nd);closeModal();showToast('已删除产品及其入库记录','success');}
function addToTransit(lid){if(!db||!Array.isArray(db.locations)||!Array.isArray(db.transit)){showToast('数据未加载','info');return;}const loc=db.locations.find(l=>l.id===lid);if(!loc||loc.status!=='used'){showToast('状态异常','error');return;}const product=db.products.find(p=>p.id===loc.productId);const zone=db.zones.find(z=>z.id===loc.zoneId);if(!product||!zone){showToast('数据错误','error');return;}if(!confirm('确定将该产品加入中转仓？'))return;const nd=JSON.parse(JSON.stringify(db));const transitEntry={id:nd.nextTransitId++,productId:loc.productId,batchNo:loc.batchNo,quantity:loc.quantity,customPieces:loc.customPieces,remark:loc.remark,handAccount:loc.handAccount,updatedAt:new Date().toISOString(),sourceLocationId:loc.id,transferFlag:true};nd.transit.push(transitEntry);const nl=nd.locations.find(l=>l.id===lid);nl.status='normal';nl.productId=null;nl.batchNo=null;nl.quantity=0;nl.customPieces=0;nl.remark='';nl.handAccount=false;nl.updatedAt=null;nl.transferFlag=false;addRecord(nd,'加入中转仓',product,{...loc,rowNum:loc.rowNum,colNum:loc.colNum},zone,loc.quantity,loc.customPieces,'加入中转仓',null,null,loc.id);saveDB(nd);closeModal();showToast('已加入中转仓','success');}

// ==================== 中转仓管理 ====================
function renderTransitModal(){if(!db||!Array.isArray(db.transit)){showToast('数据未加载','info');return;}let productOpts='<option value="all">全部产品</option>';db.products.forEach(p=>{productOpts+='<option value="'+p.id+'">'+(p.name||'未知产品')+' ('+(p.model||'')+')</option>';});openModal('<h2>🚚 中转仓</h2><div class="form-group"><label>筛选产品</label><select id="transitFilter" onchange="transitFilterProduct=this.value;renderTransitList();">'+productOpts+'</select></div><div id="transitList"></div><div class="form-actions" style="flex-wrap:wrap;gap:6px;"><button class="btn btn-danger" onclick="clearAllTransit()">一键清空</button><button class="btn btn-warning" onclick="batchClearSelectedTransit()">批量清空</button><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>');if(transitFilterProduct!=='all')document.getElementById('transitFilter').value=transitFilterProduct;renderTransitList();}
function renderTransitList(){const container=document.getElementById('transitList');if(!container||!db||!Array.isArray(db.transit))return;let items=db.transit;if(transitFilterProduct!=='all'){items=items.filter(t=>t.productId==parseInt(transitFilterProduct));}if(items.length===0){container.innerHTML='<p>中转仓为空</p>';return;}let html='<table class="records-table"><thead><tr><th>选择</th><th>产品</th><th>批次</th><th>数量</th><th>备注</th><th>转移标识</th><th>时间</th><th>操作</th></tr></thead><tbody>';items.forEach(t=>{const p=db.products.find(x=>x.id===t.productId);const qs=t.customPieces>0?t.customPieces+'件':t.quantity+(p?.unit||'件');const checked=selectedTransitItems.has(t.id)?'checked':'';html+='<tr><td><input type="checkbox" '+(checked)+' onchange="toggleTransitSelect('+t.id+')"></td><td>'+(p?.name||'未知产品')+'</td><td>'+t.batchNo+'</td><td>'+qs+'</td><td>'+(t.remark||'-')+'</td><td>'+(t.transferFlag?'是':'否')+'</td><td>'+new Date(t.updatedAt).toLocaleString()+'</td><td><button class="btn btn-sm btn-primary" onclick="transitTransfer('+t.id+')">转移</button> <button class="btn btn-sm btn-warning" onclick="transitShipOut('+t.id+')">发货</button> <button class="btn btn-sm btn-danger" onclick="transitStockOut('+t.id+')">出库</button> <button class="btn btn-sm btn-outline" onclick="transitDeleteProduct('+t.id+')">删除产品</button></td></tr>';});html+='</tbody></table>';container.innerHTML=html;}
function toggleTransitSelect(id){if(selectedTransitItems.has(id))selectedTransitItems.delete(id);else selectedTransitItems.add(id);renderTransitList();}
function clearAllTransit(){if(!db||!Array.isArray(db.transit)||db.transit.length===0){showToast('中转仓为空','info');return;}if(!confirm('确定清空中转仓所有记录？'))return;const nd=JSON.parse(JSON.stringify(db));nd.transit=[];saveDB(nd);closeModal();showToast('已清空中转仓','success');}
function batchClearSelectedTransit(){if(selectedTransitItems.size===0){showToast('请先勾选中转仓条目','error');return;}if(!confirm('确定清空选中的中转仓条目？'))return;const nd=JSON.parse(JSON.stringify(db));nd.transit=nd.transit.filter(t=>!selectedTransitItems.has(t.id));selectedTransitItems.clear();saveDB(nd);renderTransitList();showToast('已批量清空','success');}
function transitTransfer(transitId){const t=db.transit.find(x=>x.id===transitId);if(!t){showToast('记录不存在','error');return;}const emptyLocs=sortLocationsForDisplay(db.locations.filter(l=>l.status==='normal'));if(emptyLocs.length===0){showToast('没有空库位','error');return;}let opts=emptyLocs.map(l=>{const zone=db.zones.find(z=>z.id===l.zoneId);return '<option value="'+l.id+'">'+zone?.name+' '+getRowDisplayLabel(zone,l.rowNum)+'排'+getDisplayColNumber(zone,l.colNum)+'托</option>';}).join('');openModal('<h2>🔄 中转转移</h2><p>选择目标库位</p><div class="form-group"><select id="transitTargetLoc">'+opts+'</select></div><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="confirmTransitTransfer('+transitId+')">确认转移</button></div>');}
function confirmTransitTransfer(transitId){const targetId=parseInt(document.getElementById('transitTargetLoc').value);if(!targetId){showToast('请选择目标','error');return;}const t=db.transit.find(x=>x.id===transitId);const dst=db.locations.find(l=>l.id===targetId);if(!t||!dst||dst.status!=='normal'){showToast('状态异常','error');return;}const product=db.products.find(p=>p.id===t.productId);const zone=db.zones.find(z=>z.id===dst.zoneId);if(!product||!zone){showToast('数据错误','error');return;}const nd=JSON.parse(JSON.stringify(db));const ndst=nd.locations.find(l=>l.id===targetId);ndst.status='used';ndst.productId=t.productId;ndst.batchNo=t.batchNo;ndst.quantity=t.quantity;ndst.customPieces=t.customPieces;ndst.remark=t.remark;ndst.handAccount=t.handAccount;ndst.updatedAt=new Date().toISOString();ndst.transferFlag=t.transferFlag||false;nd.transit=nd.transit.filter(x=>x.id!==transitId);addRecord(nd,'中转转移',product,ndst,zone,t.quantity,t.customPieces,'中转仓转移至库位',null,null,ndst.id);saveDB(nd);closeModal();showToast('转移成功','success');}
function transitShipOut(transitId){const t=db.transit.find(x=>x.id===transitId);if(!t){showToast('记录不存在','error');return;}const product=db.products.find(p=>p.id===t.productId);if(!product){showToast('产品不存在','error');return;}if(!confirm('确认直接发货？'))return;const nd=JSON.parse(JSON.stringify(db));nd.transit=nd.transit.filter(x=>x.id!==transitId);const pseudoLoc={rowNum:0,colNum:0,batchNo:t.batchNo,quantity:t.quantity,customPieces:t.customPieces,remark:t.remark,handAccount:t.handAccount,transferFlag:t.transferFlag};addRecord(nd,'发货',product,pseudoLoc,{name:'中转仓'},t.quantity,t.customPieces,'中转仓发货',null,null,null);saveDB(nd);closeModal();showToast('发货成功','success');}
function transitStockOut(transitId){const t=db.transit.find(x=>x.id===transitId);if(!t){showToast('记录不存在','error');return;}const product=db.products.find(p=>p.id===t.productId);if(!product){showToast('产品不存在','error');return;}const isCustom=t.customPieces>0;const maxVal=isCustom?t.customPieces:t.quantity;openModal('<h2>📤 中转仓出库</h2><div class="form-group"><label>出库数量</label><input type="number" id="transitOutQty" min="0.01" max="'+maxVal+'" step="'+(isCustom?'1':'any')+'" value="'+maxVal+'"></div><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="confirmTransitStockOut('+transitId+')">确认出库</button></div>');}
function confirmTransitStockOut(transitId){const t=db.transit.find(x=>x.id===transitId);if(!t){showToast('记录不存在','error');return;}const val=parseFloat(document.getElementById('transitOutQty').value);if(!val||val<=0){showToast('无效','error');return;}const nd=JSON.parse(JSON.stringify(db));const nt=nd.transit.find(x=>x.id===transitId);if(t.customPieces>0){if(val>nt.customPieces){showToast('超出数量','error');return;}nt.customPieces-=val;if(nt.customPieces===0)nd.transit=nd.transit.filter(x=>x.id!==transitId);}else{if(val>nt.quantity){showToast('超出数量','error');return;}nt.quantity-=val;if(nt.quantity===0)nd.transit=nd.transit.filter(x=>x.id!==transitId);}const product=db.products.find(p=>p.id===t.productId);const pseudoLoc={rowNum:0,colNum:0,batchNo:t.batchNo,quantity:val,customPieces:t.customPieces>0?val:0,remark:t.remark,handAccount:t.handAccount,transferFlag:t.transferFlag};if(product)addRecord(nd,'出库',product,pseudoLoc,{name:'中转仓'},t.customPieces>0?0:val,t.customPieces>0?val:0,'中转仓出库',null,null,null);saveDB(nd);closeModal();showToast('出库成功','success');}
function transitDeleteProduct(transitId){const t=db.transit.find(x=>x.id===transitId);if(!t){showToast('记录不存在','error');return;}if(!confirm('确定删除该中转仓记录？'))return;const nd=JSON.parse(JSON.stringify(db));nd.transit=nd.transit.filter(x=>x.id!==transitId);selectedTransitItems.delete(transitId);saveDB(nd);renderTransitList();showToast('已删除','success');}

// ==================== 记录查询 ====================
function showRecords(){
    if(!db||!Array.isArray(db.records)||db.records.length===0){showToast('暂无记录','info');return;}
    let filtered=db.records.filter(r=>{
        if(recordFilter!=='all'&&r.type!==recordFilter)return false;
        const d=new Date(r.timestamp);
        const ds=d.toISOString().split('T')[0];
        if(recordStartDate&&ds<recordStartDate)return false;
        if(recordEndDate&&ds>recordEndDate)return false;
        if(recordProductFilter!=='all'&&r.productName!==recordProductFilter)return false;
        if(recordModelFilter!=='all'&&r.productModel!==recordModelFilter)return false;
        return true;
    }).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
    const productNames=[...new Set(db.products.map(p=>p.name||'未知产品'))];
    const productModels=[...new Set(db.products.map(p=>p.model||'无型号'))];
    let productOptions='<option value="all">全部产品</option>';
    productNames.forEach(n=>productOptions+='<option value="'+n+'"'+(recordProductFilter===n?' selected':'')+'>'+n+'</option>');
    let modelOptions='<option value="all">全部型号</option>';
    productModels.forEach(m=>modelOptions+='<option value="'+m+'"'+(recordModelFilter===m?' selected':'')+'>'+m+'</option>');
    let rows=filtered.map(r=>{
        const qs=r.customPieces>0?r.customPieces+'件':r.quantity+r.productUnit;
        const color=r.type==='入库'?'#34a853':(r.type==='发货'?'#f57c00':(r.type==='迁移'?'#9c27b0':(r.type==='加入中转仓'||r.type==='中转转移'?'#2196f3':'#ea4335')));
        const target=r.type==='迁移'?((r.targetZoneName||'')+' '+(r.targetLocationLabel||'')):'-';
        return '<tr><td><button class="btn btn-danger btn-sm" onclick="deleteRecord('+r.id+')">删除</button></td><td style="color:'+color+';font-weight:600">'+r.type+'</td><td>'+r.productName+'</td><td>'+r.productModel+'</td><td>'+qs+'</td><td>'+r.zoneName+'</td><td>'+r.locationLabel+'</td><td>'+r.batchNo+'</td><td>'+target+'</td><td>'+(r.remark||'-')+'</td><td>'+new Date(r.timestamp).toLocaleString()+'</td></tr>';
    }).join('');
    openModal('<h2>📋 出入库记录</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="form-group"><label>类型</label><select onchange="recordFilter=this.value;showRecords();"><option value="all"'+(recordFilter==='all'?' selected':'')+'>全部</option><option value="入库"'+(recordFilter==='入库'?' selected':'')+'>入库</option><option value="出库"'+(recordFilter==='出库'?' selected':'')+'>出库</option><option value="发货"'+(recordFilter==='发货'?' selected':'')+'>发货</option><option value="迁移"'+(recordFilter==='迁移'?' selected':'')+'>迁移</option><option value="加入中转仓"'+(recordFilter==='加入中转仓'?' selected':'')+'>加入中转仓</option><option value="中转转移"'+(recordFilter==='中转转移'?' selected':'')+'>中转转移</option></select></div><div class="form-group"><label>产品</label><select onchange="recordProductFilter=this.value;showRecords();">'+productOptions+'</select></div><div class="form-group"><label>型号</label><select onchange="recordModelFilter=this.value;showRecords();">'+modelOptions+'</select></div><div class="form-group"><label>开始日期</label><input type="date" value="'+recordStartDate+'" onchange="recordStartDate=this.value;showRecords();"></div><div class="form-group"><label>结束日期</label><input type="date" value="'+recordEndDate+'" onchange="recordEndDate=this.value;showRecords();"></div></div><p>共 '+filtered.length+' 条记录</p><table class="records-table"><thead><tr><th>操作</th><th>类型</th><th>产品</th><th>型号</th><th>数量</th><th>区域</th><th>仓位</th><th>批次</th><th>去向</th><th>备注</th><th>时间</th></tr></thead><tbody>'+rows+'</tbody></table><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>');
}
function deleteRecord(recordId){if(!db||!Array.isArray(db.records))return;if(!confirm('确定删除这条记录吗？'))return;const nd=JSON.parse(JSON.stringify(db));nd.records=nd.records.filter(r=>r.id!==recordId);saveDB(nd);showToast('记录已删除','success');showRecords();}

// ==================== 每日统计（改为统计占用库位数量） ====================
function updateDailyStatsIfNeeded(){if(!db)return;const today=new Date().toISOString().split('T')[0];if(!db.dailyStats)db.dailyStats=[];const items=getDailyStatsItemsByLocationCount();const last=db.dailyStats[db.dailyStats.length-1];if(last&&last.date===today){last.items=items;if(db.dailyStats.length>14)db.dailyStats=db.dailyStats.slice(-14);saveDB(db);return;}db.dailyStats.push({date:today,items:items});if(db.dailyStats.length>14)db.dailyStats=db.dailyStats.slice(-14);saveDB(db);}
function getDailyStatsItemsByLocationCount(){
    const productCountMap = new Map();
    db.products.forEach(p => {
        const count = db.locations.filter(l => l.productId === p.id && l.status === 'used').length;
        if (!productCountMap.has(p.name)) {
            productCountMap.set(p.name, { specs: new Set(), count: 0, unit: p.unit });
        }
        const entry = productCountMap.get(p.name);
        entry.specs.add(p.model || '无型号');
        entry.count += count;
    });
    const items = [];
    productCountMap.forEach((data, name) => {
        items.push({ name, specs: [...data.specs].join('、'), count: data.count, unit: data.unit });
    });
    return items;
}
function showDailyStats(){if(!db||!Array.isArray(db.dailyStats)||db.dailyStats.length===0){showToast('暂无每日统计','info');return;}const dates=db.dailyStats.map(d=>d.date);let options='';dates.forEach(d=>{options+='<option value="'+d+'">'+d+'</option>';});let compareOptions=options;openModal('<h2>📅 每日统计（占用库位数量）</h2>'+
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><label>单日查看：</label><select id="dailyDateSelect" onchange="showDailyStatsContent(this.value)">'+options+'</select></div>'+
    '<div id="dailyStatsContent"></div>'+
    '<hr style="margin:16px 0">'+
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><label>对比起始：</label><select id="compareStartDate">'+compareOptions+'</select><label>对比结束：</label><select id="compareEndDate">'+compareOptions+'</select><button class="btn btn-sm btn-primary" onclick="compareDailyStats()">对比</button></div>'+
    '<div id="compareResult"></div>'+
    '<div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>');
    showDailyStatsContent(dates[dates.length-1]);
    if(dates.length>=2){document.getElementById('compareStartDate').value=dates[dates.length-2];document.getElementById('compareEndDate').value=dates[dates.length-1];}else{document.getElementById('compareStartDate').value=dates[0];document.getElementById('compareEndDate').value=dates[0];}
}
function showDailyStatsContent(dateStr){if(!db||!Array.isArray(db.dailyStats))return;const day=db.dailyStats.find(d=>d.date===dateStr);if(!day){document.getElementById('dailyStatsContent').innerHTML='<p>无数据</p>';return;}let rows=day.items.map(item=>'<tr><td>'+item.name+'</td><td>'+item.specs+'</td><td>'+item.count+'</td><td>'+item.unit+'</td></tr>').join('');document.getElementById('dailyStatsContent').innerHTML='<table class="daily-table"><thead><tr><th>名称</th><th>规格</th><th>占用库位</th><th>单位</th></tr></thead><tbody>'+rows+'</tbody></table>';}
function compareDailyStats(){const startDate=document.getElementById('compareStartDate').value;const endDate=document.getElementById('compareEndDate').value;if(!startDate||!endDate){return;}if(startDate===endDate){showToast('请选择不同日期','error');return;}const startDay=db.dailyStats.find(d=>d.date===startDate);const endDay=db.dailyStats.find(d=>d.date===endDate);if(!startDay||!endDay){showToast('日期数据不存在','error');return;}const startMap=new Map();startDay.items.forEach(item=>{startMap.set(item.name,item.count);});const endMap=new Map();endDay.items.forEach(item=>{endMap.set(item.name,item.count);});const allNames=new Set([...startMap.keys(),...endMap.keys()]);let rows='';allNames.forEach(name=>{const sCount=startMap.get(name)||0;const eCount=endMap.get(name)||0;const diff=eCount-sCount;const color=diff>0?'#34a853':(diff<0?'#ea4335':'#333');const itemInfo=endDay.items.find(i=>i.name===name)||startDay.items.find(i=>i.name===name);const unit=itemInfo?itemInfo.unit:'';const specs=itemInfo?itemInfo.specs:'';rows+='<tr><td>'+name+'</td><td>'+specs+'</td><td>'+sCount+'</td><td>'+eCount+'</td><td style="color:'+color+';font-weight:600">'+(diff>0?'+'+diff:diff)+'</td><td>'+unit+'</td></tr>';});document.getElementById('compareResult').innerHTML='<table class="daily-table"><thead><tr><th>名称</th><th>规格</th><th>起始库位</th><th>结束库位</th><th>变化</th><th>单位</th></tr></thead><tbody>'+rows+'</tbody></table>';}

// ==================== 库存统计 ====================
function renderStatsModal(){if(!db||!Array.isArray(db.products)||db.products.length===0){showToast('暂无产品','info');return;}let table='';if(statsGroupBy==='name'){const m=new Map();db.products.forEach(p=>{if(!m.has(p.name))m.set(p.name,{pieces:0,units:new Set(),models:new Set()});const e=m.get(p.name);const info=getProductDisplayInfo(p.id);e.pieces+=info.pieces;e.units.add(p.unit);e.models.add(p.model||'无型号');});let rows=[...m.entries()].map(([n,d])=>{const specs=[...d.models].join('、');const unitStr=d.units.size===1?[...d.units][0]:'多单位';return '<tr><td>'+n+'</td><td>'+specs+'</td><td>'+d.pieces+'</td><td>'+unitStr+'</td></tr>';}).join('');table='<table class="stats-table"><thead><tr><th>名称</th><th>规格</th><th>总件数</th><th>单位</th></tr></thead><tbody>'+rows+'</tbody></table>';}else{const m=new Map();db.products.forEach(p=>{const key=p.model||'无型号';if(!m.has(key))m.set(key,{pieces:0,units:new Set(),names:new Set(),pn:[]});const e=m.get(key);const info=getProductDisplayInfo(p.id);e.pieces+=info.pieces;e.units.add(p.unit);e.names.add(p.name);e.pn.push(p.name);});let rows=[...m.entries()].map(([mod,d])=>{const unitStr=d.units.size===1?[...d.units][0]:'多单位';return '<tr><td>'+d.pn.join('、')+'</td><td>'+mod+'</td><td>'+d.names.size+'</td><td>'+d.pieces+'</td><td>'+unitStr+'</td></tr>';}).join('');table='<table class="stats-table"><thead><tr><th>产品名称</th><th>型号</th><th>产品数</th><th>总件数</th><th>单位</th></tr></thead><tbody>'+rows+'</tbody></table>';}openModal('<h2>📈 库存统计</h2><div class="form-group"><label>分组方式</label><select onchange="statsGroupBy=this.value;renderStatsModal();"><option value="name"'+(statsGroupBy==='name'?' selected':'')+'>按名称</option><option value="model"'+(statsGroupBy==='model'?' selected':'')+'>按型号</option></select></div>'+table+'<div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>');}

// ==================== FIFO排序 ====================
function getFifoRankMap(zoneId){if(!db||!Array.isArray(db.locations))return{};const used=db.locations.filter(l=>l.zoneId===zoneId&&l.status==='used'&&l.batchNo);const pg={};used.forEach(loc=>{const pid=loc.productId;if(!pid)return;if(!pg[pid])pg[pid]=[];pg[pid].push(loc);});const rm={};Object.keys(pg).forEach(pid=>{const locs=pg[pid];locs.sort((a,b)=>a.batchNo.localeCompare(b.batchNo));locs.forEach((loc,i)=>{rm[loc.id]={rank:i,total:locs.length,productId:pid,isPriority:!!(db.products.find(p=>p.id===pid)?.isPriority)};});});return rm;}
function getFifoColor(rank,total){if(total<=1)return'#1e88e5';const l=80-(rank/(total-1))*50;return'hsl(210,80%,'+l+'%)';}
function getFifoBorderColor(rank,total){if(total<=1)return'#0d47a1';const l=60-(rank/(total-1))*25;return'hsl(210,90%,'+l+'%)';}
function renderFifoOrderModal(){
    if(!db||!Array.isArray(db.locations)||!Array.isArray(db.products)){showToast('数据未加载','info');return;}
    const used=db.locations.filter(l=>l.status==='used'&&l.batchNo);
    if(used.length===0){showToast('无已用仓位','info');return;}
    let productOptions = '<option value="all">全部产品</option>';
    db.products.forEach(p=>{
        productOptions += `<option value="${p.id}">${p.name||'未知产品'}${p.isPriority?'【先】':''}(${p.model||'无型号'})</option>`;
    });
    openModal('<h2>⏱️ FIFO排序（全局）</h2>'+
        '<div class="form-group"><label>分组方式</label><select id="fifoGroupSelect" onchange="fifoGroupBy=this.value;updateFifoContent()"><option value="name"'+(fifoGroupBy==='name'?' selected':'')+'>按名称</option><option value="model"'+(fifoGroupBy==='model'?' selected':'')+'>按型号</option></select></div>'+
        '<div class="form-group"><label>筛选产品（可多选）</label><select id="fifoProductFilter" multiple size="4" onchange="updateFifoContent()">'+productOptions+'</select></div>'+
        '<div id="fifoContent"></div>'+
        '<div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>');
    if(selectedProductFilters.size>0){
        const select=document.getElementById('fifoProductFilter');
        Array.from(select.options).forEach(opt=>{
            if(opt.value!=='all' && selectedProductFilters.has(parseInt(opt.value))) opt.selected=true;
            else opt.selected=false;
        });
    }else{
        document.getElementById('fifoProductFilter').value='all';
    }
    updateFifoContent();
}
function updateFifoContent(){
    const container=document.getElementById('fifoContent');
    if(!container)return;
    const select=document.getElementById('fifoProductFilter');
    if(!select)return;
    selectedProductFilters.clear();
    for(let i=0;i<select.options.length;i++){
        if(select.options[i].selected && select.options[i].value!=='all'){
            selectedProductFilters.add(parseInt(select.options[i].value));
        }
    }
    if(!db||!Array.isArray(db.locations)||!Array.isArray(db.products))return;
    const used=db.locations.filter(l=>l.status==='used'&&l.batchNo);
    if(used.length===0){container.innerHTML='<p>无已用仓位</p>';return;}
    const grouped={};
    used.forEach(loc=>{
        const p=db.products.find(x=>x.id===loc.productId);
        if(!p)return;
        if(selectedProductFilters.size>0 && !selectedProductFilters.has(p.id))return;
        const key=fifoGroupBy==='name'?p.name:(p.model||'无型号');
        if(!grouped[key])grouped[key]=[];
        grouped[key].push({loc,p});
    });
    if(Object.keys(grouped).length===0){container.innerHTML='<p>无匹配产品</p>';return;}
    const orderMap=new Map();
    db.products.forEach((p,index)=>{const key=fifoGroupBy==='name'?p.name:(p.model||'无型号');if(!orderMap.has(key))orderMap.set(key,index);});
    const sortedKeys=Object.keys(grouped).sort((a,b)=>{const ia=orderMap.has(a)?orderMap.get(a):Number.MAX_SAFE_INTEGER;const ib=orderMap.has(b)?orderMap.get(b):Number.MAX_SAFE_INTEGER;return ia-ib;});
    let content='';
    sortedKeys.forEach(key=>{
        const items=grouped[key];
        // 先发产品排在最前，其余按批次升序
        items.sort((a,b)=>{
            if(a.p.isPriority && !b.p.isPriority) return -1;
            if(!a.p.isPriority && b.p.isPriority) return 1;
            return a.loc.batchNo.localeCompare(b.loc.batchNo);
        });
        const pn=items[0].p.name,pm=items[0].p.model||'无型号';
        const title=fifoGroupBy==='name'?pn+' ('+pm+')':pm+' ('+pn+')';
        let rows=items.map((it,i)=>{
            const loc=it.loc,p=it.p;
            const zone=db.zones.find(z=>z.id===loc.zoneId);
            const rl=getRowDisplayLabel(zone,loc.rowNum),dc=getDisplayColNumber(zone,loc.colNum);
            let qs;
            if(loc.customPieces>0)qs=loc.customPieces+'件';
            else{const pc=loc.quantity*(p.unitQuantity||1);qs=loc.quantity+p.unit+' ('+pc.toFixed(2)+'件)';}
            const handBtn=loc.handAccount?'取消标记':'标记';
            const handBtnClass=loc.handAccount?'btn-outline':'btn-primary';
            const priorityTag=p.isPriority?'【先】':'';
            return '<tr><td>'+(i+1)+'</td><td>'+priorityTag+' '+loc.batchNo+'</td><td>'+zone?.name+' '+rl+'排'+dc+'托</td><td>'+qs+'</td><td><button class="btn btn-sm '+handBtnClass+'" onclick="toggleHandAccountInline('+loc.id+')">'+handBtn+'</button></td></tr>';
        }).join('');
        content+='<div style="margin-bottom:16px"><h3>📦 '+title+'</h3><table class="fifo-table"><thead><tr><th>优先级</th><th>批次</th><th>仓位</th><th>数量</th><th>手帐标记</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    });
    container.innerHTML=content;
}

let draggedZoneId = null;
function initZoneDragEvents(){
    const items = document.querySelectorAll('.zone-sort-item');
    items.forEach(item=>{
        item.addEventListener('dragstart', onZoneDragStart);
        item.addEventListener('dragover', onZoneDragOver);
        item.addEventListener('drop', onZoneDrop);
        item.addEventListener('dragend', onZoneDragEnd);
    });
}
function onZoneDragStart(e){
    draggedZoneId = e.target.dataset.zoneId;
    e.target.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', draggedZoneId);
}
function onZoneDragOver(e){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const target = e.target.closest('.zone-sort-item');
    if(!target) return;
    const container = document.getElementById('zoneSortList');
    const items = [...container.querySelectorAll('.zone-sort-item:not(.dragging)')];
    const afterElement = items.find(item => {
        const rect = item.getBoundingClientRect();
        return e.clientY < rect.top + rect.height / 2;
    });
    if(afterElement == null){
        container.appendChild(document.querySelector('.dragging'));
    }else{
        container.insertBefore(document.querySelector('.dragging'), afterElement);
    }
}
function onZoneDrop(e){
    e.preventDefault();
    const target = e.target.closest('.zone-sort-item');
    if(!target) return;
    const container = document.getElementById('zoneSortList');
    const dragging = document.querySelector('.dragging');
    if(dragging && target !== dragging){
        const items = [...container.querySelectorAll('.zone-sort-item:not(.dragging)')];
        const afterElement = items.find(item => {
            const rect = item.getBoundingClientRect();
            return e.clientY < rect.top + rect.height / 2;
        });
        if(afterElement == null){
            container.appendChild(dragging);
        }else{
            container.insertBefore(dragging, afterElement);
        }
    }
}
function onZoneDragEnd(e){
    e.target.classList.remove('dragging');
    draggedZoneId = null;
}
