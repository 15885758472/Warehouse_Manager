function executeSmartSort() {
    let targetZoneIds, auxZoneIds;
    const targetCards = document.querySelectorAll('.smart-select-card[data-type="target"]');
    if (targetCards.length > 0 && targetCards[0].offsetParent !== null) {
        targetZoneIds = [...document.querySelectorAll('.smart-select-card[data-type="target"].active')].map(card => parseInt(card.dataset.value));
        auxZoneIds = [...document.querySelectorAll('.smart-select-card[data-type="aux"].active')].map(card => parseInt(card.dataset.value));
    } else {
        const targetMulti = document.querySelector('.smart-sort-target-multi');
        const auxMulti = document.querySelector('.smart-sort-aux-multi');
        targetZoneIds = [...targetMulti.selectedOptions].map(o => parseInt(o.value));
        auxZoneIds = [...auxMulti.selectedOptions].map(o => parseInt(o.value));
    }

    if (targetZoneIds.length === 0) { showToast('请至少选择一个目标区域', 'error'); return; }

    const auxEmptyLocs = db.locations.filter(l => auxZoneIds.includes(l.zoneId) && l.status === 'normal');
    let allAssignments = [];
    let allMoves = [];

    targetZoneIds.forEach(targetZoneId => {
        const targetZone = db.zones.find(z => z.id === targetZoneId);
        if (!targetZone) return;

        const allLocs = db.locations
            .filter(l => l.zoneId === targetZoneId)
            .sort((a, b) => {
                if (a.rowNum !== b.rowNum) return a.rowNum - b.rowNum;
                return getDisplayColNumber(targetZone, a.colNum) - getDisplayColNumber(targetZone, b.colNum);
            });

        const usedLocs = allLocs.filter(l => l.status === 'used');
        if (usedLocs.length === 0) return;

        // 产品分组
        const productGroups = {};
        usedLocs.forEach(loc => {
            if (!productGroups[loc.productId]) productGroups[loc.productId] = [];
            productGroups[loc.productId].push(loc);
        });

        // 产品按数量降序
        const productEntries = Object.keys(productGroups).map(pid => ({
            productId: parseInt(pid),
            locs: productGroups[pid].sort((a, b) => a.batchNo.localeCompare(b.batchNo)),
            count: productGroups[pid].length
        }));
        productEntries.sort((a, b) => b.count - a.count);

        const finalAssignments = [];
        const occupied = new Set();

        // 优先保留原有排中占多数的产品
        const rows = [...new Set(allLocs.map(l => l.rowNum))].sort((a, b) => a - b);
        rows.forEach(row => {
            const rowLocs = allLocs.filter(l => l.rowNum === row);
            const rowUsed = rowLocs.filter(l => l.status === 'used');
            if (rowUsed.length === 0) return;
            const rowProductCount = {};
            rowUsed.forEach(loc => {
                rowProductCount[loc.productId] = (rowProductCount[loc.productId] || 0) + 1;
            });
            const totalUsed = rowUsed.length;
            for (const pid in rowProductCount) {
                const ratio = rowProductCount[pid] / totalUsed;
                const product = productEntries.find(p => p.productId === parseInt(pid));
                if (ratio >= 0.6 && product && product.count <= rowLocs.length) {
                    const productLocs = product.locs;
                    const availableSlots = rowLocs.filter(l => !occupied.has(l.id));
                    for (let i = 0; i < productLocs.length && i < availableSlots.length; i++) {
                        finalAssignments.push({
                            toLocId: availableSlots[i].id,
                            productId: product.productId,
                            batchNo: productLocs[i].batchNo,
                            sourceLocId: productLocs[i].id
                        });
                        occupied.add(availableSlots[i].id);
                    }
                    product.locs = product.locs.slice(productLocs.length);
                }
            }
        });

        // 处理剩余产品，填充空余排
        for (const entry of productEntries) {
            if (entry.locs.length === 0) continue;
            for (const loc of entry.locs) {
                const rowFree = {};
                allLocs.forEach(l => {
                    if (!occupied.has(l.id)) {
                        rowFree[l.rowNum] = (rowFree[l.rowNum] || 0) + 1;
                    }
                });
                let bestRow = null, maxFree = -1;
                for (const row in rowFree) {
                    if (rowFree[row] > maxFree) {
                        maxFree = rowFree[row];
                        bestRow = parseInt(row);
                    }
                }
                if (bestRow === null) break;
                const targetLoc = allLocs.find(l => l.rowNum === bestRow && !occupied.has(l.id));
                if (targetLoc) {
                    finalAssignments.push({
                        toLocId: targetLoc.id,
                        productId: entry.productId,
                        batchNo: loc.batchNo,
                        sourceLocId: loc.id
                    });
                    occupied.add(targetLoc.id);
                }
            }
        }

        // 防御：未分配的产品放入剩余空位
        const assignedSourceIds = new Set(finalAssignments.map(a => a.sourceLocId));
        usedLocs.forEach(loc => {
            if (!assignedSourceIds.has(loc.id)) {
                const anyLoc = allLocs.find(l => !occupied.has(l.id));
                if (anyLoc) {
                    finalAssignments.push({
                        toLocId: anyLoc.id,
                        productId: loc.productId,
                        batchNo: loc.batchNo,
                        sourceLocId: loc.id
                    });
                    occupied.add(anyLoc.id);
                }
            }
        });

        // 生成移动步骤
        const currentState = new Map();
        allLocs.forEach(loc => {
            currentState.set(loc.id, loc.status === 'used' ? { productId: loc.productId, batchNo: loc.batchNo } : null);
        });
        const finalState = new Map();
        finalAssignments.forEach(assign => {
            finalState.set(assign.toLocId, { productId: assign.productId, batchNo: assign.batchNo });
        });
        allLocs.forEach(loc => {
            if (!finalState.has(loc.id)) finalState.set(loc.id, null);
        });

        const tempMoves = [];
        for (const loc of allLocs) {
            const cur = currentState.get(loc.id);
            const fin = finalState.get(loc.id);
            if (cur && (!fin || cur.productId !== fin.productId || cur.batchNo !== fin.batchNo)) {
                if (auxEmptyLocs.length > 0) {
                    const tempLoc = auxEmptyLocs.shift();
                    tempMoves.push({ type: '移到辅助区', from: loc, to: tempLoc, productId: cur.productId, reason: '腾出目标位置' });
                } else {
                    tempMoves.push({ type: '错误', message: '辅助区域空位不足' });
                }
            }
        }
        for (const assign of finalAssignments) {
            const targetLoc = allLocs.find(l => l.id === assign.toLocId);
            const cur = currentState.get(assign.toLocId);
            if (!cur || cur.productId !== assign.productId || cur.batchNo !== assign.batchNo) {
                tempMoves.push({ type: '移动产品', from: db.locations.find(l => l.id === assign.sourceLocId), to: targetLoc, productId: assign.productId, reason: '按布局优化移动' });
            }
        }

        allAssignments = allAssignments.concat(finalAssignments);
        allMoves = allMoves.concat(tempMoves);
    });

    showSmartSortResult(allAssignments, allMoves);
}

function showSmartSortResult(assignments, moves) {
    const targetZoneIds = [...new Set(assignments.map(a => {
        const loc = db.locations.find(l => l.id === a.toLocId);
        return loc ? loc.zoneId : null;
    }).filter(Boolean))];

    let html = `<h2>排序结果（最终状态）</h2>`;
    html += `<div id="smartSortResultContent">`;

    targetZoneIds.forEach(zoneId => {
        const zone = db.zones.find(z => z.id === zoneId);
        if (!zone) return;
        html += `<h3>${zone.name}</h3>`;
        html += `<div class="grid-container" style="overflow:auto;">`;
        const rows = [...new Set(db.locations.filter(l => l.zoneId === zoneId).map(l => l.rowNum))].sort((a, b) => a - b);
        html += `<div class="grid-table">`;
        rows.forEach(row => {
            const rowCols = zone.rowDetails ? (zone.rowDetails[row-1] || zone.cols) : zone.cols;
            const cols = getDisplayColArray({ ...zone, cols: rowCols }, row);
            html += `<div class="grid-row">`;
            html += `<div class="grid-row-label">${getRowDisplayLabel(zone, row)}</div>`;
            cols.forEach((col, idx) => {
                const loc = db.locations.find(l => l.zoneId === zoneId && l.rowNum === row && l.colNum === col);
                if (loc) {
                    const assign = assignments.find(a => a.toLocId === loc.id);
                    const product = assign ? db.products.find(p => p.id === assign.productId) : null;
                    let style = 'background:#fff;border-color:#ddd;';
                    let label = '空';
                    if (assign && product) {
                        style = 'background:#a5d6a7;border-color:#4caf50;';
                        label = `${product.name || '未知'} (${assign.batchNo})`;
                    }
                    html += `<div class="cell" style="${style}">${label}</div>`;
                } else {
                    html += `<div class="cell" style="border-style:dashed;opacity:.3;">-</div>`;
                }
            });
            html += `</div>`;
        });
        html += `</div></div>`;
    });

    html += `<h3>移动步骤（共${moves.length}步）</h3>`;
    html += `<table class="records-table"><thead><tr><th>步骤</th><th>操作</th><th>从</th><th>到</th><th>产品</th><th>原因</th></tr></thead><tbody>`;
    moves.forEach((move, idx) => {
        const fromLabel = move.from ? (db.zones.find(z => z.id === move.from.zoneId)?.name + ' ' + getRowDisplayLabel(db.zones.find(z => z.id === move.from.zoneId), move.from.rowNum) + '排' + getDisplayColNumber(db.zones.find(z => z.id === move.from.zoneId), move.from.colNum) + '托') : '-';
        const toLabel = move.to ? (db.zones.find(z => z.id === move.to.zoneId)?.name + ' ' + getRowDisplayLabel(db.zones.find(z => z.id === move.to.zoneId), move.to.rowNum) + '排' + getDisplayColNumber(db.zones.find(z => z.id === move.to.zoneId), move.to.colNum) + '托') : '-';
        const prod = move.productId ? (db.products.find(p => p.id === move.productId)?.name || '未知产品') : '-';
        html += `<tr><td>${idx+1}</td><td>${move.type}</td><td>${fromLabel}</td><td>${toLabel}</td><td>${prod}</td><td>${move.reason || ''}</td></tr>`;
    });
    html += `</tbody></table>`;
    html += `</div>`;
    html += `<div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button><button class="btn btn-primary" onclick="exportSmartSortImage()">输出图片</button></div>`;
    openModal(html);
}

function exportSmartSortImage() {
    const content = document.getElementById('smartSortResultContent');
    if (!content) { showToast('没有内容可输出', 'error'); return; }
    html2canvas(content, {
        scale: 2,
        width: content.scrollWidth,
        height: content.scrollHeight,
        windowWidth: content.scrollWidth,
        windowHeight: content.scrollHeight,
        useCORS: true
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = '智能排序结果_' + new Date().toISOString().slice(0, 10) + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('图片已生成', 'success');
    }).catch(err => {
        console.error(err);
        showToast('图片生成失败', 'error');
    });
}

    document.getElementById('btnShowDailyStats').addEventListener('click',showDailyStats);
    document.getElementById('btnShowTransit').addEventListener('click',renderTransitModal);

    document.getElementById('btnExportProducts').addEventListener('click',exportProductsData);
    document.getElementById('btnImportProducts').addEventListener('click',()=>{
        const i=document.createElement('input');i.type='file';
        i.onchange=e=>{if(e.target.files[0])importProductsData(e.target.files[0]);};

        const i=document.createElement('input');i.type='file';

    document.getElementById('btnToggleLocationBatch').addEventListener('click',toggleLocationBatchMode);
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
    initFromFirebase();
}
init();
