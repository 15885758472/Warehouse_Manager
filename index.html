<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仓库管理系统 · 完整版</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root{--bg:#f0f2f5;--card-bg:#fff;--primary:#1a73e8;--success:#34a853;--danger:#ea4335;--warning:#fbbc04;--text:#202124;--text-secondary:#5f6368;--border:#dadce0;--shadow:0 1px 3px rgba(0,0,0,.1);--radius:12px;--radius-sm:8px;--cell-size:56px;--cell-gap:4px;--row-label-width:44px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
        .header{background:var(--card-bg);border-bottom:1px solid var(--border);padding:0 12px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);gap:8px}
        .header-left{display:flex;align-items:center;gap:8px;min-width:0}
        .logo-icon{width:30px;height:30px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;flex-shrink:0}
        .header h1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .header-stats{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
        .header-stats::-webkit-scrollbar{display:none}
        .stat-chip{display:flex;align-items:center;gap:3px;font-size:9px;color:var(--text-secondary);background:#f8f9fa;padding:2px 6px;border-radius:10px;border:1px solid var(--border);white-space:nowrap}
        .sync-badge{font-size:9px;padding:2px 6px;border-radius:10px;background:#fff8e1;color:#f57c00;white-space:nowrap}
        .sync-badge.online{background:#e8f5e9;color:#2e7d32}
        .sync-badge.offline{background:#ffebee;color:#c62828}
        .main-container{display:flex;flex-direction:column;height:calc(100vh - 52px);overflow:hidden}
        .left-panel{background:var(--card-bg);border-bottom:1px solid var(--border);padding:6px 8px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
        .left-panel::-webkit-scrollbar{display:none}
        .left-panel-top{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
        .panel-title{font-size:11px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
        .zone-list{display:flex;flex-direction:row;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
        .zone-list::-webkit-scrollbar{display:none}
        .zone-item{padding:6px 12px;border-radius:16px;border:2px solid var(--border);cursor:pointer;background:#fafafa;white-space:nowrap;font-size:12px;display:flex;align-items:center;gap:4px;flex-shrink:0;min-width:fit-content}
        .zone-item.active{border-color:var(--primary);background:#e8f0fe;font-weight:600}
        .zone-delete-btn{width:18px;height:18px;border-radius:50%;border:none;background:#f1f3f4;cursor:pointer;display:inline-flex!important;align-items:center;justify-content:center;font-size:10px;color:var(--danger);margin-left:2px;flex-shrink:0}
        .zone-edit-btn{width:18px;height:18px;border-radius:50%;border:none;background:#e3f2fd;cursor:pointer;display:inline-flex!important;align-items:center;justify-content:center;font-size:10px;color:var(--primary);margin-left:2px;flex-shrink:0}
        .add-zone-btn{padding:6px 12px;border:2px dashed var(--border);border-radius:16px;background:transparent;cursor:pointer;font-size:12px;white-space:nowrap;flex-shrink:0}
        .center-panel{flex:1;overflow-y:auto;background:var(--bg);padding:8px 10px;-webkit-overflow-scrolling:touch}
        .center-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:6px}
        .center-header h2{font-size:16px;font-weight:600}
        .legend{display:flex;gap:6px;flex-wrap:wrap;font-size:9px}
        .grid-container{background:var(--card-bg);border-radius:var(--radius);padding:6px;box-shadow:var(--shadow);overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%}
        .grid-side-by-side{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;width:100%}
        .grid-table{display:flex;flex-direction:column;gap:3px;flex-shrink:0;min-width:max-content}
        .grid-row{display:flex;align-items:center;gap:var(--cell-gap)}
        .grid-row-label{width:var(--row-label-width);font-size:9px;font-weight:600;color:var(--text-secondary);text-align:right}
        .cell{width:var(--cell-size);height:48px;border-radius:4px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;text-align:center;position:relative;flex-shrink:0;user-select:none;overflow:hidden;touch-action:manipulation}
        .cell:active{transform:scale(0.96)}
        .cell.status-normal{background:#e8f5e9;border-color:#4caf50;color:#2e7d32}
        .cell.status-unavailable{background:#ffebee;border-color:#ef5350;color:#c62828;opacity:.8}
        .cell.status-used{color:#fff;border-color:#333}
        .cell .cell-label{font-weight:600;font-size:8px;line-height:1.1;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .cell .cell-batch{font-size:6px;position:absolute;bottom:1px;left:1px;right:1px;white-space:nowrap;overflow:hidden;text-overflow:clip;color:inherit}
        .cell .cell-qty{font-size:7px;font-weight:700;position:absolute;top:1px;right:2px;background:rgba(255,255,255,.85);border-radius:2px;padding:0 2px;color:#000}
        .cell .fifo-rank{position:absolute;top:1px;left:2px;background:rgba(0,0,0,.5);color:#fff;font-size:6px;padding:0 2px;border-radius:2px}
        .cell .new-badge{position:absolute;left:2px;top:50%;transform:translateY(-50%);background:var(--success);color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .yesterday-badge{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:#ff9800;color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .hand-badge{position:absolute;bottom:1px;left:2px;background:#ff9800;color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .transfer-badge{position:absolute;right:2px;bottom:2px;background:#9c27b0;color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .priority-flag-badge{position:absolute;left:2px;top:2px;background:#d32f2f;color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .priority-badge{position:absolute;left:2px;top:50%;transform:translateY(-50%);background:#ff5722;color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .remark-badge{position:absolute;right:2px;top:2px;background:#607d8b;color:#fff;font-size:6px;padding:0 2px;border-radius:2px;z-index:3}
        .cell .select-checkbox{position:absolute;top:2px;left:2px;z-index:2;width:12px;height:12px}
        .right-panel{background:var(--card-bg);border-top:1px solid var(--border);padding:8px;flex-shrink:0;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
        .right-panel::-webkit-scrollbar{display:none}
        .right-section{background:#f8f9fa;border-radius:var(--radius-sm);padding:8px;border:1px solid var(--border);min-width:160px;max-width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
        .right-section h3{font-size:10px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
        .product-list{display:flex;flex-direction:column;gap:3px;max-height:100px;overflow-y:auto}
        .product-item{padding:4px 6px;background:#fff;border-radius:3px;border:1px solid var(--border);font-size:10px;display:flex;gap:3px;align-items:center;cursor:pointer;white-space:nowrap}
        .product-item.selected{background:#e8f0fe;border-color:var(--primary)}
        .batch-toolbar{display:none;gap:3px;margin-top:3px;flex-wrap:wrap}
        .batch-toolbar.active{display:flex}
        .location-batch-toolbar{display:none;gap:3px;margin-top:3px;flex-wrap:wrap}
        .location-batch-toolbar.active{display:flex}
        .btn{padding:6px 10px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;touch-action:manipulation}
        .btn:active{transform:scale(0.95)}
        .btn-primary{background:var(--primary);color:#fff}
        .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
        .btn-danger{background:var(--danger);color:#fff}
        .btn-success{background:var(--success);color:#fff}
        .btn-warning{background:var(--warning);color:#333}
        .btn-info{background:#2196f3;color:#fff}
        .btn-sm{padding:3px 6px;font-size:9px;border-radius:3px}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px}
        .modal{background:#fff;border-radius:var(--radius);padding:16px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
        .modal h2{font-size:16px;margin-bottom:12px}
        .form-group{margin-bottom:10px}
        .form-group label{display:block;font-size:11px;font-weight:500;margin-bottom:3px;color:var(--text-secondary)}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 8px;border:1.5px solid var(--border);border-radius:5px;font-size:13px}
        .toast-container{position:fixed;top:52px;right:8px;z-index:2000;display:flex;flex-direction:column;gap:5px;max-width:250px}
        .toast{padding:8px 12px;border-radius:6px;color:#fff;font-size:11px;cursor:pointer;box-shadow:var(--shadow)}
        .toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--primary)}
        .fifo-table,.stats-table,.records-table,.daily-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:11px}
        .fifo-table th,.fifo-table td,.stats-table th,.stats-table td,.records-table th,.records-table td,.daily-table th,.daily-table td{padding:5px 3px;text-align:left;border-bottom:1px solid var(--border)}
        .zone-sort-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
        .zone-sort-item{padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius-sm);background:#fafafa;cursor:move;display:flex;align-items:center;gap:8px;font-size:14px}
        .zone-sort-item.dragging{opacity:.5;border-color:var(--primary)}
        .smart-select-cards{display:flex;flex-wrap:wrap;gap:8px;}
        .smart-select-card{border:2px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;background:#fff;transition:all .2s;user-select:none;}
        .smart-select-card.active{border-color:var(--primary);background:#e8f0fe;box-shadow:0 0 0 2px rgba(26,115,232,.2);}
        @media(min-width:768px){
            .smart-select-cards{display:flex;}
            .smart-sort-target-multi,.smart-sort-aux-multi{display:none!important;}
        }
        @media(max-width:767px){
            .smart-select-cards{display:none;}
            .smart-sort-target-multi,.smart-sort-aux-multi{display:block!important;}
        }
        @media(min-width:768px){
            .main-container{flex-direction:row}
            .left-panel{width:230px;height:auto;flex-direction:column;border-right:1px solid var(--border);border-bottom:none;overflow-y:auto;overflow-x:hidden;padding:12px;gap:8px}
            .zone-list{flex-direction:column;overflow-x:visible;overflow-y:auto}
            .zone-item{white-space:normal;border-radius:var(--radius-sm)}
            .center-panel{padding:16px 20px}
            .cell{width:60px;height:52px;font-size:9px}
            .cell .cell-label{font-size:8px}
            .grid-row-label{font-size:10px;width:50px}
            .right-panel{width:280px;flex-direction:column;border-left:1px solid var(--border);border-top:none;overflow-y:auto;overflow-x:hidden;padding:12px;gap:8px}
            .right-section{min-width:auto;max-width:none}
            .header h1{font-size:16px}
            .stat-chip{font-size:11px}
            .btn{font-size:12px}
            .btn-sm{font-size:10px}
        }
        @media(min-width:1200px){
            :root{--cell-size:72px;--cell-gap:6px;--row-label-width:56px}
            .cell{width:var(--cell-size);height:60px;font-size:10px}
            .cell .cell-label{font-size:9px}
            .cell .cell-batch{font-size:7px;bottom:2px}
            .cell .cell-qty{font-size:8px;top:2px;right:3px}
            .cell .fifo-rank{font-size:7px;top:2px;left:3px}
            .cell .new-badge,.cell .yesterday-badge,.cell .hand-badge,.cell .transfer-badge,.cell .priority-flag-badge,.cell .priority-badge,.cell .remark-badge{font-size:7px;padding:0 3px}
            .grid-row-label{width:var(--row-label-width);font-size:11px}
            .center-header h2{font-size:20px}
            .right-panel{width:320px}
            .right-section{min-width:200px}
            .product-item{font-size:12px}
            .btn{font-size:13px}
            .btn-sm{font-size:11px}
            .fifo-table th,.fifo-table td,.stats-table th,.stats-table td,.records-table th,.records-table td,.daily-table th,.daily-table td{font-size:13px;padding:8px 5px}
        }
    </style>
</head>
<body>
<header class="header">
    <div class="header-left"><div class="logo-icon">📦</div><h1>仓库管理系统</h1></div>
    <div class="header-stats" id="headerStats">
        <span class="sync-badge" id="syncBadge">🟡 连接中...</span>
        <span class="stat-chip">正常 <b id="statNormal">0</b></span>
        <span class="stat-chip">不可用 <b id="statUnavailable">0</b></span>
        <span class="stat-chip">已用 <b id="statUsed">0</b></span>
        <span class="stat-chip">产品 <b id="statProducts">0</b></span>
    </div>
</header>
<div class="main-container">
    <aside class="left-panel">
        <div class="left-panel-top">
            <span class="panel-title">仓位区域</span>
            <button class="btn btn-sm btn-outline" onclick="showZoneSortModal()">排序</button>
        </div>
        <div class="zone-list" id="zoneList"></div>
        <button class="add-zone-btn" id="btnAddZone">+ 添加区域</button>
    </aside>
    <main class="center-panel">
        <div class="center-header">
            <div><h2 id="currentZoneTitle">成品区</h2><span id="currentZoneInfo" style="font-size:11px;color:var(--text-secondary)"></span></div>
            <div class="legend"><span>🟢正常</span><span>🔴不可用</span><span>🔵已用</span><span>🟢今</span><span>🟠昨</span><span>🟠账</span><span>🟣转</span><span>🔴先</span><span>🟠产先</span><span>📝备</span></div>
            <button class="btn btn-outline btn-sm" id="btnToggleLocationBatch">库位批量</button>
        </div>
        <div class="location-batch-toolbar" id="locationBatchToolbar">
            <button class="btn btn-sm btn-success" onclick="batchStockInLocations()">批量入库</button>
            <button class="btn btn-sm btn-danger" onclick="batchDeleteLocations()">批量删除</button>
            <button class="btn btn-sm btn-info" onclick="batchAddToTransit()">批量加入中转仓</button>
            <button class="btn btn-sm btn-outline" onclick="exitLocationBatchMode()">退出</button>
        </div>
        <div class="grid-container" id="gridContainer"></div>
    </main>
    <aside class="right-panel">
        <div class="right-section"><h3>📦 产品</h3><div style="display:flex;gap:4px;"><button class="btn btn-outline btn-sm" id="btnToggleBatch">批量</button><button class="btn btn-primary btn-sm" id="btnAddProduct">+</button></div><div class="product-list" id="productList"></div><div class="batch-toolbar" id="batchToolbar"><button class="btn btn-sm btn-warning" onclick="batchUpdateUnit()">单位</button><button class="btn btn-sm btn-warning" onclick="batchUpdateUnitQuantity()">单位数量</button><button class="btn btn-sm btn-danger" onclick="batchDeleteProducts()">删除</button><button class="btn btn-sm btn-outline" onclick="clearSelectionAndExit()">取消</button></div></div>
        <div class="right-section"><h3>📊 统计</h3><div id="zoneStats" style="font-size:10px"></div></div>
        <div class="right-section"><h3>🧰 工具箱</h3>
            <button class="btn btn-outline btn-sm" id="btnShowFifo">FIFO批次排序</button>
            <button class="btn btn-outline btn-sm" id="btnShowStats">库存统计</button>
            <button class="btn btn-outline btn-sm" id="btnShowRecords">出入库记录</button>
            <button class="btn btn-outline btn-sm" id="btnShowDailyStats">每日统计</button>
            <button class="btn btn-outline btn-sm" id="btnShowDailyBatchStats">每日批次统计</button>
        </div>
        <div class="right-section"><h3>🚚 中转仓</h3><button class="btn btn-outline btn-sm" id="btnShowTransit">查看中转仓</button></div>
        <div class="right-section"><h3>🧹 智能排序</h3><button class="btn btn-outline btn-sm" id="btnSmartSort">开始排序</button></div>
        <div class="right-section"><h3>💾 数据</h3><div style="display:flex;gap:4px;flex-wrap:wrap;"><button class="btn btn-outline btn-sm" id="btnExportExcel">Excel</button><button class="btn btn-outline btn-sm" id="btnExportProducts">产品</button><button class="btn btn-outline btn-sm" id="btnImportProducts">导入</button><button class="btn btn-outline btn-sm" id="btnExportData">备份</button><button class="btn btn-outline btn-sm" id="btnImportData">恢复</button></div></div>
    </aside>
</div>
<div id="modalContainer"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
// ==================== Firebase 初始化 ====================
const firebaseConfig={apiKey:"AIzaSyDu1NYuTLUxIMkkaXdJGFgE0GXGW0hwXto",authDomain:"warehouse-manager-4eec5.firebaseapp.com",databaseURL:"https://warehouse-manager-4eec5-default-rtdb.firebaseio.com",projectId:"warehouse-manager-4eec5",storageBucket:"warehouse-manager-4eec5.firebasestorage.app",messagingSenderId:"504489473795",appId:"1:504489473795:web:4bfac7455150709994db36"};
firebase.initializeApp(firebaseConfig);
const database=firebase.database();
const dbRef=database.ref('warehouse/data');

// ==================== 全局状态 ====================
let db={zones:[],locations:[],products:[],records:[],dailyStats:[],dailyBatchStats:[],transit:[],nextZoneId:1,nextLocationId:1,nextProductId:1,nextRecordId:1,nextTransitId:1};
let currentZoneId=1,batchMode=false,selectedProducts=new Set(),locationBatchMode=false,selectedLocations=new Set(),isDBLoaded=false;
let statsGroupBy='name',fifoGroupBy='name';
let recordFilter='all',recordStartDate='',recordEndDate='',recordProductFilter='all',recordModelFilter='all';
let selectedProductFilters = new Set();
let transitFilterProduct = 'all';
let lastBatchNo = '';
let selectedTransitItems = new Set();
let fifoCombinedItems = [];
let fifoProductLocationCount = {};
let productLocationCountCache = {}; // 关键：全局声明

// ==================== 数据初始化与工具 ====================
function createDefaultDB(){
    const d={zones:[],locations:[],products:[],records:[],dailyStats:[],dailyBatchStats:[],transit:[],nextZoneId:1,nextLocationId:1,nextProductId:1,nextRecordId:1,nextTransitId:1};
    const bz={id:1,name:'成品区',rows:34,cols:5,isBase:true,createdAt:new Date().toISOString(),rowDetails:Array(34).fill(5)};
    d.zones.push(bz); d.nextZoneId=2;
    for(let r=1;r<=34;r++) for(let c=1;c<=5;c++) d.locations.push({id:d.nextLocationId++,zoneId:1,rowNum:r,colNum:c,status:'normal',productId:null,batchNo:null,quantity:0,customPieces:0,remark:'',handAccount:false,updatedAt:null,transferFlag:false,priorityFlag:false});
    return d;
}
function ensureCompleteDB(data){
    if(!data||typeof data!=='object')return createDefaultDB();
    if(!Array.isArray(data.zones))data.zones=[];
    if(!Array.isArray(data.locations))data.locations=[];
    if(!Array.isArray(data.products))data.products=[];
    if(!Array.isArray(data.records))data.records=[];
    if(!Array.isArray(data.dailyStats))data.dailyStats=[];
    if(!Array.isArray(data.dailyBatchStats))data.dailyBatchStats=[];
    if(!Array.isArray(data.transit))data.transit=[];
    if(!data.nextZoneId)data.nextZoneId=1;
    if(!data.nextLocationId)data.nextLocationId=1;
    if(!data.nextProductId)data.nextProductId=1;
    if(!data.nextRecordId)data.nextRecordId=1;
    if(!data.nextTransitId)data.nextTransitId=1;
    data.products.forEach(p=>{if(!p.unit)p.unit='件';if(!p.remark)p.remark='';if(p.isPriority===undefined)p.isPriority=false;});
    data.locations.forEach(l=>{if(!l.remark)l.remark='';if(l.customPieces===undefined)l.customPieces=0;if(l.handAccount===undefined)l.handAccount=false;if(l.transferFlag===undefined)l.transferFlag=false;if(l.priorityFlag===undefined)l.priorityFlag=false;});
    data.zones.forEach(z=>{if(!z.rowDetails)z.rowDetails=Array(z.rows).fill(z.cols);});
    return data;
}
function updateProductLocationCountCache(){
    productLocationCountCache = {};
    db.locations.forEach(l=>{ if(l.status==='used' && l.productId) productLocationCountCache[l.productId] = (productLocationCountCache[l.productId]||0)+1; });
    db.transit.forEach(t=>{ if(t.productId) productLocationCountCache[t.productId] = (productLocationCountCache[t.productId]||0)+1; });
}
function initFromFirebase(){
    const timeout=setTimeout(()=>{
        if(!isDBLoaded){db=createDefaultDB();isDBLoaded=true;updateProductLocationCountCache();renderAll();updateSyncBadge(false);showToast('Firebase连接超时','error');}
    },8000);
    dbRef.once('value',snapshot=>{
        clearTimeout(timeout);
        const raw=snapshot.val();
        db=ensureCompleteDB(raw||null);
        if(!raw)dbRef.set(db);
        isDBLoaded=true;
        updateProductLocationCountCache();
        updateDailyStatsIfNeeded();
        updateDailyBatchStatsIfNeeded();
        renderAll();
        startRealtimeListener();
        updateSyncBadge(true);
    }).catch(()=>{
        clearTimeout(timeout);
        db=createDefaultDB();isDBLoaded=true;updateProductLocationCountCache();renderAll();updateSyncBadge(false);showToast('无法连接云端','error');
    });
}
function startRealtimeListener(){
    dbRef.on('value',snapshot=>{
        const data=ensureCompleteDB(snapshot.val()||null);
        db=data;
        updateProductLocationCountCache();
        updateDailyStatsIfNeeded();
        updateDailyBatchStatsIfNeeded();
        renderAll();
        updateSyncBadge(true);
    });

}

function addRecord(targetDb,type,product,loc,zone,quantity,customPieces,remark,targetZoneName,targetLocationLabel,locationId){

        id:targetDb.nextRecordId++,

        quantity:quantity||0,
        customPieces:customPieces||0,
        batchNo:loc.batchNo||'',
        remark:remark||'',
        targetZoneName:targetZoneName||'',
        targetLocationLabel:targetLocationLabel||'',
        locationId:locationId||loc.id,
        timestamp:new Date().toISOString()
    };

function getProductDisplayInfo(pid){
    if(!db||!Array.isArray(db.products))return{pieces:0,unit:'件',unitQuantity:1,remark:'',isPriority:false};
    const p=db.products.find(x=>x.id===pid);
    if(!p)return{pieces:0,unit:'件',unitQuantity:1,remark:'',isPriority:false};
    const rp=db.locations.filter(l=>l.productId===pid&&l.status==='used').reduce((s,l)=>s+(l.quantity||0)*(p.unitQuantity||1),0);
    const cp=db.locations.filter(l=>l.productId===pid&&l.status==='used').reduce((s,l)=>s+(l.customPieces||0),0);
    const tp=db.transit.filter(t=>t.productId===pid).reduce((s,t)=>s+(t.quantity||0)*(p.unitQuantity||1)+(t.customPieces||0),0);
    return{pieces:rp+cp+tp,unit:p.unit||'件',unitQuantity:p.unitQuantity||1,remark:p.remark||'',isPriority:!!p.isPriority};
}
function getRowDisplayLabel(zone,rowNum){
    if(zone&&zone.id===1){
        if(rowNum<=17)return'A'+String(rowNum).padStart(2,'0');
        return'B'+String(rowNum-17).padStart(2,'0');
    }
    return String(rowNum);
}
function getDisplayColArray(zone,rowNum){
    let cols=zone.cols;
    if(zone.rowDetails && zone.rowDetails[rowNum-1]) cols=zone.rowDetails[rowNum-1];
    if(zone.id===1&&cols===5)return[3,2,4,1,5];
    return Array.from({length:cols},(_,i)=>i+1);
}
function getDisplayColNumber(zone,oc){
    const arr=getDisplayColArray(zone,1);
    const idx=arr.indexOf(oc);
    return idx!==-1?idx+1:oc;
}
function sortLocationsForDisplay(locs){
    const zoneOrder = new Map(db.zones.map((z, idx) => [z.id, idx]));
    return locs.sort((a,b)=>{
        const za = zoneOrder.has(a.zoneId) ? zoneOrder.get(a.zoneId) : Number.MAX_SAFE_INTEGER;
        const zb = zoneOrder.has(b.zoneId) ? zoneOrder.get(b.zoneId) : Number.MAX_SAFE_INTEGER;
        if(za !== zb) return za - zb;
        if(a.rowNum !== b.rowNum) return a.rowNum - b.rowNum;
        return a.colNum - b.colNum;
    });
}

function deleteZone(zoneId){
    const zone=db.zones.find(z=>z.id===zoneId);
    if(!zone||zone.isBase){showToast('基础仓位不可删除','error');return;}
    if(db.locations.some(l=>l.zoneId===zoneId&&l.status==='used')){showToast('有已用仓位','error');return;}

    const nd=JSON.parse(JSON.stringify(db));
    nd.locations=nd.locations.filter(l=>l.zoneId!==zoneId);
    nd.zones=nd.zones.filter(z=>z.id!==zoneId);

}
function addZone(){
    const name=document.getElementById('newZoneName').value.trim();
    const rows=parseInt(document.getElementById('newZoneRows').value);
    const cols=parseInt(document.getElementById('newZoneCols').value);
    const detailsStr=document.getElementById('newZoneRowDetails')?.value.trim();
    if(!name||!rows||!cols){showToast('请填写完整','error');return;}
    const nd=JSON.parse(JSON.stringify(db));
    const zone={id:nd.nextZoneId++,name,rows,cols,isBase:false,createdAt:new Date().toISOString(),rowDetails:[]};
    if(detailsStr){
        const arr=detailsStr.split(',').map(Number);
        for(let i=0;i<rows;i++) zone.rowDetails[i]=arr[i]||cols;
    } else {
        zone.rowDetails=Array(rows).fill(cols);
    }
    nd.zones.push(zone);
    for(let r=1;r<=rows;r++){
        const rowCols=zone.rowDetails[r-1];
        for(let c=1;c<=rowCols;c++){
            nd.locations.push({id:nd.nextLocationId++,zoneId:zone.id,rowNum:r,colNum:c,status:'normal',productId:null,batchNo:null,quantity:0,customPieces:0,remark:'',handAccount:false,updatedAt:null,transferFlag:false,priorityFlag:false});
        }
    }
    currentZoneId=zone.id;
    saveDB(nd);closeModal();showToast('已添加','success');
}
function showEditZoneModal(zoneId){
    const zone=db.zones.find(z=>z.id===zoneId);
    if(!zone) return;
    const detailsStr=zone.rowDetails?zone.rowDetails.join(','):'';
    openModal(`<h2>编辑区域</h2>
        <div class="form-group"><label>名称</label><input id="editZoneName" value="${zone.name}"></div>
        <div class="form-group"><label>排数</label><input type="number" id="editZoneRows" value="${zone.rows}" min="1"></div>
        <div class="form-group"><label>每排托数（逗号分隔，如 10,10,3）</label><input id="editZoneRowDetails" value="${detailsStr}"></div>
        <div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveEditZone(${zoneId})">保存</button></div>`);
}
function saveEditZone(zoneId){
    const nd=JSON.parse(JSON.stringify(db));
    const zone=nd.zones.find(z=>z.id===zoneId);
    if(!zone) return;
    const newName=document.getElementById('editZoneName').value.trim();
    const newRows=parseInt(document.getElementById('editZoneRows').value);
    const detailsStr=document.getElementById('editZoneRowDetails').value.trim();
    if(!newName||!newRows||newRows<1){showToast('请输入有效信息','error');return;}
    const newRowDetails=[];
    if(detailsStr){
        const arr=detailsStr.split(',').map(Number);
        for(let i=0;i<newRows;i++) newRowDetails[i]=arr[i]||zone.cols;
    } else {
        for(let i=0;i<newRows;i++) newRowDetails[i]=zone.cols;
    }
    const oldLocs=nd.locations.filter(l=>l.zoneId===zoneId);
    for(const loc of oldLocs){
        const rowCols=newRowDetails[loc.rowNum-1]||0;
        if(loc.status==='used' && loc.colNum>rowCols){
            showToast(`第${loc.rowNum}排有产品超出新托数，请先迁移`, 'error');
            return;
        }
    }
    zone.name=newName; zone.rows=newRows; zone.rowDetails=newRowDetails;
    nd.locations=nd.locations.filter(l=>{
        if(l.zoneId!==zoneId) return true;
        const rowCols=newRowDetails[l.rowNum-1]||0;
        if(l.rowNum>newRows || l.colNum>rowCols){
            if(l.status==='used') return true;
            return false;
        }
        return true;
    });
    for(let r=1;r<=newRows;r++){
        const rowCols=newRowDetails[r-1]||0;
        for(let c=1;c<=rowCols;c++){
            if(!nd.locations.some(l=>l.zoneId===zoneId && l.rowNum===r && l.colNum===c)){
                nd.locations.push({id:nd.nextLocationId++,zoneId,rowNum:r,colNum:c,status:'normal',productId:null,batchNo:null,quantity:0,customPieces:0,remark:'',handAccount:false,updatedAt:null,transferFlag:false,priorityFlag:false});
            }
        }
    }
    saveDB(nd);closeModal();renderAll();showToast('区域已更新','success');
}

function renderGridTable(locs,zone,rankMap){
    if(locs.length===0)return'';
    const rows=[...new Set(locs.map(l=>l.rowNum))].sort((a,b)=>a-b);
    let html='<div class="grid-table">';
    rows.forEach(r=>{
        const rowCols=zone.rowDetails? (zone.rowDetails[r-1]||zone.cols) : zone.cols;
        const displayCols=getDisplayColArray({...zone, cols:rowCols}, r);
        html+='<div class="grid-row"><div class="grid-row-label">'+getRowDisplayLabel(zone,r)+'</div>';
        for(let idx=0;idx<displayCols.length;idx++){
            const oc=displayCols[idx];
            const loc=locs.find(l=>l.rowNum===r&&l.colNum===oc);
            if(loc){
                let style='',rankBadge='',newBadge='',yesterdayBadge='',handBadge='',transferBadge='',priorityFlagBadge='',priorityProductBadge='',remarkBadge='',cbHtml='';
                if(loc.status==='used'){
                    const info=rankMap[loc.id];
                    if(info){style='background-color:'+getFifoColor(info.rank,info.total)+';border-color:'+getFifoBorderColor(info.rank,info.total)+';';rankBadge='<span class="fifo-rank">#'+(info.rank+1)+'/'+info.total+'</span>';}
                    else style='background-color:#1e88e5;border-color:#0d47a1;';
                    const updatedDate=loc.updatedAt?loc.updatedAt.split('T')[0]:null;
                    if(updatedDate){const today=new Date().toISOString().split('T')[0];const yesterday=new Date(Date.now()-86400000).toISOString().split('T')[0];if(updatedDate===today)newBadge='<span class="new-badge">今</span>';else if(updatedDate===yesterday)yesterdayBadge='<span class="yesterday-badge">昨</span>';}
                    if(loc.handAccount)handBadge='<span class="hand-badge">账</span>';
                    if(loc.transferFlag)transferBadge='<span class="transfer-badge">转</span>';
                    if(loc.priorityFlag)priorityFlagBadge='<span class="priority-flag-badge">先</span>';
                    if(loc.remark)remarkBadge='<span class="remark-badge">备</span>';
                }
                if(locationBatchMode)cbHtml='<input type="checkbox" class="select-checkbox"'+(selectedLocations.has(loc.id)?' checked':'')+' onclick="toggleLocationSelect('+loc.id+',event)">';
                let label='',batchInfo='',qtyInfo='';
                if(loc.status==='used'&&loc.productId){
                    const p=db.products.find(x=>x.id===loc.productId);
                    label=p?p.name:'未知产品';
                    if(p&&p.isPriority)priorityProductBadge='<span class="priority-badge">产先</span>';
                    const batchDate=loc.batchNo?String(loc.batchNo).slice(5).replace('-','/'):'';
                    batchInfo=batchDate;
                    if(loc.customPieces>0)qtyInfo=loc.customPieces+'件';
                    else qtyInfo=loc.quantity>0?loc.quantity+(p?.unit||'件'):'';
                }else if(loc.status==='unavailable')label='🚫';
                else label='托'+(idx+1);
                const click=locationBatchMode?'toggleLocationSelect('+loc.id+',event)':'handleCellClick('+loc.id+')';
                const cmenu=locationBatchMode?'':'handleCellRightClick('+loc.id+');return false;';
                html+='<div class="cell status-'+loc.status+'" style="'+style+'" onclick="'+click+'" oncontextmenu="'+cmenu+'">'+cbHtml+rankBadge+newBadge+yesterdayBadge+handBadge+transferBadge+priorityFlagBadge+priorityProductBadge+remarkBadge+'<span class="cell-label">'+label+'</span>'+(qtyInfo?'<span class="cell-qty">'+qtyInfo+'</span>':'')+(batchInfo?'<span class="cell-batch">'+batchInfo+'</span>':'')+'</div>';
            }else{
                html+='<div class="cell" style="border-style:dashed;opacity:.3;">托'+(idx+1)+'</div>';
            }
        }
        html+='</div>';
    });
    html+='</div>';
    return html;
}

function refreshRecordTable(){
  const wrap = document.getElementById('recTableWrap');
  if(!wrap) return;
  let filtered=db.records.filter(r=>{
    if(recordFilter!=='all' && r.type!==recordFilter) return false;
    const d=new Date(r.timestamp);
    const ds=d.toISOString().split('T')[0];
    if(recordStartDate && ds<recordStartDate) return false;
    if(recordEndDate && ds>recordEndDate) return false;
    if(recordProductFilters.size>0 && !recordProductFilters.has(r.productName)) return false;
    return true;
  }).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  let rows=filtered.map(r=>{
    const qs=r.customPieces>0?r.customPieces+'件':r.quantity+r.productUnit;
    const color=r.type==='入库'?'#34a853':(r.type==='发货'?'#f57c00':(r.type==='迁移'?'#9c27b0':(r.type==='加入中转仓'||r.type==='中转转移'||r.type==='替换产品'||r.type==='交换位置'?'#2196f3':'#ea4335')));
    const target=r.type==='迁移'?((r.targetZoneName||'')+' '+(r.targetLocationLabel||'')):'-';
    return '<tr><td><button class="btn btn-danger btn-sm" onclick="deleteRecord('+r.id+')">删除</button> <button class="btn btn-warning btn-sm" onclick="revokeRecord('+r.id+')">撤回</button></td><td style="color:'+color+';font-weight:600">'+r.type+'</td><td>'+r.productName+'</td><td>'+r.productModel+'</td><td>'+qs+'</td><td>'+r.zoneName+'</td><td>'+r.locationLabel+'</td><td>'+r.batchNo+'</td><td>'+target+'</td><td>'+(r.remark||'-')+'</td><td>'+new Date(r.timestamp).toLocaleString()+'</td></tr>';
  }).join('');

function deleteRecord(recordId){if(!db||!Array.isArray(db.records))return;if(!confirm('确定删除这条记录吗？'))return;const nd=JSON.parse(JSON.stringify(db));nd.records=nd.records.filter(r=>r.id!==recordId);saveDB(nd);showToast('记录已删除','success');refreshRecordTable();}
function revokeRecord(recordId){
  if(!db||!Array.isArray(db.records))return;
  const rec=db.records.find(r=>r.id===recordId);
  if(!rec){showToast('记录不存在','error');return;}
  if(!confirm('确定撤回该操作？'))return;
  const nd=JSON.parse(JSON.stringify(db));
  if(rec.type==='入库'){
    const loc=nd.locations.find(l=>l.id===rec.locationId);
    if(!loc){showToast('库位不存在','error');return;}
    if(loc.status==='used' && loc.productId===rec.productId){
      loc.status='normal';loc.productId=null;loc.batchNo=null;loc.quantity=0;loc.customPieces=0;loc.remark='';loc.handAccount=false;loc.updatedAt=null;loc.transferFlag=false;loc.priorityFlag=false;loc.inboundTime=null;loc.productStatus=null;loc.ticketAttached=false;
      nd.records=nd.records.filter(r=>r.id!==recordId);
      saveDB(nd);showToast('已撤回入库操作','success');refreshRecordTable();
    }else if(loc.status==='normal'){
      showToast('库位已清空，无需撤回','info');
    }else{
      showToast('库位状态与记录不符，无法撤回','error');
    }
    return;
  }
  if(rec.type==='出库' || rec.type==='发货'){
    const loc=nd.locations.find(l=>l.id===rec.locationId);
    if(!loc){showToast('库位不存在','error');return;}
    const product=nd.products.find(p=>p.id===rec.productId);
    if(!product){showToast('产品不存在','error');return;}
    const isCustom = rec.customPieces>0;
    if(loc.status==='normal'){
      loc.status='used';
      loc.productId=rec.productId;
      loc.batchNo=rec.batchNo || new Date().toISOString().slice(0,10);
      if(isCustom){loc.quantity=0;loc.customPieces=rec.customPieces;}
      else{loc.quantity=rec.quantity;loc.customPieces=0;}
      loc.updatedAt=new Date().toISOString();
      loc.productStatus=null;
      if(!loc.inboundTime) loc.inboundTime=rec.timestamp;
    }else if(loc.status==='used' && loc.productId===rec.productId){
      if(isCustom) loc.customPieces += rec.customPieces;
      else loc.quantity += rec.quantity;
    }else{
      showToast('库位状态与记录不符，无法撤回','error');
      return;
    }
    nd.records=nd.records.filter(r=>r.id!==recordId);
    saveDB(nd);showToast('已撤回','success');refreshRecordTable();
    return;
  }
  if(rec.type==='迁移'){
    if(!rec.sourceLocationId){showToast('该迁移记录缺少源库位信息，无法撤回','error');return;}
    const dstLoc=nd.locations.find(l=>l.id===rec.locationId);
    const srcLoc=nd.locations.find(l=>l.id===rec.sourceLocationId);
    if(!dstLoc||!srcLoc){showToast('库位不存在','error');return;}
    if(dstLoc.status!=='used'||dstLoc.productId!==rec.productId){
      showToast('目标库位状态已变，无法撤回','error');return;
    }
    if(srcLoc.status!=='normal'){
      showToast('源库位已被占用，无法撤回','error');return;
    }
    srcLoc.status='used';
    srcLoc.productId=dstLoc.productId;
    srcLoc.batchNo=dstLoc.batchNo;
    srcLoc.quantity=dstLoc.quantity;
    srcLoc.customPieces=dstLoc.customPieces;
    srcLoc.remark=dstLoc.remark;
    srcLoc.handAccount=dstLoc.handAccount;
    srcLoc.transferFlag=dstLoc.transferFlag;
    srcLoc.priorityFlag=dstLoc.priorityFlag;
    srcLoc.inboundTime=dstLoc.inboundTime;
    srcLoc.productStatus=dstLoc.productStatus;
    srcLoc.ticketAttached=dstLoc.ticketAttached;
    srcLoc.updatedAt=new Date().toISOString();
    dstLoc.status='normal';dstLoc.productId=null;dstLoc.batchNo=null;dstLoc.quantity=0;dstLoc.customPieces=0;dstLoc.remark='';dstLoc.handAccount=false;dstLoc.updatedAt=null;dstLoc.transferFlag=false;dstLoc.priorityFlag=false;dstLoc.inboundTime=null;dstLoc.productStatus=null;dstLoc.ticketAttached=false;
    nd.records=nd.records.filter(r=>r.id!==recordId);
    saveDB(nd);showToast('已撤回迁移','success');refreshRecordTable();
    return;
  }
  showToast('该类型记录不支持撤回','error');
}

function updateDailyStatsIfNeeded(){
  if(!db)return;
  const today=new Date().toISOString().split('T')[0];
  if(!db.dailyStats)db.dailyStats=[];
  const items=getDailyStatsItems();
  const last=db.dailyStats[db.dailyStats.length-1];
  if(last&&last.date===today){
    let changed=false;
    try{ changed = JSON.stringify(last.items)!==JSON.stringify(items); }catch(e){ changed=true; }
    if(!changed) return;
    last.items=items;
    if(db.dailyStats.length>14)db.dailyStats=db.dailyStats.slice(-14);
    saveDB(db);
    return;
  }
  db.dailyStats.push({date:today,items:items});
  if(db.dailyStats.length>14)db.dailyStats=db.dailyStats.slice(-14);
  saveDB(db);
}
function getDailyStatsItems(){
  const nameMap=new Map();
  db.products.forEach(p=>{
    if(!nameMap.has(p.name))nameMap.set(p.name,{pieces:0,units:new Set(),models:new Set(),locations:0});
    const e=nameMap.get(p.name);
    const info=getProductDisplayInfo(p.id);
    e.pieces+=info.pieces;
    e.units.add(p.unit);
    e.models.add(p.model||'无型号');
    e.locations += (productLocationCountCache[p.id] || 0);
  });
  const items=[];
  nameMap.forEach((data,name)=>{
    const specs=[...data.models].join('、');
    const unitStr=data.units.size===1?[...data.units][0]:'多单位';
    items.push({name,specs,pieces:data.pieces,unit:unitStr,locations:data.locations});
  });
  return items;
}

function compareDailyStats(){
  const startDate=document.getElementById('compareStartDate').value;
  const endDate=document.getElementById('compareEndDate').value;
  const filterProduct=document.getElementById('dailyCompareProductFilter')?.value || 'all';
  if(!startDate||!endDate){return;}

  const endDay=db.dailyStats.find(d=>d.date===endDate);
  if(!startDay||!endDay){showToast('日期数据不存在','error');return;}

  if(!db)return;

function getDailyBatchStatsItems(){
  const map = new Map();
  db.locations.filter(l => l.status === 'used').forEach(loc => {
    const p = db.products.find(x => x.id === loc.productId);
    if (!p || !loc.batchNo) return;
    const name = p.name || '未知产品';
    const key = name + '|' + loc.batchNo;
    if (!map.has(key)) map.set(key, {name, batchDate:loc.batchNo, count:0});
    map.get(key).count++;
  });
  db.transit.forEach(t => {
    const p = db.products.find(x => x.id === t.productId);
    if (!p || !t.batchNo) return;
    const name = p.name || '未知产品';
    const key = name + '|' + t.batchNo;
    if (!map.has(key)) map.set(key, {name, batchDate:t.batchNo, count:0});
    map.get(key).count++;
  });
  const items = [];
  db.products.forEach(p => {
    const name = p.name || '未知产品';
    const keys = [...map.keys()].filter(k => k.startsWith(name + '|')).sort();
    keys.forEach(k => {
      const item = map.get(k);
      items.push({name:item.name, batchDate:item.batchDate, count:item.count});
    });
  });
  map.forEach((item, key) => {
    if (!db.products.some(p => (p.name||'未知产品') === item.name)) {
      items.push({name:item.name, batchDate:item.batchDate, count:item.count});
    }
  });
  return items;
}

function compareDailyBatchStats(){
  const date1=document.getElementById('batchCompareDate1').value;
  const date2=document.getElementById('batchCompareDate2').value;
  const filterProduct=document.getElementById('batchCompareProductFilter')?.value || 'all';
  if(!date1||!date2){return;}
  if(date1===date2){showToast('请选择不同日期','error');return;}
  const day1=db.dailyBatchStats.find(d=>d.date===date1);
  const day2=db.dailyBatchStats.find(d=>d.date===date2);
  if(!day1||!day2){showToast('日期数据不存在','error');return;}
  const map1=new Map(); day1.items.forEach(item=>{const key=item.name+'|'+item.batchDate;map1.set(key,item.count);});
  const map2=new Map(); day2.items.forEach(item=>{const key=item.name+'|'+item.batchDate;map2.set(key,item.count);});
  let allKeys=[...new Set([...map1.keys(),...map2.keys()])];
  if(filterProduct!=='all') allKeys=allKeys.filter(key=>key.split('|')[0]===filterProduct);
  let rows='';
  allKeys.forEach(key=>{
    const count1=map1.get(key)||0;
    const count2=map2.get(key)||0;
    const diff=count2-count1;
    const color=diff>0?'#34a853':(diff<0?'#ea4335':'#333');
    const [name,batchDate]=key.split('|');
    rows+='<tr><td>'+name+'</td><td>'+batchDate+'</td><td>'+count1+'</td><td>'+count2+'</td><td style="color:'+color+';font-weight:600">'+(diff>0?'+'+diff:diff)+'</td></tr>';
  });
  document.getElementById('batchCompareResult').innerHTML='<table class="daily-table"><thead><tr><th>产品名称</th><th>批次日期</th><th>'+date1+'</th><th>'+date2+'</th><th>变化</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function buildShipOutput(){
  let items=[];
  db.locations.filter(l=>l.status==='used' && l.priorityFlag).forEach(loc=>{
    const p = db.products.find(x=>x.id===loc.productId);
    if(!p) return;
    if(shipProductFilters.size>0 && !shipProductFilters.has(p.id)) return;
    const timeStr = (loc.inboundTime || loc.updatedAt || '').slice(0,10);
    if(shipStartDate && (!timeStr || timeStr < shipStartDate)) return;
    if(shipEndDate && (!timeStr || timeStr > shipEndDate)) return;
    items.push({loc, p});
  });
  if(items.length===0) return {text:'（当前没有符合条件的先发产品）', count:0};

  const byProduct = new Map();
  items.forEach(({loc,p})=>{
    if(!byProduct.has(p.id)) byProduct.set(p.id, {p, locs:[]});
    byProduct.get(p.id).locs.push(loc);
  });

  let lines=[];
  let totalCount = 0;
  const orderedPids = db.products.map(x=>x.id).filter(id=>byProduct.has(id));
  orderedPids.forEach(pid=>{
    const {p, locs} = byProduct.get(pid);
    let maxBatch = '';
    locs.forEach(l=>{
      const b = l.batchNo || '';
      if(b && b > maxBatch) maxBatch = b;
    });
    const headLine = (p.name||'未知产品')+(p.model?' ('+p.model+')':'')+(maxBatch?'  最大批次:'+maxBatch:'');
    lines.push(headLine);
    const byZone = new Map();
    locs.forEach(l=>{
      if(!byZone.has(l.zoneId)) byZone.set(l.zoneId, []);
      byZone.get(l.zoneId).push(l);
    });
    const orderedZoneIds = db.zones.map(z=>z.id).filter(zid=>byZone.has(zid));
    orderedZoneIds.forEach(zid=>{
      const zone=db.zones.find(z=>z.id===zid);
      const zoneLocs=byZone.get(zid);
      const byRow = new Map();
      zoneLocs.forEach(l=>{
        if(!byRow.has(l.rowNum)) byRow.set(l.rowNum, []);
        byRow.get(l.rowNum).push(l);
      });
      const sortedRows=[...byRow.keys()].sort((a,b)=>a-b);
      sortedRows.forEach(rowNum=>{
        const rowLocs=byRow.get(rowNum).sort((a,b)=>getDisplayColNumber(zone,a.colNum)-getDisplayColNumber(zone,b.colNum));
        const rowLabel=getRowDisplayLabel(zone,rowNum);
        const colsPart=rowLocs.map(l=>'第'+getDisplayColNumber(zone,l.colNum)).join('、');
        lines.push(rowLabel+' '+colsPart);
        totalCount += rowLocs.length;
      });
    });
    lines.push('');
  });
  return {text: lines.join('\n').trim(), count: totalCount};
}
function renderShipList(){
  const c=document.getElementById('shipOutput');
  if(!c) return;
  const {text, count} = buildShipOutput();
  c.textContent = text;
  let totalEl = document.getElementById('shipTotalCount');
  if(!totalEl){
    totalEl = document.createElement('div');
    totalEl.id = 'shipTotalCount';
    totalEl.style.cssText='font-size:12px;color:#5f6368;margin-bottom:8px;font-family:inherit;';
    c.parentNode.insertBefore(totalEl, c);
  }
  totalEl.textContent = count>0 ? ('共 '+count+' 个库位') : '';
}
function copyShipOutput(){
  const c=document.getElementById('shipOutput');
  if(!c) return;
  const text=c.textContent||'';
  if(!text.trim()){showToast('无内容可复制','error');return;}
  const doCopy = ()=>{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>showToast('已复制到剪贴板','success')).catch(()=>fallbackCopy(text));
    }else{ fallbackCopy(text); }
  };
  const fallbackCopy=(t)=>{
    const ta=document.createElement('textarea');
    ta.value=t;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');showToast('已复制','success');}catch(e){showToast('复制失败','error');}
    document.body.removeChild(ta);
  };
  doCopy();
}

function getFifoRankMap(zoneId){
  if(!db||!Array.isArray(db.locations))return{};
  const used=db.locations.filter(l=>l.zoneId===zoneId&&l.status==='used'&&l.batchNo);
  const pg={};
  used.forEach(loc=>{const pid=loc.productId;if(!pid)return;if(!pg[pid])pg[pid]=[];pg[pid].push(loc);});
  const rm={};
  Object.keys(pg).forEach(pid=>{
    const locs=pg[pid];
    locs.sort((a,b)=>{
      const wa=getStatusWeight(getLocationEffectiveStatus(a));
      const wb=getStatusWeight(getLocationEffectiveStatus(b));
      if(wa!==wb)return wa-wb;
      if(a.priorityFlag&&!b.priorityFlag)return -1;
      if(!a.priorityFlag&&b.priorityFlag)return 1;
      return (a.batchNo||'').localeCompare(b.batchNo||'');
    });
    locs.forEach((loc,i)=>{rm[loc.id]={rank:i,total:locs.length,productId:parseInt(pid),isPriority:!!(db.products.find(p=>p.id===parseInt(pid))?.isPriority),priorityFlag:loc.priorityFlag};});
  });
  return rm;
}

    if(zoneFilter && !zoneFilter.has(loc.zoneId)) return;
    fifoCombinedItems.push({
      productId: loc.productId, batchNo: loc.batchNo, locationType: 'location', locationId: loc.id,
      zoneId: loc.zoneId, rowNum: loc.rowNum, colNum: loc.colNum, quantity: loc.quantity,
      customPieces: loc.customPieces, handAccount: loc.handAccount, priorityFlag: loc.priorityFlag,
      transferFlag: loc.transferFlag, remark: loc.remark, locStatus: loc.productStatus||null,
      ticketAttached: !!loc.ticketAttached,
      inboundTime: loc.inboundTime || null
    });
  });
  if(fifoMode !== 'ship' && fifoMode !== 'hand'){
    db.transit.filter(t=>t.batchNo).forEach(t=>{
      fifoCombinedItems.push({
        productId: t.productId, batchNo: t.batchNo, locationType:'transit', locationId: t.id,
        zoneId: null, rowNum: 0, colNum: 0, quantity: t.quantity, customPieces: t.customPieces,
        handAccount: t.handAccount, priorityFlag: t.priorityFlag, transferFlag: t.transferFlag,
        remark: t.remark, locStatus: t.productStatus||null, ticketAttached: !!t.ticketAttached,
        inboundTime: t.inboundTime || null
      });
    });
  }
}

function updateFifoContent(){

  if(fifoMode==='ship' || fifoMode==='hand'){

    });

    db.products.forEach((p,idx)=>{ if(!orderMap.has(p.id)) orderMap.set(p.id, idx); });
    items.sort((a,b)=>{
      const oa = orderMap.has(a.productId)?orderMap.get(a.productId):Number.MAX_SAFE_INTEGER;
      const ob = orderMap.has(b.productId)?orderMap.get(b.productId):Number.MAX_SAFE_INTEGER;
      if(oa!==ob) return oa-ob;
      const wa = getStatusWeight(a.locStatus || 'green');
      const wb = getStatusWeight(b.locStatus || 'green');
      if(wa!==wb) return wa-wb;
      if(a.priorityFlag && !b.priorityFlag) return -1;
      if(!a.priorityFlag && b.priorityFlag) return 1;
      return (a.batchNo||'').localeCompare(b.batchNo||'');
    });

    let html='<div class="fifo-ship-list">';
    items.forEach(item=>{
      const p = db.products.find(x=>x.id===item.productId);

            <span class="fs-batch">批次:${item.batchNo||'-'}</span>

  const orderMap2=new Map();
  db.products.forEach((p,index)=>{const key=fifoGroupBy==='name'?p.name:(p.model||'无型号');if(!orderMap2.has(key))orderMap2.set(key,index);});

function fifoShipOut(lid, isTransit){
  if(isTransit){
    transitShipOut(lid);
    return;
  }
  if(!db||!Array.isArray(db.locations))return;
  const loc=db.locations.find(l=>l.id===lid);
  if(!loc||loc.status!=='used'){showToast('状态异常','error');return;}
  if(!confirm('确认将该库位产品全部发货？'))return;
  const nd=JSON.parse(JSON.stringify(db));
  const nl=nd.locations.find(l=>l.id===lid);
  const product=db.products.find(p=>p.id===nl.productId);
  const zone=db.zones.find(z=>z.id===nl.zoneId);
  if(!product||!zone){showToast('数据错误','error');return;}
  const isCustom=nl.customPieces>0;
  addRecord(nd,'发货',product,{...nl,rowNum:nl.rowNum,colNum:nl.colNum},zone,isCustom?0:nl.quantity,isCustom?nl.customPieces:0,'FIFO发货',null,null,nl.id);
  nl.status='normal';nl.productId=null;nl.batchNo=null;nl.quantity=0;nl.customPieces=0;nl.remark='';
  nl.handAccount=false;nl.updatedAt=null;nl.transferFlag=false;nl.priorityFlag=false;nl.inboundTime=null;
  nl.productStatus=null;nl.ticketAttached=false;
  saveDB(nd);
  if(fifoCombinedItems){
    const idx=fifoCombinedItems.findIndex(x=>x.locationType==='location'&&x.locationId===lid);
    if(idx>-1) fifoCombinedItems.splice(idx,1);
  }
  showToast('发货成功','success');
  updateFifoContent();
}

  ns.status='normal';ns.productId=null;ns.batchNo=null;ns.quantity=0;ns.customPieces=0;ns.remark='';ns.handAccount=false;ns.updatedAt=null;ns.transferFlag=false;ns.priorityFlag=false;ns.inboundTime=null;ns.productStatus=null;ns.ticketAttached=false;
  if(product){

// ==================== 智能排序（P0–P3） ====================

// 配置持久化
let smartSortConfig = {
  targetZoneIds: new Set(),
  auxZoneIds: new Set(),
  strategy: 'product',
  direction: 'asc',
  compact: true
};

// 排序结果缓存 & 快照
let lastSmartSortResult = null;
let lastSortSnapshot = null;

// 库位标签辅助
function locLabelById(locId) {
  if (!locId) return '-';
  const l = db.locations.find(x => x.id === locId);
  if (!l) return '(已删除)';
  const z = db.zones.find(x => x.id === l.zoneId);
  if (!z) return '未知区域';
  return z.name + ' ' + getRowDisplayLabel(z, l.rowNum) + '排' + getDisplayColNumber(z, l.colNum) + '托';
}

// 排序策略比较器
function buildComparator(strategy, direction, db) {
  const dir = direction === 'desc' ? -1 : 1;
  const productOrder = new Map();
  const uqMap = new Map();
  db.products.forEach((p, i) => {
    productOrder.set(p.id, i);
    uqMap.set(p.id, p.unitQuantity || 1);
  });

  return (a, b) => {
    let cmp = 0;
    const oa = productOrder.has(a.productId) ? productOrder.get(a.productId) : 999999;
    const ob = productOrder.has(b.productId) ? productOrder.get(b.productId) : 999999;

    if (strategy === 'product') {
      if (oa !== ob) cmp = oa - ob;
      else {
        const wa = getStatusWeight(getLocationEffectiveStatus(a));
        const wb = getStatusWeight(getLocationEffectiveStatus(b));
        if (wa !== wb) cmp = wa - wb;
        else if (a.priorityFlag !== b.priorityFlag) cmp = a.priorityFlag ? -1 : 1;
        else cmp = (a.batchNo || '').localeCompare(b.batchNo || '');
      }
    } else if (strategy === 'batch') {
      cmp = (a.batchNo || '').localeCompare(b.batchNo || '');
      if (cmp === 0) cmp = oa - ob;
    } else if (strategy === 'status') {
      const wa = getStatusWeight(getLocationEffectiveStatus(a));
      const wb = getStatusWeight(getLocationEffectiveStatus(b));
      cmp = wa - wb;
      if (cmp === 0) cmp = oa - ob;
    } else if (strategy === 'qty') {
      const uqa = uqMap.get(a.productId) || 1;
      const uqb = uqMap.get(b.productId) || 1;
      const qa = (a.quantity || 0) * uqa + (a.customPieces || 0);
      const qb = (b.quantity || 0) * uqb + (b.customPieces || 0);
      cmp = qa - qb;
      if (cmp === 0) cmp = oa - ob;
    } else if (strategy === 'inbound') {
      const ta = a.inboundTime ? new Date(a.inboundTime).getTime() : 0;
      const tb = b.inboundTime ? new Date(b.inboundTime).getTime() : 0;
      cmp = ta - tb;
      if (cmp === 0) cmp = oa - ob;
    }
    return cmp * dir;
  };
}

// 循环置换移动计划
function buildMovePlan(assignments, allLocs, auxEmptyLocs, db) {
  if (!assignments || assignments.length === 0) return [];

  const pkey = (pid, batch) => (pid || 0) + '|' + (batch || '');

  const locCurrent = new Map();
  allLocs.forEach(loc => {
    locCurrent.set(loc.id, loc.status === 'used' ? pkey(loc.productId, loc.batchNo) : null);
  });

  const productCurrent = new Map();
  allLocs.forEach(loc => {
    if (loc.status === 'used') productCurrent.set(pkey(loc.productId, loc.batchNo), loc.id);
  });

  const productTarget = new Map();
  assignments.forEach(a => productTarget.set(pkey(a.productId, a.batchNo), a.targetLocId));

  const moves = [];
  const visited = new Set();
  const auxPool = [...auxEmptyLocs];

  productCurrent.forEach((srcLocId, key) => {
    if (visited.has(key)) return;
    const dstLocId = productTarget.get(key);
    if (dstLocId === undefined) return;
    if (srcLocId === dstLocId) { visited.add(key); return; }

    const chain = [key];
    visited.add(key);
    let curDst = dstLocId;
    let occupantKey = locCurrent.get(curDst);
    while (occupantKey && !visited.has(occupantKey)) {
      chain.push(occupantKey);
      visited.add(occupantKey);
      const nextDst = productTarget.get(occupantKey);
      if (nextDst === undefined) break;
      curDst = nextDst;
      occupantKey = locCurrent.get(curDst);
    }

    const lastKey = chain[chain.length - 1];
    const lastTarget = productTarget.get(lastKey);
    const isCycle = lastTarget !== undefined &&
                    locCurrent.get(lastTarget) === key &&
                    chain.length > 1;

    if (isCycle) {
      const firstKey = chain[0];
      const firstSrc = productCurrent.get(firstKey);
      const auxLoc = auxPool.shift();
      if (!auxLoc) {
        moves.push({
          type: '错误',
          message: '辅助区空位不足，无法完成 ' + chain.length + ' 个产品的循环交换（请选择更多辅助区域）'
        });
        return;
      }
      const [firstPid, firstBatch] = firstKey.split('|');
      moves.push({
        type: '移到辅助区',
        fromLocId: firstSrc,
        toLocId: auxLoc.id,
        productId: parseInt(firstPid),
        batchNo: firstBatch,
        reason: '破解循环（临时存放）'
      });
      for (let i = chain.length - 1; i >= 1; i--) {
        const k = chain[i];
        const kSrc = productCurrent.get(k);
        const kDst = productTarget.get(k);
        if (kDst === undefined || kSrc === kDst) continue;
        const [pid, batch] = k.split('|');
        moves.push({
          type: '移动产品',
          fromLocId: kSrc, toLocId: kDst,
          productId: parseInt(pid), batchNo: batch,
          reason: '排序调整'
        });
      }
      const firstDst = productTarget.get(firstKey);
      moves.push({
        type: '从辅助区移回',
        fromLocId: auxLoc.id, toLocId: firstDst,
        productId: parseInt(firstPid), batchNo: firstBatch,
        reason: '完成循环'
      });
    } else {
      for (let i = chain.length - 1; i >= 0; i--) {
        const k = chain[i];
        const kSrc = productCurrent.get(k);
        const kDst = productTarget.get(k);
        if (kDst === undefined || kSrc === kDst) continue;
        const [pid, batch] = k.split('|');
        moves.push({
          type: '移动产品',
          fromLocId: kSrc, toLocId: kDst,
          productId: parseInt(pid), batchNo: batch,
          reason: '排序调整'
        });
      }
    }
  });

  return moves;
}

// 执行排序
function executeSmartSort() {
  const strategy = document.getElementById('ssStrategy')?.value || smartSortConfig.strategy;
  const direction = document.getElementById('ssDirection')?.value || smartSortConfig.direction;
  const compact = document.getElementById('ssCompact')?.checked ?? smartSortConfig.compact;

  const tCards = document.querySelectorAll('#targetZoneCards .smart-select-card');
  if (tCards.length > 0 && tCards[0].offsetParent !== null) {
    smartSortConfig.targetZoneIds = new Set(
      [...document.querySelectorAll('#targetZoneCards .smart-select-card.active')].map(c => parseInt(c.dataset.value))
    );
    smartSortConfig.auxZoneIds = new Set(
      [...document.querySelectorAll('#auxZoneCards .smart-select-card.active')].map(c => parseInt(c.dataset.value))
    );
  } else {
    const tSel = document.querySelector('.smart-sort-target-multi');
    const aSel = document.querySelector('.smart-sort-aux-multi');
    if (tSel) smartSortConfig.targetZoneIds = new Set([...tSel.selectedOptions].map(o => parseInt(o.value)));
    if (aSel) smartSortConfig.auxZoneIds = new Set([...aSel.selectedOptions].map(o => parseInt(o.value)));
  }
  smartSortConfig.strategy = strategy;
  smartSortConfig.direction = direction;
  smartSortConfig.compact = compact;

  const targetZoneIds = [...smartSortConfig.targetZoneIds];
  const auxZoneIds = [...smartSortConfig.auxZoneIds];

  if (targetZoneIds.length === 0) { showToast('请至少选择一个目标区域', 'error'); return; }

  const comparator = buildComparator(strategy, direction, db);

  const auxEmptyLocs = db.locations
    .filter(l => auxZoneIds.includes(l.zoneId) && l.status === 'normal')
    .sort((a, b) => {
      if (a.zoneId !== b.zoneId) return a.zoneId - b.zoneId;
      if (a.rowNum !== b.rowNum) return a.rowNum - b.rowNum;
      return a.colNum - b.colNum;
    });

  let allAssignments = [];
  let allMoves = [];
  let totalUsed = 0;
  let affectedLocs = 0;

  targetZoneIds.forEach(targetZoneId => {
    const targetZone = db.zones.find(z => z.id === targetZoneId);
    if (!targetZone) return;

    const allLocs = db.locations
      .filter(l => l.zoneId === targetZoneId && l.status !== 'unavailable')
      .sort((a, b) => {
        if (a.rowNum !== b.rowNum) return a.rowNum - b.rowNum;
        return getDisplayColNumber(targetZone, a.colNum) - getDisplayColNumber(targetZone, b.colNum);
      });

    const usedLocs = allLocs.filter(l => l.status === 'used');
    if (usedLocs.length === 0) return;
    totalUsed += usedLocs.length;
    affectedLocs += allLocs.length;

    let assignments = [];

    if (compact) {
      const sortedUsed = [...usedLocs].sort(comparator);
      const targetLocs = allLocs.slice(0, sortedUsed.length);
      for (let i = 0; i < sortedUsed.length; i++) {
        if (sortedUsed[i].id === targetLocs[i].id) continue;
        assignments.push({
          sourceLocId: sortedUsed[i].id,
          targetLocId: targetLocs[i].id,
          productId: sortedUsed[i].productId,
          batchNo: sortedUsed[i].batchNo
        });
      }
    } else {
      const byProduct = {};
      usedLocs.forEach(loc => {
        const key = loc.productId + '|' + (loc.batchNo || '');
        if (!byProduct[key]) byProduct[key] = [];
        byProduct[key].push(loc);
      });
      Object.keys(byProduct).forEach(key => {
        const groupLocs = [...byProduct[key]].sort((a, b) => {
          if (a.rowNum !== b.rowNum) return a.rowNum - b.rowNum;
          return getDisplayColNumber(targetZone, a.colNum) - getDisplayColNumber(targetZone, b.colNum);
        });
        const sortedGroup = [...groupLocs].sort(comparator);
        for (let i = 0; i < groupLocs.length; i++) {
          if (sortedGroup[i].id === groupLocs[i].id) continue;
          assignments.push({
            sourceLocId: sortedGroup[i].id,
            targetLocId: groupLocs[i].id,
            productId: sortedGroup[i].productId,
            batchNo: sortedGroup[i].batchNo
          });
        }
      });
    }

    allAssignments = allAssignments.concat(assignments);

    const moves = buildMovePlan(assignments, allLocs, auxEmptyLocs, db);
    allMoves = allMoves.concat(moves);
  });

  const stats = {
    targetZoneCount: targetZoneIds.length,
    usedCount: totalUsed,
    affectedLocs: affectedLocs,
    moveCount: allMoves.filter(m => m.type !== '错误').length,
    auxUsed: allMoves.filter(m => m.type === '移到辅助区').length,
    hasError: allMoves.some(m => m.type === '错误')
  };

  lastSmartSortResult = {
    assignments: allAssignments,
    moves: allMoves,
    stats: stats,
    timestamp: Date.now()
  };

  showSmartSortResult(allAssignments, allMoves, stats);
}

// 结果展示

  }).filter(Boolean))];

      ${stats.auxUsed > 0 ? `<span>辅助区使用：<b style="color:#ff9800">${stats.auxUsed}</b></span>` : ''}

    <div style="display:flex;gap:6px;margin-bottom:10px;">

  } else {
    targetZoneIds.forEach(zoneId => {

      const zoneLocs = db.locations.filter(l => l.zoneId === zoneId);

      });
      assignments.forEach(a => { if (finalState.has(a.sourceLocId)) finalState.set(a.sourceLocId, null); });
      assignments.forEach(a => { if (finalState.has(a.targetLocId)) finalState.set(a.targetLocId, { productId: a.productId, batchNo: a.batchNo }); });

      finalHtml += `<h3 style="margin-top:12px;">${zone.name}</h3><div class="grid-container" style="overflow:auto;"><div class="grid-table">`;
      const rows = [...new Set(zoneLocs.map(l => l.rowNum))].sort((a, b) => a - b);
      rows.forEach(row => {
        const rowCols = zone.rowDetails ? (zone.rowDetails[row - 1] || zone.cols) : zone.cols;
        const cols = getDisplayColArray({ ...zone, cols: rowCols }, row);
        finalHtml += `<div class="grid-row"><div class="grid-row-label">${getRowDisplayLabel(zone, row)}</div>`;
        cols.forEach(col => {

          if (loc) {
            const state = finalState.get(loc.id);
            if (state) {
              const p = db.products.find(x => x.id === state.productId);
              const label = (p ? (p.name || '?') : '?') + (state.batchNo ? ' (' + state.batchNo + ')' : '');

            }

            finalHtml += `<div class="cell" style="border-style:dashed;opacity:.3;">-</div>`;
          }
        });
        finalHtml += `</div>`;
      });
      finalHtml += `</div></div>`;
    });
  }
  finalHtml += '</div></div>';

  let movesHtml = '<div id="ssPanelMoves" style="display:none;">';

  } else {

    moves.forEach((m, i) => {

        return;

      const prodLabel = p ? ((p.name || '未知') + (m.batchNo ? ' / ' + m.batchNo : '')) : '-';
      movesHtml += `<tr><td>${i + 1}</td><td>${m.type}</td><td>${fromLabel}</td><td>${toLabel}</td><td>${prodLabel}</td><td style="color:#5f6368;">${m.reason || ''}</td></tr>`;

  );
}

function switchSmartSortTab(tab) {
  const finalEl = document.getElementById('ssPanelFinal');
  const movesEl = document.getElementById('ssPanelMoves');
  const tabFinalBtn = document.getElementById('ssTabFinal');
  const tabMovesBtn = document.getElementById('ssTabMoves');

  finalEl.style.display = tab === 'final' ? 'block' : 'none';

  if (tabMovesBtn) tabMovesBtn.className = 'btn btn-sm ' + (tab === 'moves' ? 'btn-primary' : 'btn-outline');
}

// 应用排序
function applySmartSortPlan() {
  if (!lastSmartSortResult || !Array.isArray(lastSmartSortResult.moves)) {
    showToast('没有可执行的排序计划', 'error'); return;
  }
  const moves = lastSmartSortResult.moves;
  if (moves.length === 0) { showToast('无需移动', 'info'); return; }
  if (moves.some(m => m.type === '错误')) { showToast('计划包含错误，无法应用', 'error'); return; }
  if (!confirm('确认执行 ' + moves.length + ' 步移动？此操作会改变仓库布局。')) return;

  lastSortSnapshot = JSON.parse(JSON.stringify(db));

  const nd = JSON.parse(JSON.stringify(db));
  let successCount = 0, failCount = 0;

  for (const m of moves) {
    if (m.type === '错误') continue;
    const from = nd.locations.find(l => l.id === m.fromLocId);
    const to = nd.locations.find(l => l.id === m.toLocId);
    if (!from || !to) { failCount++; continue; }
    if (from.status !== 'used') { failCount++; continue; }

    to.status = 'used';
    to.productId = from.productId;
    to.batchNo = from.batchNo;
    to.quantity = from.quantity;
    to.customPieces = from.customPieces;
    to.remark = from.remark;
    to.handAccount = from.handAccount;
    to.transferFlag = true;
    to.priorityFlag = from.priorityFlag;
    to.inboundTime = from.inboundTime;
    to.productStatus = from.productStatus;
    to.ticketAttached = from.ticketAttached;
    to.updatedAt = new Date().toISOString();

    from.status = 'normal';
    from.productId = null;
    from.batchNo = null;
    from.quantity = 0;
    from.customPieces = 0;
    from.remark = '';
    from.handAccount = false;
    from.updatedAt = null;
    from.transferFlag = false;
    from.priorityFlag = false;
    from.inboundTime = null;
    from.productStatus = null;
    from.ticketAttached = false;

    const product = nd.products.find(p => p.id === m.productId);
    const srcZone = nd.zones.find(z => z.id === from.zoneId);
    const dstZone = nd.zones.find(z => z.id === to.zoneId);
    if (product) {
      const rec = addRecord(nd, '迁移', product, to, srcZone, 0, 0,
        '智能排序：' + (m.reason || '排序调整'),
        dstZone ? dstZone.name : '',
        dstZone ? (getRowDisplayLabel(dstZone, to.rowNum) + '排' + getDisplayColNumber(dstZone, to.colNum) + '托') : '',
        to.id);
      if (rec) rec.sourceLocationId = m.fromLocId;
    }
    successCount++;
  }

  saveDB(nd);
  closeModal();
  renderAll();

  let msg = '排序已应用，共 ' + successCount + ' 步';
  if (failCount > 0) msg += '（跳过 ' + failCount + ' 步）';
  showToast(msg, 'success');
}

// 撤销上次排序
function undoLastSort() {
  if (!lastSortSnapshot) { showToast('没有可撤销的排序', 'error'); return; }
  if (!confirm('撤销上一次排序，恢复到排序前的状态？')) return;
  try {
    db = ensureCompleteDB(JSON.parse(JSON.stringify(lastSortSnapshot)));
    lastSortSnapshot = null;
    saveDB(db);
    renderAll();
    closeModal();
    showToast('已撤销排序', 'success');
  } catch (e) {
    console.error(e);
    showToast('撤销失败：' + e.message, 'error');
  }
}

// 输出图片
function exportSmartSortImage() {
  const finalEl = document.getElementById('ssPanelFinal');
  if (finalEl && finalEl.style.display === 'none') switchSmartSortTab('final');
  const content = document.getElementById('smartSortResultContent');
  if (!content) { showToast('没有内容可输出', 'error'); return; }
  html2canvas(content, {
    scale: 2,
    width: content.scrollWidth,
    height: content.scrollHeight,
    windowWidth: content.scrollWidth,
    windowHeight: content.scrollHeight,
    useCORS: true
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = '智能排序结果_' + new Date().toISOString().slice(0, 10) + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('图片已生成', 'success');
  }).catch(err => {
    console.error(err);
    showToast('图片生成失败', 'error');
  });
}

// ==================== 区域排序 ====================
function showZoneSortModal(){
  if(!db||!Array.isArray(db.zones)){showToast('数据未加载','info');return;}
  let listHtml = '<div class="zone-sort-list" id="zoneSortList">';
  db.zones.forEach((zone,index)=>{listHtml += `<div class="zone-sort-item" draggable="true" data-zone-id="${zone.id}" ondragstart="onZoneDragStart(event)" ondragover="onZoneDragOver(event)" ondrop="onZoneDrop(event)" ondragend="onZoneDragEnd(event)"><span>☰</span><span>${zone.name}${zone.isBase?' (基础)':''}</span></div>`;});
  listHtml += '</div>';
  openModal(`<h2>🔄 区域排序</h2><p>拖动区域调整顺序</p>${listHtml}<div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveZoneOrder()">保存顺序</button></div>`);
  initZoneDragEvents();
}
let draggedZoneId = null;
function initZoneDragEvents(){const items = document.querySelectorAll('.zone-sort-item');items.forEach(item=>{item.addEventListener('dragstart', onZoneDragStart);item.addEventListener('dragover', onZoneDragOver);item.addEventListener('drop', onZoneDrop);item.addEventListener('dragend', onZoneDragEnd);});}
function onZoneDragStart(e){draggedZoneId = e.target.dataset.zoneId;e.target.classList.add('dragging');e.dataTransfer.effectAllowed = 'move';e.dataTransfer.setData('text/plain', draggedZoneId);}
function onZoneDragOver(e){e.preventDefault();e.dataTransfer.dropEffect = 'move';const target = e.target.closest('.zone-sort-item');if(!target) return;const container = document.getElementById('zoneSortList');const items = [...container.querySelectorAll('.zone-sort-item:not(.dragging)')];const afterElement = items.find(item => {const rect = item.getBoundingClientRect();return e.clientY < rect.top + rect.height / 2;});if(afterElement == null){container.appendChild(document.querySelector('.dragging'));}else{container.insertBefore(document.querySelector('.dragging'), afterElement);}}
function onZoneDrop(e){e.preventDefault();const target = e.target.closest('.zone-sort-item');if(!target) return;const container = document.getElementById('zoneSortList');const dragging = document.querySelector('.dragging');if(dragging && target !== dragging){const items = [...container.querySelectorAll('.zone-sort-item:not(.dragging)')];const afterElement = items.find(item => {const rect = item.getBoundingClientRect();return e.clientY < rect.top + rect.height / 2;});if(afterElement == null){container.appendChild(dragging);}else{container.insertBefore(dragging, afterElement);}}}
function onZoneDragEnd(e){e.target.classList.remove('dragging');draggedZoneId = null;}
function saveZoneOrder(){const container = document.getElementById('zoneSortList');if(!container) return;const items = [...container.querySelectorAll('.zone-sort-item')];const newOrder = items.map(item=>parseInt(item.dataset.zoneId));const nd = JSON.parse(JSON.stringify(db));nd.zones = newOrder.map(id=>db.zones.find(z=>z.id===id)).filter(Boolean);saveDB(nd);closeModal();renderZoneList();showToast('区域顺序已保存','success');}

// ==================== 数据导出导入 ====================
function exportExcel(){if(!db||!Array.isArray(db.products)||db.products.length===0){showToast('暂无数据','info');return;}const nm=new Map(),mm=new Map();db.products.forEach(p=>{if(!nm.has(p.name))nm.set(p.name,{pieces:0,units:new Set(),models:new Set()});const e=nm.get(p.name);const info=getProductDisplayInfo(p.id);e.pieces+=info.pieces;e.units.add(p.unit);e.models.add(p.model||'无型号');const key=p.model||'无型号';if(!mm.has(key))mm.set(key,{pieces:0,units:new Set(),names:new Set(),pn:[]});const m=mm.get(key);m.pieces+=info.pieces;m.units.add(p.unit);m.names.add(p.name);m.pn.push(p.name);});let html='<html><head><meta charset="UTF-8"></head><body><table><tr><th>名称</th><th>规格</th><th>总件数</th><th>单位</th></tr>';nm.forEach((d,n)=>{html+='<tr><td>'+n+'</td><td>'+[...d.models].join('、')+'</td><td>'+d.pieces+'</td><td>'+([...d.units].length===1?[...d.units][0]:'多单位')+'</td></tr>';});html+='</table><table><tr><th>产品名称</th><th>型号</th><th>产品数</th><th>总件数</th><th>单位</th></tr>';mm.forEach((d,m)=>{html+='<tr><td>'+d.pn.join('、')+'</td><td>'+m+'</td><td>'+d.names.size+'</td><td>'+d.pieces+'</td><td>'+([...d.units].length===1?[...d.units][0]:'多单位')+'</td></tr>';});html+='</table></body></html>';const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='统计_'+new Date().toISOString().slice(0,10)+'.xls';a.click();showToast('导出成功','success');}
function exportProductsData(){if(!db||!Array.isArray(db.products)||db.products.length===0){showToast('无产品','info');return;}const blob=new Blob([JSON.stringify(db.products,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='products_'+new Date().toISOString().slice(0,10)+'.json';a.click();showToast('导出成功','success');}
function importProductsData(file){if(!db||!Array.isArray(db.products)){showToast('数据未加载','info');return;}const reader=new FileReader();reader.onload=e=>{try{const products=JSON.parse(e.target.result);if(!Array.isArray(products)){showToast('需要数组','error');return;}const nd=JSON.parse(JSON.stringify(db));let added=0;products.forEach(item=>{if(!item.name||!item.unit)return;if(nd.products.some(p=>p.name===item.name&&(p.model||'')===(item.model||'')))return;nd.products.push({id:nd.nextProductId++,name:item.name,model:item.model||'',unit:item.unit,unitQuantity:item.unitQuantity||1,remark:item.remark||'',status:item.status||'green',isPriority:!!item.isPriority,createdAt:new Date().toISOString()});added++;});saveDB(nd);showToast('导入'+added+'个','success');}catch(err){showToast('解析失败','error');}};reader.readAsText(file);}
function exportData(){if(!db||!Array.isArray(db.zones)){showToast('数据未加载','info');return;}const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();showToast('导出成功','success');}
function importData(file){if(!db||!Array.isArray(db.zones)){showToast('数据未加载','info');return;}const reader=new FileReader();reader.onload=e=>{try{const imported=JSON.parse(e.target.result);if(!imported.zones||!imported.locations||!imported.products){showToast('格式错误','error');return;}if(!confirm('覆盖？'))return;saveDB(imported);if(!imported.zones.some(z=>z.id===currentZoneId))currentZoneId=imported.zones[0]?.id||null;renderAll();showToast('导入成功','success');}catch(err){showToast('解析失败','error');}};reader.readAsText(file);}

// ==================== 区域统计 ====================
function renderZoneStats(){const c=document.getElementById('zoneStats');if(!c||!db)return;const zone=db.zones.find(z=>z.id===currentZoneId);if(!zone){c.textContent='请选择区域';return;}const locs=db.locations.filter(l=>l.zoneId===zone.id);const n=locs.filter(l=>l.status==='normal').length,u=locs.filter(l=>l.status==='unavailable').length,s=locs.filter(l=>l.status==='used').length;const tp=locs.filter(l=>l.status==='used').reduce((sum,l)=>{const p=db.products.find(x=>x.id===l.productId);return sum+(l.quantity||0)*(p?.unitQuantity||1)+(l.customPieces||0);},0);c.innerHTML='<div>正常:'+n+' 不可用:'+u+' 已用:'+s+' 总件数:'+tp+'</div>';}
function updateHeaderStats(){if(!db||!Array.isArray(db.locations))return;const all=db.locations;document.getElementById('statNormal').textContent=all.filter(l=>l.status==='normal').length;document.getElementById('statUnavailable').textContent=all.filter(l=>l.status==='unavailable').length;document.getElementById('statUsed').textContent=all.filter(l=>l.status==='used').length;document.getElementById('statProducts').textContent=db.products.length;}
